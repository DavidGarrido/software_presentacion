<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; overflow:hidden; background:#0d0d1a; }

        .slide {
            width:100%; height:100%;
            display:flex; flex-direction:column;
            justify-content:center; align-items:center;
            padding:8% 10%;
            transition:opacity 0.25s ease;
        }
        .slide.hidden { opacity:0; pointer-events:none; }

        .slide-number {
            position:absolute; bottom:2.5%; right:3%;
            font-size:clamp(0.6rem, 1.2vw, 0.85rem);
            color:rgba(255,255,255,0.25);
            font-family:'Segoe UI', sans-serif;
            letter-spacing:0.05em;
        }

        .tag {
            font-size:clamp(0.55rem, 1vw, 0.75rem);
            text-transform:uppercase;
            letter-spacing:0.18em;
            color:rgba(0,212,255,0.7);
            margin-bottom:1.2em;
            font-family:'Segoe UI', sans-serif;
            font-weight:600;
        }

        h1 {
            font-family:'Segoe UI', Arial, sans-serif;
            font-size:clamp(1.6rem, 5vw, 4rem);
            font-weight:700;
            color:#ffffff;
            text-align:center;
            line-height:1.15;
            margin-bottom:0.6em;
            text-shadow:0 2px 20px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size:clamp(0.85rem, 2vw, 1.4rem);
            color:rgba(255,255,255,0.65);
            text-align:center;
            font-family:'Segoe UI', sans-serif;
            margin-bottom:1.8em;
            line-height:1.4;
        }

        .divider {
            width:60px; height:3px;
            background:linear-gradient(90deg, #00d4ff, #7b2ff7);
            border-radius:2px;
            margin:0 auto 1.8em;
        }

        ul.bullets {
            list-style:none;
            width:100%; max-width:860px;
            display:flex; flex-direction:column; gap:0.6em;
        }
        ul.bullets li {
            display:flex; align-items:flex-start; gap:0.7em;
            font-size:clamp(0.85rem, 1.8vw, 1.2rem);
            color:rgba(255,255,255,0.88);
            font-family:'Segoe UI', sans-serif;
            line-height:1.5;
            padding:0.5em 0.8em;
            background:rgba(255,255,255,0.04);
            border-radius:8px;
            border-left:3px solid rgba(0,212,255,0.35);
        }
        ul.bullets li::before {
            content:'›';
            color:#00d4ff;
            font-size:1.2em;
            line-height:1.4;
            flex-shrink:0;
        }

        /* Layout dos columnas */
        .cols {
            display:flex; gap:2em; width:100%; max-width:1000px;
            align-items:flex-start;
        }
        .cols .col { flex:1; }

        /* Imagen centrada */
        .img-wrap {
            max-width:70%; margin:0 auto;
        }
        .img-wrap img {
            width:100%; border-radius:12px;
            box-shadow:0 8px 40px rgba(0,0,0,0.5);
        }

        /* Highlight / cita */
        .highlight {
            font-size:clamp(1.2rem, 3.5vw, 2.4rem);
            font-weight:700;
            font-family:'Segoe UI', sans-serif;
            color:#00d4ff;
            text-align:center;
            padding:0.6em 1em;
            border:2px solid rgba(0,212,255,0.3);
            border-radius:16px;
            background:rgba(0,212,255,0.06);
            max-width:800px;
            line-height:1.3;
        }

        /* Slide de portada */
        .cover h1 { font-size:clamp(2rem, 7vw, 5rem); }
        .cover .subtitle { font-size:clamp(1rem, 2.5vw, 1.7rem); }
    </style>
</head>
<body>
<div id="root"></div>

<script>
    // ── Estado ───────────────────────────────────────────────────────────────
    let slides = [];
    let currentIndex = 0;

    // ── DB helper para cargar presentación por ID ────────────────────────────
    function openDB() {
        return new Promise((res, rej) => {
            const req = indexedDB.open('PresentacionesDB', 1);
            req.onupgradeneeded = e => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('presentations'))
                    db.createObjectStore('presentations', { keyPath:'id' });
                if (!db.objectStoreNames.contains('recordings'))
                    db.createObjectStore('recordings', { keyPath:'id' });
            };
            req.onsuccess = e => res(e.target.result);
            req.onerror   = e => rej(e.target.error);
        });
    }

    async function loadFromDB(id) {
        const db = await openDB();
        return new Promise((res, rej) => {
            const tx  = db.transaction('presentations', 'readonly');
            const req = tx.objectStore('presentations').get(id);
            req.onsuccess = e => res(e.target.result);
            req.onerror   = e => rej(e.target.error);
        });
    }

    // ── Render ───────────────────────────────────────────────────────────────
    function renderSlide(idx) {
        if (!slides.length) return;
        idx = Math.max(0, Math.min(idx, slides.length - 1));
        currentIndex = idx;
        const s    = slides[idx];
        const root = document.getElementById('root');

        // Fondo
        const bg = s.bg || '#0d0d1a';
        document.body.style.background = bg;

        // Construir contenido
        const lines = (s.content || '').split('\n').map(l => l.trim()).filter(Boolean);

        let contentHTML = '';

        if (s.layout === 'cover' || idx === 0 && !s.layout) {
            contentHTML = `
                <div class="tag">${s.tag || 'Presentación'}</div>
                <h1>${s.title}</h1>
                ${lines[0] ? `<p class="subtitle">${lines.join('<br>')}</p>` : ''}
            `;
        } else if (s.layout === 'highlight') {
            contentHTML = `
                <div class="tag">${s.tag || ''}</div>
                <h1>${s.title}</h1>
                <div class="divider"></div>
                <div class="highlight">${lines.join('<br>')}</div>
            `;
        } else if (s.layout === 'image' && lines[0]) {
            contentHTML = `
                <h1>${s.title}</h1>
                <div class="divider"></div>
                <div class="img-wrap"><img src="${lines[0]}" alt="${s.title}"></div>
            `;
        } else {
            // Default: título + bullets
            const bulletsHTML = lines.length
                ? `<ul class="bullets">${lines.map(l => `<li>${l}</li>`).join('')}</ul>`
                : '';
            contentHTML = `
                <div class="tag">${s.tag || ''}</div>
                <h1>${s.title}</h1>
                ${lines.length ? '<div class="divider"></div>' : ''}
                ${bulletsHTML}
            `;
        }

        root.innerHTML = `
            <div class="slide${idx === 0 && !s.layout ? ' cover' : ''}">
                ${contentHTML}
                <div class="slide-number">${idx + 1} / ${slides.length}</div>
            </div>
        `;

        // Notificar al presentador
        try { window.parent.postMessage({ action:'slideChanged', index:idx }, '*'); } catch(e){}
    }

    function showSlide(idx) { renderSlide(idx); }
    function nextSlide()    { renderSlide(currentIndex + 1); }
    function prevSlide()    { renderSlide(currentIndex - 1); }

    // ── Recibir mensajes del presentador ─────────────────────────────────────
    window.addEventListener('message', e => {
        const d = e.data;
        if (!d) return;
        if (d.action === 'load' && d.slides) {
            slides = d.slides;
            renderSlide(d.index ?? 0);
        }
        if (d.action === 'goto')  renderSlide(d.index);
        if (d.action === 'next')  nextSlide();
        if (d.action === 'prev')  prevSlide();
    });

    // ── Teclado (cuando está en foco / pantalla completa) ────────────────────
    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') nextSlide();
        if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')                    prevSlide();
    });

    // ── Carga inicial: desde URL param o postMessage ─────────────────────────
    (async () => {
        const params = new URLSearchParams(window.location.search);
        const id     = params.get('id');
        if (id) {
            try {
                const pres = await loadFromDB(id);
                if (pres && pres.slides) {
                    slides = pres.slides;
                    renderSlide(parseInt(params.get('slide') || '0'));
                }
            } catch(e) { console.warn('viewer: no se pudo cargar desde DB', e); }
        }
    })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Template Elegante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#f5f0eb; }
:root { --accent:#8b6914; --accent20:rgba(139,105,20,.18); --accent40:rgba(139,105,20,.4); --dark:#1a1612; }

#stage { width:100%; height:100%; position:relative; overflow:hidden; }

/* ── Slides ── */
.slide {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    padding:6% 12%;
    opacity:0; transform:translateY(24px);
    transition:opacity .6s cubic-bezier(.4,0,.2,1), transform .6s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
    background:#f5f0eb;
}
.slide.active { opacity:1; transform:translateY(0); pointer-events:auto; }
.slide.exit   { opacity:0; transform:translateY(-24px); }

/* Fondo personalizable (sutil - solo para bg field oscuros hace una versión clara) */
.slide-bg { position:absolute; inset:0; z-index:0; opacity:.06; }

/* Ornamento top/bottom */
.ornament {
    position:absolute; left:50%; transform:translateX(-50%);
    width:clamp(160px,30vw,320px); display:flex; align-items:center; gap:12px;
    pointer-events:none; z-index:2;
}
.ornament.top { top:32px; }
.ornament.bottom { bottom:32px; }
.orn-line { flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--accent40),transparent); }
.orn-diamond { width:8px; height:8px; background:var(--accent); transform:rotate(45deg); flex-shrink:0; }

/* Lateral accent bar */
.side-bar {
    position:absolute; left:7%; top:15%; bottom:15%;
    width:2px;
    background:linear-gradient(to bottom,transparent,var(--accent),transparent);
    z-index:2; pointer-events:none;
}
.side-dot {
    position:absolute; left:7%; top:50%;
    width:10px; height:10px; border-radius:50%;
    background:var(--accent); border:2px solid #f5f0eb;
    transform:translate(-4px,-50%);
    z-index:3; pointer-events:none;
}

/* ── Contenido ── */
.content {
    position:relative; z-index:5;
    width:100%; max-width:820px;
    display:flex; flex-direction:column;
    gap:1em;
}

.tag {
    font-family:'Inter',sans-serif;
    font-size:clamp(.48rem,.78vw,.65rem);
    font-weight:500; letter-spacing:.28em; text-transform:uppercase;
    color:var(--accent);
    display:flex; align-items:center; gap:10px;
}
.tag::before,.tag::after { content:''; flex:0 0 20px; height:1px; background:var(--accent); }

h1 {
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:clamp(2rem,5.5vw,4rem);
    font-weight:600; color:var(--dark);
    line-height:1.12; letter-spacing:-.01em;
}
.acc { color:var(--accent); font-style:italic; }

.subtitle {
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:clamp(1rem,2.2vw,1.5rem);
    font-weight:300; font-style:italic;
    color:rgba(26,22,18,.55); line-height:1.6;
}

/* Línea divisora elegante */
.divider {
    display:flex; align-items:center; gap:10px;
}
.divider-line { flex:1; height:1px; background:var(--accent40); }
.divider-diamond { width:6px; height:6px; background:var(--accent); transform:rotate(45deg); flex-shrink:0; }

/* Bullets */
.bullets { list-style:none; display:flex; flex-direction:column; gap:.65em; }
.bullets li {
    display:flex; align-items:flex-start; gap:.9em;
    font-family:'Inter',sans-serif;
    font-size:clamp(.78rem,1.6vw,1.08rem); color:rgba(26,22,18,.82); line-height:1.6;
    padding:.6em 0;
    border-bottom:1px solid rgba(139,105,20,.12);
}
.bullets li::before { content:'—'; color:var(--accent); font-size:.9em; margin-top:.05em; flex-shrink:0; }

/* Highlight */
.hl-box {
    border-left:3px solid var(--accent);
    padding:1em 1.5em;
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:clamp(1.2rem,3.2vw,2.4rem);
    font-weight:300; font-style:italic;
    color:var(--dark); line-height:1.4;
    background:rgba(139,105,20,.04);
}

/* Image */
.img-wrap {
    width:100%; max-height:58vh;
    border-radius:4px; overflow:hidden;
    box-shadow:0 12px 40px rgba(26,22,18,.2);
    border:1px solid rgba(139,105,20,.2);
}
.img-wrap img { width:100%; height:100%; object-fit:cover; display:block; }

/* Cover */
.cover-content { align-items:center; text-align:center; }
.cover-content h1 {
    font-size:clamp(2.8rem,7.5vw,5.5rem);
    font-weight:700;
}
.cover-monogram {
    width:clamp(60px,10vw,100px); height:clamp(60px,10vw,100px);
    border:2px solid var(--accent40);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(1.5rem,3.5vw,3rem);
    color:var(--accent);
    margin:0 auto;
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
}

/* Número */
.num {
    position:fixed; bottom:22px; right:28px; z-index:100;
    font-family:'Inter',sans-serif;
    font-size:.65rem; font-weight:500; letter-spacing:.12em;
    color:rgba(26,22,18,.3);
}
.num em { color:rgba(26,22,18,.6); font-style:normal; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="num"><em id="cNum">1</em> / <span id="cTotal">1</span></div>
<div id="camWrap" style="display:none;position:fixed;z-index:50;cursor:move;user-select:none;overflow:hidden;">
    <video id="camFeed" autoplay muted playsinline style="display:block;width:100%;height:100%;object-fit:cover;"></video>
</div>
<script>
let slides=[], cur=0, busy=false;

function rgb(hex){
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return{r,g,b};
}
function setAccent(c){
    // Para el template elegante, si el color es muy oscuro o saturado, lo suavizamos
    c=c||'#8b6914';
    const{r,g,b}=rgb(c);
    const s=document.documentElement.style;
    s.setProperty('--accent',c);
    s.setProperty('--accent20',`rgba(${r},${g},${b},.18)`);
    s.setProperty('--accent40',`rgba(${r},${g},${b},.4)`);
}
function mark(t){ return(t||'').replace(/\|\|(.+?)\|\|/g,'<span class="acc">$1</span>'); }

function buildSlide(s,idx){
    const lines=(s.content||'').split('\n').map(l=>l.trim()).filter(Boolean);
    const isFirst=idx===0, isLast=idx===slides.length-1;
    const isCover=s.layout==='cover'||(isFirst&&!s.layout)||(isLast&&!s.layout);
    const firstChar=(s.title||'A')[0].toUpperCase();
    let inner='';

    if(isCover){
        inner=`<div class="content cover-content">
            <div class="cover-monogram">${firstChar}</div>
            <div class="tag">${s.tag||''}</div>
            <h1>${mark(s.title||'')}</h1>
            ${lines[0]?`<p class="subtitle">${mark(lines.join(' · '))}</p>`:''}
        </div>`;
    } else if(s.layout==='highlight'){
        inner=`<div class="content" style="align-items:center;">
            <div class="tag">${s.tag||''}</div>
            <h1 style="text-align:center;">${mark(s.title||'')}</h1>
            <div class="divider"><div class="divider-line"></div><div class="divider-diamond"></div><div class="divider-line"></div></div>
            <div class="hl-box">${mark(lines.join('<br>'))}</div>
        </div>`;
    } else if(s.layout==='image'){
        inner=`<div class="content">
            <div class="tag">${s.tag||''}</div>
            <h1>${mark(s.title||'')}</h1>
            <div class="img-wrap"><img src="${lines[0]||''}" alt="${s.title||''}"></div>
        </div>`;
    } else {
        inner=`<div class="content">
            <div class="tag">${s.tag||''}</div>
            <h1>${mark(s.title||'')}</h1>
            <div class="divider"><div class="divider-line"></div><div class="divider-diamond"></div><div class="divider-line"></div></div>
            <ul class="bullets">${lines.map(l=>`<li>${mark(l)}</li>`).join('')}</ul>
        </div>`;
    }

    const d=document.createElement('div');
    d.className='slide'; d.dataset.index=idx;
    // El fondo de cada slide = muy sutil (overlay de color)
    const bgEl=`<div class="slide-bg" style="background:${s.bg||'transparent'};"></div>`;
    const ornaments=isCover?'':`
        <div class="ornament top"><div class="orn-line"></div><div class="orn-diamond"></div><div class="orn-line"></div></div>
        <div class="ornament bottom"><div class="orn-line"></div><div class="orn-diamond"></div><div class="orn-line"></div></div>
        ${s.layout===''?'<div class="side-bar"></div><div class="side-dot"></div>':''}
    `;
    d.innerHTML=bgEl+ornaments+inner;

    if(s.elements&&s.elements.length){
        const ov=document.createElement('div');
        ov.style.cssText='position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6;';
        s.elements.forEach((el,ei)=>{
            const dv=document.createElement('div');
            dv.style.cssText=`position:absolute;left:${el.x??0}%;top:${el.y??0}%;width:${el.w??20}%;height:${el.h??10}%;overflow:hidden;z-index:${ei+1};`;
            if(el.type==='text'){
                Object.assign(dv.style,{fontFamily:"'Cormorant Garamond',serif",color:el.color||'#1a1612',fontSize:(el.fontSize||2.5)+'vw',fontWeight:el.bold?'600':'300',textAlign:el.align||'left',lineHeight:'1.3',whiteSpace:'pre-wrap'});
                dv.textContent=el.content||'';
            } else if(el.type==='image'){
                const img=document.createElement('img');
                img.src=el.content||''; img.style.cssText=`width:100%;height:100%;object-fit:${el.fit||'contain'};border-radius:2px;`;
                dv.appendChild(img);
            }
            ov.appendChild(dv);
        });
        d.appendChild(ov);
    }
    return d;
}

function load(data,startIdx=0){
    slides=data.slides||[];
    if(data.accentColor) setAccent(data.accentColor);
    const stage=document.getElementById('stage');
    stage.innerHTML='';
    slides.forEach((s,i)=>stage.appendChild(buildSlide(s,i)));
    document.getElementById('cTotal').textContent=slides.length;
    show(startIdx,false);
}

function show(idx,animate=true){
    if(!slides.length||busy)return;
    idx=Math.max(0,Math.min(idx,slides.length-1));
    const prev=document.querySelector('.slide.active');
    const next=document.querySelectorAll('.slide')[idx];
    if(!next||prev===next)return;
    if(animate&&prev){
        busy=true; prev.classList.add('exit');
        setTimeout(()=>{ prev.classList.remove('active','exit'); busy=false; },600);
    } else if(prev){ prev.classList.remove('active','exit'); }
    next.classList.add('active');
    cur=idx;
    document.getElementById('cNum').textContent=idx+1;
    try{ window.parent.postMessage({action:'slideChanged',index:idx},'*'); }catch(e){}
}

// Cámara
let camStream=null, camDrag=false, ox=0, oy=0;
const camWrap=document.getElementById('camWrap'), camFeed=document.getElementById('camFeed');
function camSz(size,shape){ const w=Math.round(window.innerWidth*(parseInt(size)/100)); return{w,h:shape==='circle'?w:Math.round(w*9/16)}; }
function camPos(pos,w,h){ const pad=Math.round(window.innerWidth*.018),vw=window.innerWidth,vh=window.innerHeight;
    if(pos==='tl')return{x:pad,y:pad}; if(pos==='tr')return{x:vw-w-pad,y:pad};
    if(pos==='bl')return{x:pad,y:vh-h-pad}; if(pos==='center')return{x:(vw-w)/2,y:(vh-h)/2};
    if(pos==='full')return{x:0,y:0}; return{x:vw-w-pad,y:vh-h-pad}; }
function applyCam(cfg){
    const isFull=cfg.pos==='full';
    const{w,h}=isFull?{w:window.innerWidth,h:window.innerHeight}:camSz(cfg.size,cfg.shape);
    const{x,y}=camPos(cfg.pos,w,h);
    const r=isFull?'0':cfg.shape==='circle'?'50%':Math.round(w*.06)+'px';
    camWrap.style.cssText=`position:fixed;z-index:50;cursor:move;user-select:none;width:${w}px;height:${h}px;left:${x}px;top:${y}px;border-radius:${r};overflow:hidden;border:${isFull?'none':'2px solid rgba(26,22,18,.4)'};box-shadow:${isFull?'none':'0 4px 24px rgba(0,0,0,.35)'};`;
    camFeed.style.cssText=`width:${w}px;height:${h}px;object-fit:cover;display:block;transform:scaleX(${cfg.mirror?-1:1});`;
}
async function startCam(cfg){
    if(!camStream){ try{ camStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); camFeed.srcObject=camStream; }catch(e){return;} }
    applyCam(cfg); camWrap.style.display='block';
    if(window.parent!==window.top) camWrap.style.display='none';
}
function stopCam(){ camWrap.style.display='none'; if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;} camFeed.srcObject=null; }
camWrap.addEventListener('pointerdown',e=>{camDrag=true;ox=e.clientX-camWrap.offsetLeft;oy=e.clientY-camWrap.offsetTop;camWrap.setPointerCapture(e.pointerId);});
camWrap.addEventListener('pointermove',e=>{if(camDrag){camWrap.style.left=(e.clientX-ox)+'px';camWrap.style.top=(e.clientY-oy)+'px';}});
camWrap.addEventListener('pointerup',()=>camDrag=false);

window.addEventListener('message',e=>{
    const d=e.data; if(!d)return;
    if(d.action==='load'&&d.slides) load(d,d.index??0);
    if(d.action==='goto') show(d.index);
    if(d.action==='next') show(cur+1);
    if(d.action==='prev') show(cur-1);
    if(d.action==='camera'){if(d.enabled)startCam(d);else stopCam();}
});
document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') show(cur+1);
    if(e.key==='ArrowLeft'||e.key==='ArrowUp') show(cur-1);
});
</script>
</body>
</html>

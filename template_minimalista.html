<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Template Minimalista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,200;0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#fafafa; font-family:'DM Sans','Segoe UI',sans-serif; }
:root { --accent:#111; --accent-light:#e8e8e8; }

#stage { width:100%; height:100%; position:relative; overflow:hidden; }

.slide {
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:center; align-items:flex-start;
    padding:8% 12%;
    opacity:0; transform:translateY(16px);
    transition:opacity .55s cubic-bezier(.4,0,.2,1), transform .55s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
    background:#fafafa;
}
.slide.active { opacity:1; transform:translateY(0); pointer-events:auto; }
.slide.exit   { opacity:0; transform:translateY(-16px); }

/* Línea top decorativa */
.top-line {
    position:absolute; top:0; left:12%; right:12%;
    height:1px; background:var(--accent-light);
}
.top-dot {
    position:absolute; top:-3px; left:12%;
    width:7px; height:7px; border-radius:50%;
    background:var(--accent);
}

/* Contenido */
.content { width:100%; max-width:820px; display:flex; flex-direction:column; gap:1.4em; }

.tag {
    font-size:clamp(.48rem,.75vw,.62rem);
    font-weight:500; letter-spacing:.28em; text-transform:uppercase;
    color:rgba(0,0,0,.35);
}

h1 {
    font-size:clamp(1.8rem,5vw,3.8rem);
    font-weight:200; color:#111;
    line-height:1.12; letter-spacing:-.02em;
}
.acc { font-weight:500; color:var(--accent); }

.subtitle {
    font-size:clamp(.85rem,1.8vw,1.25rem);
    font-weight:300; color:rgba(0,0,0,.45); line-height:1.7;
    font-style:italic;
}

/* Línea divisora */
.rule { width:40px; height:1px; background:var(--accent); }

/* Bullets */
.bullets { list-style:none; display:flex; flex-direction:column; }
.bullets li {
    font-size:clamp(.8rem,1.6vw,1.1rem);
    font-weight:300; color:rgba(0,0,0,.75); line-height:1.7;
    padding:.6em 0;
    border-bottom:1px solid #ebebeb;
    display:flex; align-items:baseline; gap:1em;
}
.bullets li::before {
    content:counter(li);
    counter-increment:li;
    font-size:.65em; font-weight:500;
    color:var(--accent); min-width:1.5em;
    flex-shrink:0;
}
.bullets { counter-reset:li; }

/* Highlight */
.hl-box {
    border-left:3px solid var(--accent);
    padding:.8em 1.5em;
    font-size:clamp(1.1rem,2.8vw,2rem);
    font-weight:200; color:#111; line-height:1.45; font-style:italic;
}

/* Image */
.img-wrap {
    width:100%; max-height:60vh;
    overflow:hidden;
    box-shadow:0 2px 20px rgba(0,0,0,.08);
}
.img-wrap img { width:100%; height:100%; object-fit:cover; display:block; }

/* Cover */
.cover { justify-content:center; }
.cover h1 { font-size:clamp(2.5rem,7vw,5.5rem); }
.cover-sub { font-size:clamp(.9rem,2vw,1.4rem); font-weight:300; color:rgba(0,0,0,.4); line-height:1.6; }

/* Número */
.num {
    position:fixed; bottom:24px; right:32px; z-index:100;
    font-size:.65rem; font-weight:400; letter-spacing:.12em;
    color:rgba(0,0,0,.25);
}
.num em { color:rgba(0,0,0,.55); font-style:normal; }

/* Línea bottom */
.progress-bar {
    position:fixed; bottom:0; left:0; height:2px;
    background:var(--accent); z-index:100;
    transition:width .4s ease;
}
</style>
</head>
<body>
<div id="stage"></div>
<div class="num"><em id="cNum">1</em> / <span id="cTotal">1</span></div>
<div class="progress-bar" id="progressBar" style="width:0%;"></div>
<div id="camWrap" style="display:none;position:fixed;z-index:50;cursor:move;user-select:none;overflow:hidden;">
    <video id="camFeed" autoplay muted playsinline style="display:block;width:100%;height:100%;object-fit:cover;"></video>
</div>
<script>
let slides=[], cur=0, busy=false;

function setAccent(c){
    if(!c)return;
    document.documentElement.style.setProperty('--accent',c);
}
function mark(t){ return(t||'').replace(/\|\|(.+?)\|\|/g,'<span class="acc">$1</span>'); }

function buildSlide(s,idx){
    const lines=(s.content||'').split('\n').map(l=>l.trim()).filter(Boolean);
    const isFirst=idx===0, isLast=idx===slides.length-1;
    const isCover=s.layout==='cover'||(isFirst&&!s.layout)||(isLast&&!s.layout);
    const d=document.createElement('div');
    d.className='slide'; d.dataset.index=idx;

    const topDeco=`<div class="top-line"></div><div class="top-dot"></div>`;

    if(isCover){
        d.classList.add('cover');
        d.innerHTML=`${topDeco}
            <div class="content">
                <div class="tag">${s.tag||''}</div>
                <h1>${mark(s.title||'')}</h1>
                <div class="rule"></div>
                ${lines[0]?`<p class="cover-sub">${mark(lines.join(' · '))}</p>`:''}
            </div>`;
    } else if(s.layout==='highlight'){
        d.innerHTML=`${topDeco}
            <div class="content">
                <div class="tag">${s.tag||''}</div>
                <h1>${mark(s.title||'')}</h1>
                <div class="hl-box">${mark(lines.join('<br>'))}</div>
            </div>`;
    } else if(s.layout==='image'){
        d.innerHTML=`${topDeco}
            <div class="content">
                <div class="tag">${s.tag||''}</div>
                <h1>${mark(s.title||'')}</h1>
                <div class="img-wrap"><img src="${lines[0]||''}" alt="${s.title||''}"></div>
            </div>`;
    } else {
        d.innerHTML=`${topDeco}
            <div class="content">
                <div class="tag">${s.tag||''}</div>
                <h1>${mark(s.title||'')}</h1>
                <div class="rule"></div>
                <ul class="bullets">${lines.map(l=>`<li>${mark(l)}</li>`).join('')}</ul>
            </div>`;
    }

    if(s.elements&&s.elements.length){
        const ov=document.createElement('div');
        ov.style.cssText='position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6;';
        s.elements.forEach((el,ei)=>{
            const dv=document.createElement('div');
            dv.style.cssText=`position:absolute;left:${el.x??0}%;top:${el.y??0}%;width:${el.w??20}%;height:${el.h??10}%;overflow:hidden;z-index:${ei+1};`;
            if(el.type==='text'){Object.assign(dv.style,{fontFamily:"'DM Sans',sans-serif",color:el.color||'#111',fontSize:(el.fontSize||2.5)+'vw',fontWeight:el.bold?'500':'300',fontStyle:el.italic?'italic':'normal',textAlign:el.align||'left',lineHeight:'1.4',whiteSpace:'pre-wrap'});dv.textContent=el.content||'';}
            else if(el.type==='image'){const img=document.createElement('img');img.src=el.content||'';img.style.cssText=`width:100%;height:100%;object-fit:${el.fit||'contain'};`;dv.appendChild(img);}
            ov.appendChild(dv);
        });
        d.appendChild(ov);
    }
    return d;
}

function load(data,startIdx=0){
    slides=data.slides||[];
    if(data.accentColor) setAccent(data.accentColor);
    const stage=document.getElementById('stage');
    stage.innerHTML='';
    slides.forEach((s,i)=>stage.appendChild(buildSlide(s,i)));
    document.getElementById('cTotal').textContent=slides.length;
    show(startIdx,false);
}

function show(idx,animate=true){
    if(!slides.length||busy)return;
    idx=Math.max(0,Math.min(idx,slides.length-1));
    const prev=document.querySelector('.slide.active');
    const next=document.querySelectorAll('.slide')[idx];
    if(!next||prev===next)return;
    if(animate&&prev){busy=true;prev.classList.add('exit');setTimeout(()=>{prev.classList.remove('active','exit');busy=false;},550);}
    else if(prev){prev.classList.remove('active','exit');}
    next.classList.add('active');
    cur=idx;
    document.getElementById('cNum').textContent=idx+1;
    document.getElementById('progressBar').style.width=((idx+1)/slides.length*100)+'%';
    try{window.parent.postMessage({action:'slideChanged',index:idx},'*');}catch(e){}
}

let camStream=null,camDrag=false,ox=0,oy=0;
const camWrap=document.getElementById('camWrap'),camFeed=document.getElementById('camFeed');
function camSz(size,shape){const w=Math.round(window.innerWidth*(parseInt(size)/100));return{w,h:shape==='circle'?w:Math.round(w*9/16)};}
function camPos(pos,w,h){const pad=Math.round(window.innerWidth*.018),vw=window.innerWidth,vh=window.innerHeight;if(pos==='tl')return{x:pad,y:pad};if(pos==='tr')return{x:vw-w-pad,y:pad};if(pos==='bl')return{x:pad,y:vh-h-pad};if(pos==='center')return{x:(vw-w)/2,y:(vh-h)/2};if(pos==='full')return{x:0,y:0};return{x:vw-w-pad,y:vh-h-pad};}
function applyCam(cfg){const isFull=cfg.pos==='full';const{w,h}=isFull?{w:window.innerWidth,h:window.innerHeight}:camSz(cfg.size,cfg.shape);const{x,y}=camPos(cfg.pos,w,h);const r=isFull?'0':cfg.shape==='circle'?'50%':Math.round(w*.06)+'px';camWrap.style.cssText=`position:fixed;z-index:50;cursor:move;user-select:none;width:${w}px;height:${h}px;left:${x}px;top:${y}px;border-radius:${r};overflow:hidden;border:${isFull?'none':'2px solid rgba(0,0,0,.2)'};box-shadow:${isFull?'none':'0 4px 24px rgba(0,0,0,.15)'};`;camFeed.style.cssText=`width:${w}px;height:${h}px;object-fit:cover;display:block;transform:scaleX(${cfg.mirror?-1:1});`;}
async function startCam(cfg){if(!camStream){try{camStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});camFeed.srcObject=camStream;}catch(e){return;}}applyCam(cfg);camWrap.style.display='block';if(window.parent!==window.top)camWrap.style.display='none';}
function stopCam(){camWrap.style.display='none';if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}camFeed.srcObject=null;}
camWrap.addEventListener('pointerdown',e=>{camDrag=true;ox=e.clientX-camWrap.offsetLeft;oy=e.clientY-camWrap.offsetTop;camWrap.setPointerCapture(e.pointerId);});
camWrap.addEventListener('pointermove',e=>{if(camDrag){camWrap.style.left=(e.clientX-ox)+'px';camWrap.style.top=(e.clientY-oy)+'px';}});
camWrap.addEventListener('pointerup',()=>camDrag=false);

window.addEventListener('message',e=>{
    const d=e.data;if(!d)return;
    if(d.action==='load'&&d.slides)load(d,d.index??0);
    if(d.action==='goto')show(d.index);
    if(d.action==='next')show(cur+1);
    if(d.action==='prev')show(cur-1);
    if(d.action==='camera'){if(d.enabled)startCam(d);else stopCam();}
});
document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ')show(cur+1);
    if(e.key==='ArrowLeft'||e.key==='ArrowUp')show(cur-1);
});
</script>
</body>
</html>

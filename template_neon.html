<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Template Neón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Inter',sans-serif; }
:root { --neon:#00fff5; --neon2:#bf00ff; --neon-glow:0 0 8px #00fff5, 0 0 20px rgba(0,255,245,.4); }

/* Rejilla de fondo */
#grid {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
        linear-gradient(rgba(0,255,245,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,245,.04) 1px, transparent 1px);
    background-size:60px 60px;
}
/* Líneas de escaner */
#scanline {
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:repeating-linear-gradient(
        to bottom,
        transparent 0, transparent 3px,
        rgba(0,255,245,.015) 3px, rgba(0,255,245,.015) 4px
    );
}
/* Esquinas neon */
.corner {
    position:fixed; width:50px; height:50px; z-index:2; pointer-events:none;
}
.corner.tl { top:18px; left:18px; border-top:2px solid var(--neon); border-left:2px solid var(--neon); box-shadow:-2px -2px 10px rgba(0,255,245,.4); }
.corner.tr { top:18px; right:18px; border-top:2px solid var(--neon); border-right:2px solid var(--neon); box-shadow:2px -2px 10px rgba(0,255,245,.4); }
.corner.bl { bottom:18px; left:18px; border-bottom:2px solid var(--neon); border-left:2px solid var(--neon); box-shadow:-2px 2px 10px rgba(0,255,245,.4); }
.corner.br { bottom:18px; right:18px; border-bottom:2px solid var(--neon); border-right:2px solid var(--neon); box-shadow:2px 2px 10px rgba(0,255,245,.4); }

#stage { position:fixed; inset:0; z-index:3; display:flex; align-items:center; justify-content:center; }

.slide {
    position:absolute; inset:0; padding:7% 10%;
    display:flex; flex-direction:column; justify-content:center; align-items:flex-start;
    opacity:0; transform:translateX(30px) skewX(-1deg);
    transition:opacity .4s ease, transform .4s ease;
    pointer-events:none;
}
.slide.active { opacity:1; transform:translateX(0) skewX(0); pointer-events:auto; }
.slide.exit   { opacity:0; transform:translateX(-30px) skewX(1deg); }

/* Fondo por slide (overlay oscuro sobre el grid) */
.slide-bg { position:absolute; inset:0; z-index:0; opacity:.85; }

.content { position:relative; z-index:5; width:100%; max-width:900px; display:flex; flex-direction:column; gap:1em; }

.tag {
    font-family:'Orbitron',monospace;
    font-size:clamp(.45rem,.75vw,.62rem);
    font-weight:400; letter-spacing:.3em; text-transform:uppercase;
    color:var(--neon); text-shadow:var(--neon-glow);
    display:flex; align-items:center; gap:10px;
}
.tag::before { content:''; display:block; width:20px; height:1px; background:var(--neon); box-shadow:0 0 6px var(--neon); }

h1 {
    font-family:'Orbitron',monospace;
    font-size:clamp(1.6rem,4.5vw,3.5rem);
    font-weight:900; color:#fff;
    line-height:1.1; letter-spacing:-.01em;
    text-shadow:0 0 30px rgba(255,255,255,.2);
}
.acc { color:var(--neon); text-shadow:var(--neon-glow); }

.subtitle {
    font-size:clamp(.8rem,1.6vw,1.15rem);
    color:rgba(255,255,255,.5); font-weight:300; line-height:1.6;
    font-family:'Inter',sans-serif;
}

/* Bullets */
.bullets { list-style:none; display:flex; flex-direction:column; gap:.55em; }
.bullets li {
    font-size:clamp(.75rem,1.5vw,1.05rem);
    color:rgba(255,255,255,.82); line-height:1.5;
    padding:.6em 1em .6em 1.2em;
    background:rgba(0,255,245,.04);
    border-left:2px solid var(--neon);
    border-radius:0 4px 4px 0;
    position:relative;
    box-shadow:inset 0 0 20px rgba(0,255,245,.03);
}
.bullets li::before { content:'▸'; color:var(--neon); margin-right:.6em; text-shadow:var(--neon-glow); font-size:.9em; }

/* Highlight */
.hl-box {
    border:1px solid var(--neon);
    border-radius:4px;
    padding:1.2em 2em;
    font-family:'Orbitron',monospace;
    font-size:clamp(1rem,2.8vw,2rem);
    font-weight:700; color:#fff; line-height:1.3; text-align:center;
    background:rgba(0,255,245,.04);
    box-shadow:0 0 30px rgba(0,255,245,.15), inset 0 0 30px rgba(0,255,245,.05);
    align-self:stretch;
}

/* Image */
.img-wrap {
    width:100%; max-height:58vh;
    border-radius:4px; overflow:hidden;
    border:1px solid var(--neon);
    box-shadow:0 0 40px rgba(0,255,245,.2);
}
.img-wrap img { width:100%; height:100%; object-fit:cover; display:block; }

/* Cover */
.cover .tag { margin-bottom:.5em; }
.cover h1 { font-size:clamp(2.2rem,6.5vw,5rem); }
.neon-line {
    width:clamp(60px,10vw,120px); height:3px;
    background:linear-gradient(90deg,var(--neon),var(--neon2));
    box-shadow:0 0 12px var(--neon), 0 0 24px rgba(191,0,255,.3);
    border-radius:2px;
}

/* Counter */
.num {
    position:fixed; bottom:20px; right:28px; z-index:100;
    font-family:'Orbitron',monospace; font-size:.6rem; font-weight:400;
    letter-spacing:.15em; color:rgba(0,255,245,.4);
}
.num em { color:var(--neon); font-style:normal; text-shadow:var(--neon-glow); }
</style>
</head>
<body>
<div id="grid"></div>
<div id="scanline"></div>
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>
<div id="stage"></div>
<div class="num"><em id="cNum">1</em> / <span id="cTotal">1</span></div>
<div id="camWrap" style="display:none;position:fixed;z-index:50;cursor:move;user-select:none;overflow:hidden;">
    <video id="camFeed" autoplay muted playsinline style="display:block;width:100%;height:100%;object-fit:cover;"></video>
</div>
<script>
let slides=[], cur=0, busy=false;

function setAccent(c){
    c=c||'#00fff5';
    const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
    const s=document.documentElement.style;
    s.setProperty('--neon',c);
    s.setProperty('--neon-glow',`0 0 8px ${c}, 0 0 20px rgba(${r},${g},${b},.4)`);
    // Actualizar esquinas
    document.querySelectorAll('.corner.tl,.corner.bl').forEach(el=>{ el.style.borderColor=c; });
    document.querySelectorAll('.corner.tr,.corner.br').forEach(el=>{ el.style.borderColor=c; });
    document.getElementById('grid').style.backgroundImage=
        `linear-gradient(rgba(${r},${g},${b},.04) 1px,transparent 1px),linear-gradient(90deg,rgba(${r},${g},${b},.04) 1px,transparent 1px)`;
}
function mark(t){ return(t||'').replace(/\|\|(.+?)\|\|/g,'<span class="acc">$1</span>'); }

function buildSlide(s,idx){
    const lines=(s.content||'').split('\n').map(l=>l.trim()).filter(Boolean);
    const bg=s.bg||'linear-gradient(145deg,#000,#050520)';
    const isFirst=idx===0, isLast=idx===slides.length-1;
    const isCover=s.layout==='cover'||(isFirst&&!s.layout)||(isLast&&!s.layout);
    let inner='';

    if(isCover){
        inner=`<div class="content cover">
            <div class="tag">${s.tag||''}</div>
            <div class="neon-line"></div>
            <h1>${mark(s.title||'')}</h1>
            ${lines[0]?`<p class="subtitle">${mark(lines.join(' · '))}</p>`:''}
        </div>`;
    } else if(s.layout==='highlight'){
        inner=`<div class="content" style="align-items:center;text-align:center;">
            <div class="tag" style="align-self:center;">${s.tag||''}</div>
            <h1>${mark(s.title||'')}</h1>
            <div class="hl-box">${mark(lines.join('<br>'))}</div>
        </div>`;
    } else if(s.layout==='image'){
        inner=`<div class="content">
            <div class="tag">${s.tag||''}</div>
            <h1>${mark(s.title||'')}</h1>
            <div class="img-wrap"><img src="${lines[0]||''}" alt="${s.title||''}"></div>
        </div>`;
    } else {
        inner=`<div class="content">
            <div class="tag">${s.tag||''}</div>
            <h1>${mark(s.title||'')}</h1>
            <ul class="bullets">${lines.map(l=>`<li>${mark(l)}</li>`).join('')}</ul>
        </div>`;
    }

    const d=document.createElement('div');
    d.className='slide'; d.dataset.index=idx;
    d.innerHTML=`<div class="slide-bg" style="background:${bg};"></div>${inner}`;
    if(s.elements&&s.elements.length){
        const ov=document.createElement('div');
        ov.style.cssText='position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6;';
        s.elements.forEach((el,ei)=>{
            const dv=document.createElement('div');
            dv.style.cssText=`position:absolute;left:${el.x??0}%;top:${el.y??0}%;width:${el.w??20}%;height:${el.h??10}%;overflow:hidden;z-index:${ei+1};`;
            if(el.type==='text'){Object.assign(dv.style,{fontFamily:"'Orbitron',monospace",color:el.color||'#fff',fontSize:(el.fontSize||2.5)+'vw',fontWeight:el.bold?'700':'400',textAlign:el.align||'left',lineHeight:'1.3',whiteSpace:'pre-wrap'});dv.textContent=el.content||'';}
            else if(el.type==='image'){const img=document.createElement('img');img.src=el.content||'';img.style.cssText=`width:100%;height:100%;object-fit:${el.fit||'contain'};`;dv.appendChild(img);}
            ov.appendChild(dv);
        });
        d.appendChild(ov);
    }
    return d;
}

function load(data,startIdx=0){
    slides=data.slides||[];
    if(data.accentColor) setAccent(data.accentColor);
    const stage=document.getElementById('stage');
    stage.innerHTML='';
    slides.forEach((s,i)=>stage.appendChild(buildSlide(s,i)));
    document.getElementById('cTotal').textContent=slides.length;
    show(startIdx,false);
}

function show(idx,animate=true){
    if(!slides.length||busy)return;
    idx=Math.max(0,Math.min(idx,slides.length-1));
    const prev=document.querySelector('.slide.active');
    const next=document.querySelectorAll('.slide')[idx];
    if(!next||prev===next)return;
    if(animate&&prev){busy=true;prev.classList.add('exit');setTimeout(()=>{prev.classList.remove('active','exit');busy=false;},400);}
    else if(prev){prev.classList.remove('active','exit');}
    next.classList.add('active');
    cur=idx;
    document.getElementById('cNum').textContent=idx+1;
    try{window.parent.postMessage({action:'slideChanged',index:idx},'*');}catch(e){}
}

let camStream=null,camDrag=false,ox=0,oy=0;
const camWrap=document.getElementById('camWrap'),camFeed=document.getElementById('camFeed');
function camSz(size,shape){const w=Math.round(window.innerWidth*(parseInt(size)/100));return{w,h:shape==='circle'?w:Math.round(w*9/16)};}
function camPos(pos,w,h){const pad=Math.round(window.innerWidth*.018),vw=window.innerWidth,vh=window.innerHeight;if(pos==='tl')return{x:pad,y:pad};if(pos==='tr')return{x:vw-w-pad,y:pad};if(pos==='bl')return{x:pad,y:vh-h-pad};if(pos==='center')return{x:(vw-w)/2,y:(vh-h)/2};if(pos==='full')return{x:0,y:0};return{x:vw-w-pad,y:vh-h-pad};}
function applyCam(cfg){const isFull=cfg.pos==='full';const{w,h}=isFull?{w:window.innerWidth,h:window.innerHeight}:camSz(cfg.size,cfg.shape);const{x,y}=camPos(cfg.pos,w,h);const r=isFull?'0':cfg.shape==='circle'?'50%':Math.round(w*.06)+'px';camWrap.style.cssText=`position:fixed;z-index:50;cursor:move;user-select:none;width:${w}px;height:${h}px;left:${x}px;top:${y}px;border-radius:${r};overflow:hidden;border:${isFull?'none':'2px solid rgba(0,255,245,.6)'};box-shadow:${isFull?'none':'0 0 20px rgba(0,255,245,.3)'};`;camFeed.style.cssText=`width:${w}px;height:${h}px;object-fit:cover;display:block;transform:scaleX(${cfg.mirror?-1:1});`;}
async function startCam(cfg){if(!camStream){try{camStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});camFeed.srcObject=camStream;}catch(e){return;}}applyCam(cfg);camWrap.style.display='block';if(window.parent!==window.top)camWrap.style.display='none';}
function stopCam(){camWrap.style.display='none';if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}camFeed.srcObject=null;}
camWrap.addEventListener('pointerdown',e=>{camDrag=true;ox=e.clientX-camWrap.offsetLeft;oy=e.clientY-camWrap.offsetTop;camWrap.setPointerCapture(e.pointerId);});
camWrap.addEventListener('pointermove',e=>{if(camDrag){camWrap.style.left=(e.clientX-ox)+'px';camWrap.style.top=(e.clientY-oy)+'px';}});
camWrap.addEventListener('pointerup',()=>camDrag=false);

window.addEventListener('message',e=>{
    const d=e.data;if(!d)return;
    if(d.action==='load'&&d.slides)load(d,d.index??0);
    if(d.action==='goto')show(d.index);
    if(d.action==='next')show(cur+1);
    if(d.action==='prev')show(cur-1);
    if(d.action==='camera'){if(d.enabled)startCam(d);else stopCam();}
});
document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ')show(cur+1);
    if(e.key==='ArrowLeft'||e.key==='ArrowUp')show(cur-1);
});
</script>
</body>
</html>

}

function updateCamSlideIndicator() {
    const slide = currentPres?.slides[currentIndex];
    const ind   = document.getElementById('camSlideIndicator');
    if (ind) ind.style.display = slide?.camConfig ? 'flex' : 'none';
}

function drawCameraOverlay(ctx, w, h, camVid) {
    const camW = Math.round(w * (camSize / 100));
    const camH = camShape === 'circle' ? camW : Math.round(camW * 9 / 16);
    const pad  = Math.round(w * 0.018);

    // Pantalla completa: sobreescribir dimensiones y posición
    if (camPos === 'full') { camW = w; camH = h; }

    let x, y;
    if      (camPos === 'tl')     { x = pad;               y = pad; }
    else if (camPos === 'tr')     { x = w - camW - pad;    y = pad; }
    else if (camPos === 'bl')     { x = pad;               y = h - camH - pad; }
    else if (camPos === 'center') { x = (w - camW) / 2;    y = (h - camH) / 2; }
    else if (camPos === 'full')   { x = 0;                  y = 0; }
    else                          { x = w - camW - pad;    y = h - camH - pad; } // br

    ctx.save();
    ctx.beginPath();
    if (camShape === 'circle') {
        ctx.arc(x + camW / 2, y + camW / 2, camW / 2, 0, Math.PI * 2);
    } else {
        const r = Math.round(camW * 0.06);
        ctx.roundRect(x, y, camW, camH, r);
    }
    ctx.clip();

    if (camMirror) {
        ctx.translate(x + camW, y);
        ctx.scale(-1, 1);
        ctx.drawImage(camVid, 0, 0, camW, camH);
    } else {
        ctx.drawImage(camVid, x, y, camW, camH);
    }
    ctx.restore();

    // Borde
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.65)';
    ctx.lineWidth   = Math.max(2, Math.round(w * 0.0022));
    ctx.beginPath();
    if (camShape === 'circle') {
        ctx.arc(x + camW / 2, y + camW / 2, camW / 2, 0, Math.PI * 2);
    } else {
        const r = Math.round(camW * 0.06);
        ctx.roundRect(x, y, camW, camH, r);
    }
    ctx.stroke();
    ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════
// Grabación — Modo Navegador
// rAF throttled → canvas → captureStream → MediaRecorder (A/V sync)
//                                        → ondataavailable → OPFS
// Sin acumulación en RAM. Sync garantizada por MediaRecorder.
// ═══════════════════════════════════════════════════════════════════
let recMode       = 'browser';
let micStream     = null;
let displayStream = null;
let recStartTime  = null;
let isRecording   = false;

let _mediaRecorder = null;
let _opfsWritable  = null;
let _opfsFileName  = null;
let _rafId         = null;
let _audioCtx      = null;

const REC_QUALITY = {
    '1080': { height: 1080, fps: 30, bps: 6_000_000 },
    '720':  { height: 720,  fps: 30, bps: 3_000_000 },
    '480':  { height: 480,  fps: 24, bps: 1_500_000 },
};
function getRecQuality() {
    const v = document.getElementById('recQuality')?.value || '720';
    return REC_QUALITY[v] || REC_QUALITY['720'];
}


function setRecMode(mode) {
    recMode = mode;
    document.getElementById('modeBrowser').classList.toggle('active', mode === 'browser');
    document.getElementById('modeOBS').classList.toggle('active', mode === 'obs');
    document.getElementById('recBrowserPanel').classList.toggle('hidden', mode !== 'browser');
    document.getElementById('recOBSPanel').classList.toggle('hidden', mode !== 'obs');
}

let selectedMicDeviceId = '';

async function populateMicDevices() {
    let devices = await navigator.mediaDevices.enumerateDevices();
    let audioInputs = devices.filter(d => d.kind === 'audioinput');

    // Si los labels están vacíos el navegador necesita permiso — pedirlo
    if (audioInputs.length && !audioInputs[0].label) {
        try {
            const tmp = await navigator.mediaDevices.getUserMedia({ audio:true, video:false });
            tmp.getTracks().forEach(t => t.stop());
            devices = await navigator.mediaDevices.enumerateDevices();
            audioInputs = devices.filter(d => d.kind === 'audioinput');
        } catch(e) { return; }
    }

    const sel = document.getElementById('micDeviceSelect');
    const prev = sel.value;
    sel.innerHTML = '<option value="">🎙 Predeterminado</option>';
    audioInputs.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || `Dispositivo ${d.deviceId.slice(0,6)}`;
        sel.appendChild(opt);
    });
    if (prev) sel.value = prev;
}

// Refrescar si se conecta/desconecta un dispositivo (solo en contexto seguro)
if (navigator.mediaDevices) {
    navigator.mediaDevices.addEventListener('devicechange', () => populateMicDevices());
    populateMicDevices();
}

function onMicDeviceChange() {
    selectedMicDeviceId = document.getElementById('micDeviceSelect').value;
    // Si el mic ya estaba activo, reiniciarlo con el nuevo dispositivo
    if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
        document.getElementById('micDot').classList.remove('active');
        document.getElementById('micLabel').textContent = 'Cambiado — presiona Activar';
        document.getElementById('micToggle').textContent = 'Activar';
    }
}

async function toggleMic() {
    if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
        document.getElementById('micDot').classList.remove('active');
        document.getElementById('micLabel').textContent = 'Micrófono no activo';
        document.getElementById('micToggle').textContent = 'Activar';
    } else {
        try {
            const constraints = { audio: selectedMicDeviceId
                ? { deviceId: { exact: selectedMicDeviceId } }
                : true, video:false };
            micStream = await navigator.mediaDevices.getUserMedia(constraints);
            document.getElementById('micDot').classList.add('active');
            const sel = document.getElementById('micDeviceSelect');
            const label = sel.options[sel.selectedIndex]?.text || 'Micrófono';
            document.getElementById('micLabel').textContent = label + ' ✓';
            document.getElementById('micToggle').textContent = 'Desactivar';
            // Poblar lista si aún no tiene labels
            populateMicDevices();
        } catch(err) {
            alert('No se pudo acceder al micrófono: ' + err.message);
        }
    }
}

function browserToggleRec() {
    if (isRecording) browserStopRec();
    else             browserStartRec();
}

async function browserStartRec() {
    const qual = getRecQuality();

    // 1. Micrófono
    if (!micStream) {
        try {
            const c = selectedMicDeviceId ? { deviceId: { exact: selectedMicDeviceId } } : true;
            micStream = await navigator.mediaDevices.getUserMedia({ audio: c, video: false });
            document.getElementById('micDot').classList.add('active');
            document.getElementById('micLabel').textContent = 'Micrófono activo ✓';
            document.getElementById('micToggle').textContent = 'Desactivar';
        } catch(err) {
            alert('Se necesita el micrófono para grabar. ' + err.message);
            return;
        }
    }

    // 2. Captura de pantalla
    let captureStream;
    try {
        captureStream = await navigator.mediaDevices.getDisplayMedia({
            video: { frameRate: qual.fps, displaySurface: 'window' },
            audio: true,
        });
    } catch(err) {
        if (err.name !== 'NotAllowedError') alert('Error al capturar pantalla: ' + err.message);
        return;
    }
    displayStream = captureStream;

    // 3. Mezcla de audio (micrófono + sistema) en AudioContext
    _audioCtx = new AudioContext();
    const dest = _audioCtx.createMediaStreamDestination();
    _audioCtx.createMediaStreamSource(micStream).connect(dest);
    const sysTracks = captureStream.getAudioTracks();
    if (sysTracks.length)
        _audioCtx.createMediaStreamSource(new MediaStream(sysTracks)).connect(dest);

    // 4. Canvas escalado para composición pantalla + cámara
    const screenVid = document.createElement('video');
    screenVid.srcObject = new MediaStream(captureStream.getVideoTracks());
    screenVid.muted = true;
    await new Promise(r => { screenVid.onloadedmetadata = r; });
    await screenVid.play();

    const srcW  = screenVid.videoWidth  || 1920;
    const srcH  = screenVid.videoHeight || 1080;
    const scale = Math.min(1, qual.height / srcH);
    const W = Math.round(srcW * scale / 2) * 2;
    const H = Math.round(srcH * scale / 2) * 2;

    const canvas = document.createElement('canvas');
    canvas.width  = W;
    canvas.height = H;
    const ctx2d = canvas.getContext('2d');

    let camVid = null;
    if (cameraStream && cameraEnabled) {
        camVid = document.createElement('video');
        camVid.srcObject = cameraStream;
        camVid.muted = true;
        await new Promise(r => { camVid.onloadedmetadata = r; });
        await camVid.play();
    }

    // 5. OPFS — escribe chunks directo al disco sin acumular en RAM
    const recName = (currentPres?.name || 'grabacion') + '_'
                  + new Date().toISOString().slice(0,19).replace('T','_').replace(/:/g,'-');
    _opfsFileName = recName + '.webm';
    try {
        const root    = await navigator.storage.getDirectory();
        const fh      = await root.getFileHandle(_opfsFileName, { create: true });
        _opfsWritable = await fh.createWritable();
    } catch(e) {
        console.warn('OPFS no disponible, usando RAM:', e);
        _opfsWritable = null;
    }

    // 6. rAF throttled al fps objetivo — dibuja solo cuando toca, sin drift
    const frameDur = 1000 / qual.fps;
    let lastDraw   = 0;
    function drawFrame(now) {
        if (now - lastDraw >= frameDur) {
            ctx2d.drawImage(screenVid, 0, 0, W, H);
            if (camVid) drawCameraOverlay(ctx2d, W, H, camVid);
            lastDraw = now;
        }
        _rafId = requestAnimationFrame(drawFrame);
    }
    _rafId = requestAnimationFrame(drawFrame);

    // 7. Stream final: canvas (video) + AudioContext (audio mezclado)
    //    MediaRecorder sincroniza A/V automáticamente al estar en el mismo stream
    const finalStream = new MediaStream([
        canvas.captureStream(qual.fps).getVideoTracks()[0],
        ...dest.stream.getAudioTracks(),
    ]);

    const mimeType = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
        .find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';

    const recChunks = [];
    _mediaRecorder = new MediaRecorder(finalStream, { mimeType, videoBitsPerSecond: qual.bps });

    _mediaRecorder.ondataavailable = async e => {
        if (e.data.size === 0) return;
        if (_opfsWritable) {
            await _opfsWritable.write(e.data);   // directo al disco
        } else {
            recChunks.push(e.data);              // fallback RAM
        }
    };

    _mediaRecorder.onstop = async () => {
        if (_rafId) { cancelAnimationFrame(_rafId); _rafId = null; }
        screenVid.srcObject = null;
        if (camVid) camVid.srcObject = null;
        try { _audioCtx?.close(); } catch(_) {}
        _audioCtx = null;

        if (_opfsWritable) {
            await _opfsWritable.close();
            _opfsWritable = null;
            // Leer desde OPFS y descargar
            try {
                const root = await navigator.storage.getDirectory();
                const fh   = await root.getFileHandle(_opfsFileName);
                const file = await fh.getFile();
                const url  = URL.createObjectURL(file);
                const a    = document.createElement('a');
                a.href = url; a.download = _opfsFileName; a.click();
                setTimeout(async () => {
                    URL.revokeObjectURL(url);
                    try { await root.removeEntry(_opfsFileName); } catch(_) {}
                }, 15_000);
            } catch(e) { console.error('Error descargando desde OPFS:', e); }
        } else {
            // Fallback: descargar desde RAM
            const blob = new Blob(recChunks, { type: mimeType });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href = url; a.download = _opfsFileName; a.click();
            setTimeout(() => URL.revokeObjectURL(url), 10_000);
        }

        document.getElementById('recStatus').textContent = '✅ Descargando…';
        document.getElementById('recStatus').className   = 'badge ok';
        setTimeout(() => {
            document.getElementById('recStatus').textContent = 'Sin grabación';
            document.getElementById('recStatus').className   = 'badge';
        }, 5_000);
    };

    _mediaRecorder.start(1000); // chunk cada 1s → escribe al disco cada segundo
    isRecording  = true;
    recStartTime = Date.now();

    document.getElementById('browserRecBtn').textContent = '⏺ Grabando…';
    document.getElementById('browserRecBtn').classList.add('recording');
    document.getElementById('browserStopBtn').disabled = false;
    document.getElementById('recStatus').textContent = cameraEnabled ? '🔴 Grabando + 📷' : '🔴 Grabando';
    document.getElementById('recStatus').className   = 'badge rec';

    captureStream.getVideoTracks()[0].addEventListener('ended', () => browserStopRec());
    pearAction('previous').catch(() => {});
    pearAction('play').catch(() => {});
}

function browserStopRec() {
    if (!isRecording) return;
    isRecording = false;

    _mediaRecorder?.stop();
    displayStream?.getTracks().forEach(t => t.stop());
    displayStream = null;

    document.getElementById('browserRecBtn').textContent = '⏺ Grabar';
    document.getElementById('browserRecBtn').classList.remove('recording');
    document.getElementById('browserStopBtn').disabled = true;
    document.getElementById('recStatus').textContent = 'Guardando…';
    document.getElementById('recStatus').className   = 'badge';

    pearAction('pause').catch(() => {});
}

// ═══════════════════════════════════════════════════════════════════
// OBS WebSocket
// ═══════════════════════════════════════════════════════════════════
let obsWs        = null;
let obsConnected = false;
let obsRecording = false;
let obsReqId     = 1;
const obsCbs     = {};

async function sha256b64(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return btoa(String.fromCharCode(...new Uint8Array(buf)));
}
function obsSend(op, d) { obsWs.send(JSON.stringify({ op, d })); }
function obsCall(type, data={}) {
    return new Promise((res, rej) => {
        const id = String(obsReqId++);
        obsCbs[id] = { res, rej };
        obsSend(6, { requestType:type, requestId:id, requestData:data });
    });
}

async function obsConnect() {
    const port = document.getElementById('obsPort').value.trim() || '4455';
    const pass = document.getElementById('obsPass').value.trim() || '';
    if (obsWs) { obsWs.close(); obsWs = null; }
    obsWs = new WebSocket(`ws://localhost:${port}`);
    obsWs.onmessage = async evt => {
        const msg = JSON.parse(evt.data);
        if (msg.op === 0) {
            const { challenge, salt } = msg.d.authentication;
            const secret = await sha256b64(pass + salt);
            const auth   = await sha256b64(secret + challenge);
            obsSend(1, { rpcVersion:1, authentication:auth, eventSubscriptions:64 });
        }
        if (msg.op === 2) {
            obsConnected = true;
            document.getElementById('obsStatus').textContent = 'OBS ✓';
            document.getElementById('obsStatus').className   = 'badge ok';
            document.getElementById('obsRecControls').style.display = 'flex';
            const st = await obsCall('GetRecordStatus');
            obsRecording = st.outputActive;
            updateObsBtns();
        }
        if (msg.op === 5 && msg.d.eventType === 'RecordStateChanged') {
            const state = msg.d.eventData.outputState;
            obsRecording = state === 'OBS_WEBSOCKET_OUTPUT_STARTED';
            updateObsBtns();
            if (obsRecording) { pearAction('previous').catch(()=>{}); pearAction('play').catch(()=>{}); }
            else               pearAction('pause').catch(()=>{});
            document.getElementById('recStatus').textContent = obsRecording ? '🔴 OBS Grabando' : 'Sin grabación';
            document.getElementById('recStatus').className   = obsRecording ? 'badge rec' : 'badge';
        }
        if (msg.op === 7) {
            const cb = obsCbs[msg.d.requestId];
            if (cb) {
                delete obsCbs[msg.d.requestId];
                msg.d.requestStatus.result ? cb.res(msg.d.responseData) : cb.rej(msg.d.requestStatus);
            }
        }
    };
    obsWs.onerror = () => {
        document.getElementById('obsStatus').textContent = 'OBS: Error';
        document.getElementById('obsStatus').className   = 'badge err';
    };
    obsWs.onclose = () => {
        if (obsConnected) {
            obsConnected = false;
            document.getElementById('obsStatus').textContent = 'OBS: —';
            document.getElementById('obsStatus').className   = 'badge';
            document.getElementById('obsRecControls').style.display = 'none';
        }
    };
}

async function obsToggleRec() {
    if (!obsConnected) { alert('Primero conecta con OBS'); return; }
    if (obsRecording) { await obsCall('StopRecord'); obsRecording = false; }
    else              { await obsCall('StartRecord'); obsRecording = true; }
    updateObsBtns();
}
async function obsStopRec() {
    if (!obsConnected) return;
    await obsCall('StopRecord');
    obsRecording = false;
    updateObsBtns();
}
function updateObsBtns() {
    document.getElementById('obsRecBtn').textContent = obsRecording ? '⏺ Grabando…' : '⏺ Iniciar';
    document.getElementById('obsRecBtn').classList.toggle('recording', obsRecording);
    document.getElementById('obsStopBtn').disabled = !obsRecording;
}

// ═══════════════════════════════════════════════════════════════════
// pear-desktop
// ═══════════════════════════════════════════════════════════════════
async function pearAction(action) {
    const res = await fetch(`http://localhost:26538/api/v1/${action}`, { method:'POST' });
    document.getElementById('pearStatus').textContent = '🍐 ✓';
    document.getElementById('pearStatus').className   = 'badge ok';
    setTimeout(() => {
        document.getElementById('pearStatus').textContent = '🍐 —';
        document.getElementById('pearStatus').className   = 'badge';
    }, 2000);
    return res;
}

// ═══════════════════════════════════════════════════════════════════
// Lista de grabaciones guardadas
// ═══════════════════════════════════════════════════════════════════
async function renderRecList() {
    const list = document.getElementById('recList');
    list.innerHTML = '<p style="color:#555;font-size:0.8rem;">Cargando…</p>';
    const all = await dbGetAll('recordings');
    if (!all.length) { list.innerHTML = '<p style="color:#555;font-size:0.8rem;">No hay grabaciones guardadas.</p>'; return; }
    list.innerHTML = '';
    [...all].reverse().forEach(r => {
        const min = String(Math.floor(r.duration/60)).padStart(2,'0');
        const sec = String(r.duration%60).padStart(2,'0');
        const item = document.createElement('div');
        item.className = 'rec-item';
        item.innerHTML = `
            <div class="rec-item-name">🎬 ${r.name} <span style="color:#555;font-size:0.72rem;">(${min}:${sec})</span></div>
            <div class="rec-item-actions">
                <button style="background:#0f3460;color:white;" onclick="reproducirGrabacion('${r.id}')">▶ Ver</button>
                <button style="background:#00d4ff20;color:#00d4ff;border:1px solid #00d4ff30;" onclick="descargarGrabacion('${r.id}')">⬇ Descargar</button>
                <button style="background:#e74c3c20;color:#e74c3c;border:1px solid #e74c3c30;" onclick="eliminarGrabacion('${r.id}')">🗑</button>
            </div>`;
        list.appendChild(item);
    });
}

async function reproducirGrabacion(id) {
    const r = await dbGet('recordings', id);
    if (!r) return;
    const url = URL.createObjectURL(r.blob);
    const win = window.open('', '_blank');
    win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${r.name}</title>
        <style>*{margin:0;padding:0}body{background:#000;display:flex;align-items:center;justify-content:center;height:100vh;}
        video{max-width:100%;max-height:100vh;}</style></head>
        <body><video src="${url}" controls autoplay></video></body></html>`);
}

async function descargarGrabacion(id) {
    const r = await dbGet('recordings', id);
    if (!r) return;
    const ext = r.mimeType.includes('mp4') ? 'mp4' : 'webm';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(r.blob);
    a.download = r.name + '.' + ext;
    a.click();
}

async function eliminarGrabacion(id) {
    if (!confirm('¿Eliminar esta grabación?')) return;
    await dbDelete('recordings', id);
    renderRecList();
}

// ═══════════════════════════════════════════════════════════════════
// Inicialización
// ═══════════════════════════════════════════════════════════════════
(async () => {
    // Cargar tutorial si no hay presentaciones
    const all = await dbGetAll('presentations');
    if (!all.length) {
        try {
            const tut = await fetch('tutorial.json').then(r => r.json());
            await dbPut('presentations', tut);
            loadPresentacion(tut);
        } catch(e) { console.warn('No se pudo cargar tutorial.json', e); }
    } else {
        // Cargar la última modificada
        const last = all.sort((a,b) => (b.updatedAt||'').localeCompare(a.updatedAt||''))[0];
        loadPresentacion(last);
    }
})();
</script>

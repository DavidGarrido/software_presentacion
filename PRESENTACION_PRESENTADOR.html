<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentador - Censo DANE 2018</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',Arial,sans-serif; background:#0d0d1a; color:white; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

        .top-bar { background:#0f3460; padding:10px 20px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
        .top-bar h1 { font-size:1rem; color:#00d4ff; }
        #obsStatus { font-size:0.8rem; padding:4px 10px; border-radius:10px; background:rgba(255,255,255,0.1); }
        #obsStatus.connected { background:rgba(46,204,113,0.3); color:#2ecc71; }
        #obsStatus.error { background:rgba(231,76,60,0.3); color:#e74c3c; }

        .main { display:flex; flex:1; overflow:hidden; }

        /* Panel izquierdo: vista previa */
        .preview-panel { flex:1.4; display:flex; flex-direction:column; padding:15px; gap:10px; overflow-y:auto; }

        /* Fila: miniaturas + preview principal */
        .preview-row { display:flex; gap:8px; flex:1; min-height:0; }
        .preview-main { flex:1; display:flex; flex-direction:column; gap:10px; min-width:0; }

        /* Tira de miniaturas */
        .thumb-strip { width:136px; flex-shrink:0; overflow-y:auto; display:flex; flex-direction:column; gap:5px; padding:4px; background:#0a0a15; border-radius:10px; border:1px solid #222; }
        .thumb-item { position:relative; width:124px; height:70px; overflow:hidden; border-radius:5px; cursor:pointer; border:2px solid transparent; flex-shrink:0; background:#0d0d1a; transition:border-color 0.15s; }
        .thumb-item:hover { border-color:#555; }
        .thumb-item.active { border-color:#00d4ff; }
        .thumb-item iframe { width:1280px; height:720px; border:none; transform:scale(0.097); transform-origin:top left; pointer-events:none; }
        .thumb-num { position:absolute; bottom:2px; right:3px; font-size:0.6rem; color:rgba(255,255,255,0.75); background:rgba(0,0,0,0.55); padding:1px 4px; border-radius:3px; line-height:1.4; }

        .slide-preview { background:#1a1a2e; border-radius:12px; border:2px solid #333; overflow:hidden; aspect-ratio:16/9; position:relative; }
        .slide-preview iframe { width:100%; height:100%; border:none; pointer-events:none; transform-origin:top left; }

        .slide-info { background:#1a1a2e; border-radius:10px; padding:12px; }
        .slide-info .slide-title { color:#ffd700; font-weight:bold; font-size:1rem; margin-bottom:5px; }
        .slide-counter-disp { color:#aaa; font-size:0.85rem; }

        .controls { display:flex; gap:8px; }
        .btn { flex:1; padding:10px; border:none; border-radius:8px; cursor:pointer; font-size:0.9rem; font-weight:bold; transition:all 0.2s; }
        .btn-primary { background:#00d4ff; color:#1a1a2e; }
        .btn-primary:hover { background:#00b8d9; }
        .btn-secondary { background:#0f3460; color:white; }
        .btn-secondary:hover { background:#1a4a80; }
        .btn-danger { background:#e74c3c; color:white; }
        .btn-danger:hover { background:#c0392b; }
        .btn-success { background:#2ecc71; color:#1a1a2e; }
        .help-text { color:#555; font-size:0.75rem; text-align:center; margin-top:5px; }

        /* Panel derecho: notas */
        .notes-panel { width:340px; background:#111; border-left:1px solid #222; display:flex; flex-direction:column; overflow-y:auto; padding:15px; gap:12px; flex-shrink:0; }
        .notes-title { color:#00d4ff; font-size:0.85rem; font-weight:bold; text-transform:uppercase; letter-spacing:1px; }
        .notes-content { background:#1a1a2e; border-radius:10px; padding:14px; font-size:0.9rem; line-height:1.7; color:#ddd; flex:1; white-space:pre-wrap; }

        /* OBS Panel */
        .obs-panel { background:#1a1a2e; border-radius:10px; padding:12px; border:1px solid #333; }
        .obs-panel h3 { color:#ffd700; font-size:0.85rem; margin-bottom:8px; }
        .obs-settings { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:8px; font-size:0.8rem; }
        .obs-settings label { color:#aaa; }
        .obs-settings input[type="text"] { width:65px; padding:4px 6px; background:#222; border:1px solid #444; border-radius:4px; color:white; font-size:0.8rem; }
        .obs-settings input[type="password"] { width:110px; padding:4px 6px; background:#222; border:1px solid #444; border-radius:4px; color:white; font-size:0.8rem; }
        .rec-controls { display:flex; gap:6px; margin-top:6px; }
        .obs-btn { padding:7px 12px; border:none; border-radius:6px; cursor:pointer; font-size:0.8rem; font-weight:bold; }
        .obs-btn.connect { background:#00d4ff; color:#1a1a2e; width:100%; }
        .obs-btn.record { background:#e74c3c; color:white; flex:1; }
        .obs-btn.record.recording { animation:blink 1s infinite; }
        .obs-btn.stop { background:#555; color:white; flex:1; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.6} }
    </style>
</head>
<body>

<div class="top-bar">
    <h1>Vista del Presentador — Censo DANE 2018</h1>
    <span id="obsStatus">OBS: Desconectado</span>
</div>

<div class="main">
    <!-- Panel izquierdo -->
    <div class="preview-panel">
        <div class="preview-row">
            <div id="thumbStrip" class="thumb-strip"></div>
            <div class="preview-main">
                <div class="slide-preview">
                    <iframe src="PRESENTACION_CENSO.html" id="slideFrame"></iframe>
                </div>
                <div class="slide-info">
                    <div class="slide-title" id="currentTitle">1. PORTADA</div>
                    <div class="slide-counter-disp">Diapositiva <span id="currentNum">1</span> de <span id="totalNum">15</span></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="prevSlide()">◀ Anterior</button>
            <button class="btn btn-primary" onclick="nextSlide()">Siguiente ▶</button>
        </div>

        <div class="controls">
            <button class="btn btn-secondary" onclick="openProjector()">📺 Abrir Proyector</button>
        </div>

        <div class="controls" style="margin-top:5px;">
            <select id="presSelector" onchange="cambiarPresentacion(this.value)"
                style="flex:1;padding:9px;background:#0f3460;color:white;border:none;border-radius:8px;font-size:0.85rem;cursor:pointer;">
                <option value="PRESENTACION_CENSO.html">Censo DANE 2018</option>
                <option value="PRESENTACION_INGLES.html">Villa de Leyva (English)</option>
                <option value="PRESENTACION_BELEN.html">Testimonio de Belén</option>
            </select>
        </div>

        <div class="controls">
            <button class="btn btn-danger" onclick="abrirUltimaGrabacion()">🎬 Última grabación</button>
        </div>

        <p class="help-text">Usa las flechas ← → del teclado para navegar</p>
    </div>

    <!-- Panel derecho: notas + OBS -->
    <div class="notes-panel">
        <div class="notes-title">Guión</div>
        <div class="notes-content" id="notesContent">Cargando guión...</div>

        <!-- OBS Panel -->
        <div class="obs-panel">
            <h3>🎥 Control OBS</h3>
            <div class="obs-settings">
                <label>Puerto:</label>
                <input type="text" id="obsPort" value="4455">
                <label>Contraseña:</label>
                <input type="password" id="obsPassword" placeholder="(vacía si no hay)">
            </div>
            <button class="obs-btn connect" onclick="connectOBS()">🔗 Conectar a OBS</button>
            <div class="rec-controls hidden" id="recControls">
                <button class="obs-btn record" id="recBtn" onclick="toggleRecording()">⏺ Iniciar Grabación</button>
                <button class="obs-btn stop" id="stopBtn" onclick="stopRecording()" disabled>⏹ Detener</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ── Mapa presentación → archivo JSON de diapositivas ─────────────────────
    const slidesMap = {
        'PRESENTACION_CENSO.html':   'slides_censo.json',
        'PRESENTACION_INGLES.html':  'slides_ingles.json',
        'PRESENTACION_BELEN.html':   'slides_belen.json',
    };

    let slidesData = [];

    let currentSlide = 0;
    let projectorWindow = null;

    function renderThumbs(src) {
        const strip = document.getElementById('thumbStrip');
        strip.innerHTML = '';
        slidesData.forEach((s, i) => {
            const item = document.createElement('div');
            item.className = 'thumb-item' + (i === currentSlide ? ' active' : '');
            item.id = `thumb-${i}`;
            item.title = s.title;
            item.onclick = () => { currentSlide = i; updateUI(); };

            const ifrm = document.createElement('iframe');
            ifrm.src = src;
            ifrm.onload = () => { try { ifrm.contentWindow.showSlide(i); } catch(e){} };

            const num = document.createElement('div');
            num.className = 'thumb-num';
            num.textContent = i + 1;

            item.appendChild(ifrm);
            item.appendChild(num);
            strip.appendChild(item);
        });
    }

    function updateUI() {
        const data = slidesData[currentSlide];
        document.getElementById('currentTitle').textContent = data.title;
        document.getElementById('currentNum').textContent = currentSlide + 1;
        document.getElementById('totalNum').textContent = slidesData.length;
        document.getElementById('notesContent').textContent = data.notes;
        // Actualizar miniatura activa
        document.querySelectorAll('.thumb-item').forEach((el, i) => {
            el.classList.toggle('active', i === currentSlide);
        });
        // Sincronizar iframe
        try { document.getElementById('slideFrame').contentWindow.showSlide(currentSlide); } catch(e){}
        // Sincronizar proyector
        if (projectorWindow && !projectorWindow.closed) {
            projectorWindow.postMessage({ action: 'goto', index: currentSlide }, '*');
        }
    }

    function nextSlide() { if (currentSlide < slidesData.length - 1) { currentSlide++; updateUI(); } }
    function prevSlide() { if (currentSlide > 0) { currentSlide--; updateUI(); } }

    function openProjector() {
        const src = document.getElementById('slideFrame').src.split('/').pop();
        projectorWindow = window.open(`PRESENTACION_PROYECTOR.html?src=${src}`, 'proyector', 'width=1280,height=720');
        setTimeout(() => updateUI(), 1500);
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextSlide();
        if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prevSlide();
    });

    // ── OBS WebSocket nativo ─────────────────────────────────────────────────
    let obsWs = null;
    let isRecording = false;
    let obsConnected = false;
    let obsReqId = 1;
    const obsCallbacks = {};

    async function sha256b64(text) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return btoa(String.fromCharCode(...new Uint8Array(buf)));
    }

    function obsSend(op, data) { obsWs.send(JSON.stringify({ op, d: data })); }

    function obsCall(requestType, requestData = {}) {
        return new Promise((resolve, reject) => {
            const id = String(obsReqId++);
            obsCallbacks[id] = { resolve, reject };
            obsSend(6, { requestType, requestId: id, requestData });
        });
    }

    async function connectOBS() {
        const statusEl    = document.getElementById('obsStatus');
        const recControls = document.getElementById('recControls');
        const port        = document.getElementById('obsPort')?.value.trim() || '4455';
        const password    = document.getElementById('obsPassword')?.value.trim() || '';
        const wsUrl       = `ws://localhost:${port}`;

        statusEl.textContent = 'OBS: Conectando...';
        statusEl.className = '';

        if (obsWs) { obsWs.close(); obsWs = null; obsConnected = false; }
        obsWs = new WebSocket(wsUrl);

        obsWs.onmessage = async (evt) => {
            const msg = JSON.parse(evt.data);
            // op 0 = Hello
            if (msg.op === 0) {
                const { challenge, salt } = msg.d.authentication;
                const secret = await sha256b64(password + salt);
                const auth   = await sha256b64(secret + challenge);
                obsSend(1, { rpcVersion: 1, authentication: auth, eventSubscriptions: 64 });
            }
            // op 2 = Identified
            if (msg.op === 2) {
                obsConnected = true;
                statusEl.textContent = 'OBS: Conectado ✓';
                statusEl.className = 'connected';
                recControls.classList.remove('hidden');
                const status = await obsCall('GetRecordStatus');
                isRecording = status.outputActive;
                updateRecordButtons();
            }
            // op 5 = Event
            if (msg.op === 5 && msg.d.eventType === 'RecordStateChanged') {
                const state = msg.d.eventData.outputState;
                if (state === 'OBS_WEBSOCKET_OUTPUT_STOPPED' && msg.d.eventData.outputPath) {
                    const fileName = msg.d.eventData.outputPath.split('/').pop();
                    const url = `http://localhost:8000/grabaciones/${encodeURIComponent(fileName)}`;
                    showLastRecording(fileName, url);
                }
                isRecording = (state === 'OBS_WEBSOCKET_OUTPUT_STARTED');
                updateRecordButtons();
                // Sincronizar estado con servidor
                fetch(isRecording ? '/api/iniciar' : '/api/detener').catch(() => {});
            }
            // op 7 = RequestResponse
            if (msg.op === 7) {
                const cb = obsCallbacks[msg.d.requestId];
                if (cb) {
                    delete obsCallbacks[msg.d.requestId];
                    msg.d.requestStatus.result ? cb.resolve(msg.d.responseData) : cb.reject(msg.d.requestStatus);
                }
            }
        };

        obsWs.onerror = () => {
            statusEl.textContent = 'OBS: Error';
            statusEl.className = 'error';
            alert('No se pudo conectar a OBS.\n\n1. ¿OBS está abierto?\n2. Herramientas → Servidor WebSocket → Habilitado\n3. Verifica puerto y contraseña');
        };

        obsWs.onclose = () => {
            if (obsConnected) {
                obsConnected = false;
                statusEl.textContent = 'OBS: Desconectado';
                statusEl.className = 'error';
                recControls.classList.add('hidden');
            }
        };
    }

    async function toggleRecording() {
        if (!obsConnected) { alert('Primero conecta con OBS'); return; }
        if (isRecording) { await obsCall('StopRecord'); isRecording = false; }
        else             { await obsCall('StartRecord'); isRecording = true; }
        updateRecordButtons();
    }

    async function stopRecording() {
        if (!obsConnected) return;
        await obsCall('StopRecord');
        isRecording = false;
        updateRecordButtons();
    }

    function updateRecordButtons() {
        const recBtn  = document.getElementById('recBtn');
        const stopBtn = document.getElementById('stopBtn');
        if (isRecording) {
            recBtn.innerHTML = '⏺ Grabando...';
            recBtn.classList.add('recording');
            stopBtn.disabled = false;
        } else {
            recBtn.innerHTML = '⏺ Iniciar Grabación';
            recBtn.classList.remove('recording');
            stopBtn.disabled = true;
        }
    }

    // ── Última grabación ─────────────────────────────────────────────────────
    function showLastRecording(fileName, url) {
        let panel = document.getElementById('lastRecordingPanel');
        if (!panel) {
            panel = document.createElement('div');
            panel.id = 'lastRecordingPanel';
            panel.style.cssText = 'background:#1a1a2e;padding:12px;border-radius:10px;margin-top:10px;border:1px solid #00d4ff;';
            document.querySelector('.notes-panel').appendChild(panel);
        }
        panel.innerHTML = `
            <p style="color:#ffd700;font-size:0.85rem;margin-bottom:6px;">🎬 Última grabación:</p>
            <p style="color:#ddd;font-size:0.8rem;word-break:break-all;margin-bottom:8px;">${fileName}</p>
            <button onclick="openVideoModal('${url}','${fileName}')"
               style="width:100%;padding:8px;background:#00d4ff;color:#1a1a2e;border:none;
                      border-radius:6px;font-weight:bold;font-size:0.85rem;cursor:pointer;">
               ▶ Ver video
            </button>`;
        openVideoModal(url, fileName);
    }

    async function abrirUltimaGrabacion() {
        try {
            const res  = await fetch('http://localhost:8000/grabaciones/');
            const html = await res.text();
            const matches = [...html.matchAll(/href="([^"]+\.mp4)"/g)];
            if (matches.length === 0) { alert('No hay grabaciones aún.'); return; }
            const lastVideo = matches[matches.length - 1][1];
            openVideoModal('http://localhost:8000/grabaciones/' + lastVideo, lastVideo);
        } catch(e) { alert('No se pudo cargar la última grabación.'); }
    }

    async function openVideoModal(url, fileName) {
        document.getElementById('videoModal')?.remove();
        let audioUrl = null;
        try {
            const res  = await fetch('/api/ultimo_audio');
            const data = await res.json();
            if (data.archivo) audioUrl = `http://localhost:8000/grabaciones/${encodeURIComponent(data.archivo)}`;
        } catch(e) {}

        const modal = document.createElement('div');
        modal.id = 'videoModal';
        modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;';
        modal.innerHTML = `
            <div style="background:#1a1a2e;border-radius:16px;border:2px solid #00d4ff;width:100%;max-width:900px;overflow:hidden;">
                <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:#0f3460;">
                    <span style="color:#ffd700;font-weight:bold;">🎬 ${fileName}</span>
                    <button onclick="document.getElementById('videoModal').remove()"
                            style="background:transparent;border:none;color:#fff;font-size:1.5rem;cursor:pointer;">✕</button>
                </div>
                <video id="modalVideo" controls style="width:100%;max-height:60vh;background:#000;display:block;" src="${url}"></video>
                ${audioUrl ? `
                <div style="padding:12px 20px;background:#0a0a15;display:flex;align-items:center;gap:12px;">
                    <span style="color:#00d4ff;font-size:0.85rem;white-space:nowrap;">🎤 Audio celular:</span>
                    <audio id="modalAudio" src="${audioUrl}" style="width:100%;height:32px;"></audio>
                </div>` : `<div style="padding:10px 20px;background:#0a0a15;"><span style="color:#666;font-size:0.8rem;">Sin audio del celular</span></div>`}
            </div>`;
        modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
        document.body.appendChild(modal);

        const video = document.getElementById('modalVideo');
        const audio = document.getElementById('modalAudio');
        if (video && audio) {
            video.addEventListener('play',   () => audio.play());
            video.addEventListener('pause',  () => audio.pause());
            video.addEventListener('seeked', () => { audio.currentTime = video.currentTime; });
            audio.addEventListener('play',   () => video.play());
            audio.addEventListener('pause',  () => video.pause());
        }
        if (video) video.play().catch(() => {});
    }

    async function cambiarPresentacion(src) {
        const jsonFile = slidesMap[src];
        if (!jsonFile) return;
        try {
            slidesData = await fetch(jsonFile).then(r => r.json());
        } catch(e) {
            console.error('No se pudo cargar', jsonFile, e);
            return;
        }
        currentSlide = 0;
        document.getElementById('slideFrame').src = src;
        if (projectorWindow && !projectorWindow.closed) {
            projectorWindow.postMessage({ action: 'src', src }, '*');
        }
        setTimeout(() => { renderThumbs(src); updateUI(); }, 800);
    }

    // Inicializar cargando el JSON de la presentación por defecto
    (async () => {
        await cambiarPresentacion('PRESENTACION_CENSO.html');
        document.getElementById('presSelector').value = 'PRESENTACION_CENSO.html';
    })();
</script>
</body>
</html>

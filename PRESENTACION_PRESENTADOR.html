<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentador</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',Arial,sans-serif; background:#0d0d1a; color:white; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

        /* ── Top bar ── */
        .top-bar {
            background:#0f3460; padding:8px 16px;
            display:flex; align-items:center; justify-content:space-between;
            flex-shrink:0; gap:8px; flex-wrap:wrap;
        }
        .top-bar-left  { display:flex; align-items:center; gap:10px; }
        .top-bar-right { display:flex; align-items:center; gap:8px; }
        .app-title { font-size:0.95rem; color:#00d4ff; font-weight:600; white-space:nowrap; }
        .badge {
            font-size:0.72rem; padding:3px 9px; border-radius:10px;
            background:rgba(255,255,255,0.1); white-space:nowrap;
        }
        .badge.ok  { background:rgba(46,204,113,0.25); color:#2ecc71; }
        .badge.err { background:rgba(231,76,60,0.25);  color:#e74c3c; }
        .badge.rec { background:rgba(231,76,60,0.35);  color:#ff6b6b; animation:blink 1s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.55} }
        .top-btn {
            padding:5px 12px; border:none; border-radius:6px; cursor:pointer;
            font-size:0.78rem; font-weight:600; transition:all 0.15s;
        }

        /* ── Layout principal ── */
        .main { display:flex; flex:1; overflow:hidden; }

        /* Panel izquierdo */
        .left-panel { width:220px; flex-shrink:0; display:flex; flex-direction:column; background:#0a0a15; border-right:1px solid #1a1a30; overflow:hidden; }

        .pres-header { padding:10px 10px 6px; border-bottom:1px solid #1a1a30; flex-shrink:0; }
        .pres-name { font-size:0.78rem; color:#aaa; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .pres-actions { display:flex; gap:4px; }
        .pres-actions button {
            flex:1; padding:5px 4px; border:none; border-radius:5px; cursor:pointer;
            font-size:0.7rem; font-weight:600;
        }

        .thumb-strip { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px; padding:6px; }
        .thumb-item {
            position:relative; width:100%; padding-top:56.25%;
            border-radius:5px; cursor:pointer; border:2px solid transparent;
            background:#0d0d1a; transition:border-color 0.15s; overflow:hidden; flex-shrink:0;
        }
        .thumb-item:hover { border-color:#555; }
        .thumb-item.active { border-color:#00d4ff; }
        .thumb-item iframe {
            position:absolute; top:0; left:0;
            width:1280px; height:720px; border:none;
            transform:scale(0.154); transform-origin:top left;
            pointer-events:none;
        }
        .thumb-num {
            position:absolute; bottom:2px; right:3px;
            font-size:0.58rem; color:rgba(255,255,255,0.7);
            background:rgba(0,0,0,0.6); padding:1px 4px; border-radius:3px;
        }
        .thumb-layout {
            position:absolute; top:2px; left:3px;
            font-size:0.6rem; color:rgba(255,255,255,0.8);
            background:rgba(0,0,0,0.6); padding:1px 5px; border-radius:3px;
            display:flex; align-items:center; gap:3px;
        }
        .thumb-layout-icon {
            width:12px; height:10px;
            background:rgba(255,255,255,0.3);
            border-radius:2px; display:flex; align-items:center; justify-content:center;
            font-size:0.45rem;
        }

        /* Panel central */
        .center-panel { flex:1; display:flex; flex-direction:column; padding:12px; gap:8px; overflow:hidden; min-width:0; }

        .slide-preview {
            background:#1a1a2e; border-radius:10px; border:2px solid #333;
            overflow:hidden; aspect-ratio:16/9; position:relative; flex:1; min-height:0;
        }
        .slide-preview iframe { width:100%; height:100%; border:none; }

        .slide-meta { background:#1a1a2e; border-radius:8px; padding:10px 12px; flex-shrink:0; }
        .slide-title { color:#ffd700; font-weight:700; font-size:0.95rem; margin-bottom:3px; }
        .slide-counter { color:#888; font-size:0.8rem; }

        .nav-controls { display:flex; gap:6px; flex-shrink:0; }
        .nav-controls button {
            flex:1; padding:9px; border:none; border-radius:7px; cursor:pointer;
            font-size:0.85rem; font-weight:600; transition:all 0.15s;
        }
        .btn-nav     { background:#0f3460; color:white; }
        .btn-nav:hover { background:#1a4a80; }
        .btn-projector { background:#1a1a2e; color:#00d4ff; border:1px solid #00d4ff30; }
        .btn-projector:hover { background:#00d4ff15; }

        /* Panel derecho */
        .right-panel {
            width:300px; flex-shrink:0; background:#111;
            border-left:1px solid #1a1a30; display:flex; flex-direction:column;
            overflow-y:auto; padding:12px; gap:10px;
        }

        .panel-section { background:#1a1a2e; border-radius:9px; padding:11px; border:1px solid #2a2a40; }
        .section-title { color:#00d4ff; font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px; }

        .notes-content {
            font-size:0.85rem; line-height:1.65; color:#ccc;
            white-space:pre-wrap; min-height:60px; max-height:200px; overflow-y:auto;
        }

        /* Grabación */
        .rec-mode-toggle { display:flex; gap:4px; margin-bottom:8px; }
        .mode-btn {
            flex:1; padding:5px; border:1px solid #333; border-radius:5px;
            background:transparent; color:#888; font-size:0.72rem; cursor:pointer; transition:all 0.15s;
        }
        .mode-btn.active { background:#00d4ff20; border-color:#00d4ff; color:#00d4ff; }

        .mic-row { display:flex; align-items:center; gap:6px; margin-bottom:8px; font-size:0.78rem; color:#aaa; }
        .mic-dot { width:8px; height:8px; border-radius:50%; background:#555; flex-shrink:0; }
        .mic-dot.active { background:#2ecc71; box-shadow:0 0 6px #2ecc71; }
        .mic-toggle { padding:3px 8px; border:none; border-radius:4px; cursor:pointer; font-size:0.7rem; font-weight:600; background:#1a1a2e; color:#aaa; border:1px solid #333; }

        .rec-btn-row { display:flex; gap:5px; }
        .rec-btn {
            flex:1; padding:8px; border:none; border-radius:6px; cursor:pointer;
            font-size:0.78rem; font-weight:700; transition:all 0.15s;
        }
        .btn-start  { background:#e74c3c; color:white; }
        .btn-start:hover { background:#c0392b; }
        .btn-start.recording { animation:blink 1s infinite; }
        .btn-stop   { background:#555; color:white; }
        .btn-stop:hover:not(:disabled) { background:#666; }
        .btn-stop:disabled { opacity:0.4; cursor:not-allowed; }

        /* OBS */
        .obs-fields { display:flex; gap:5px; margin-bottom:6px; font-size:0.75rem; }
        .obs-fields label { color:#888; align-self:center; white-space:nowrap; }
        .obs-fields input {
            flex:1; padding:4px 6px; background:#222; border:1px solid #444;
            border-radius:4px; color:white; font-size:0.75rem; min-width:0;
        }
        .obs-btn-row { display:flex; gap:4px; }
        .obs-btn {
            flex:1; padding:6px; border:none; border-radius:5px; cursor:pointer;
            font-size:0.72rem; font-weight:700;
        }
        .obs-connect { background:#00d4ff; color:#1a1a2e; }
        .obs-record  { background:#e74c3c; color:white; }
        .obs-stop    { background:#555; color:white; }
        .obs-stop:disabled { opacity:0.4; cursor:not-allowed; }

        /* pear-desktop */
        .pear-row { display:flex; gap:4px; }
        .pear-btn {
            flex:1; padding:5px; border:none; border-radius:5px; cursor:pointer;
            font-size:0.78rem; font-weight:600; background:#1a1a2e; color:#aaa;
            border:1px solid #333; transition:all 0.15s;
        }
        .pear-btn:hover { background:#2a2a40; color:white; }

        /* Cámara */
        .cam-pos-btn, .cam-opt-btn {
            flex:1; padding:0 3px; height:28px; border:1px solid #2a2a40; border-radius:5px;
            background:#0d0d1a; color:#666; font-size:0.7rem; cursor:pointer; transition:all 0.15s;
            display:flex; align-items:center; justify-content:center; box-sizing:border-box;
        }
        .cam-pos-btn:hover, .cam-opt-btn:hover { background:#1a1a30; color:#ddd; }
        .cam-pos-btn.active, .cam-opt-btn.active { background:#00d4ff15; border-color:#00d4ff; color:#00d4ff; }
        #camPreview { border-radius:8px; overflow:hidden; background:#000; position:relative; }
        #camPreview video { width:100%; aspect-ratio:16/9; display:block; object-fit:cover; }
        #camMirrorBtn.active { background:#00d4ff15; border-color:#00d4ff; color:#00d4ff; }

        /* ── Elementos por slide ── */
        .el-card {
            background:#0a0a15; border:1px solid #1e1e35; border-radius:7px;
            padding:8px; display:flex; flex-direction:column; gap:6px; margin-bottom:6px;
        }
        .el-type-btn {
            padding:3px 9px; border:1px solid #2a2a40; border-radius:4px;
            background:#0d0d1a; color:#666; font-size:0.7rem; cursor:pointer; transition:all 0.12s;
        }
        .el-type-btn.active { background:#00d4ff15; border-color:#00d4ff; color:#00d4ff; }
        .el-num {
            width:46px; padding:3px 5px; font-size:0.72rem;
            background:#0d0d1a; border:1px solid #2a2a40; border-radius:4px; color:#ccc;
            text-align:center;
        }
        .el-lbl { font-size:0.65rem; color:#555; }

        /* ── Modales ── */
        .modal-overlay {
            position:fixed; inset:0; background:rgba(0,0,0,0.75);
            display:flex; align-items:center; justify-content:center;
            z-index:1000; padding:20px;
        }
        .modal-overlay.hidden { display:none; }
        .modal {
            background:#1a1a2e; border-radius:14px; border:1px solid #2a2a50;
            width:100%; max-width:680px; max-height:90vh;
            display:flex; flex-direction:column; overflow:hidden;
        }
        .modal-header {
            background:#0f3460; padding:13px 18px;
            display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
        }
        .modal-header h2 { font-size:1rem; color:#ffd700; }
        .modal-close {
            background:none; border:none; color:white; font-size:1.4rem;
            cursor:pointer; line-height:1;
        }
        .modal-body { padding:16px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:12px; }
        .modal-footer { padding:12px 16px; border-top:1px solid #2a2a40; display:flex; gap:8px; justify-content:flex-end; flex-shrink:0; }

        .field-group { display:flex; flex-direction:column; gap:4px; }
        .field-group label { font-size:0.78rem; color:#aaa; }
        .field-group input, .field-group textarea, .field-group select {
            padding:7px 10px; background:#0d0d1a; border:1px solid #333;
            border-radius:6px; color:white; font-size:0.85rem; font-family:inherit;
            resize:vertical;
        }
        .field-group textarea { min-height:80px; }

        .slide-list { display:flex; flex-direction:column; gap:5px; }
        .slide-list-item {
            display:flex; align-items:center; gap:6px; padding:7px 10px;
            background:#0d0d1a; border-radius:6px; border:1px solid #2a2a40; cursor:pointer;
        }
        .slide-list-item:hover { border-color:#555; }
        .slide-list-item.active { border-color:#00d4ff; background:#00d4ff10; }
        .slide-list-item .sli-num { color:#555; font-size:0.75rem; width:20px; flex-shrink:0; }
        .slide-list-item .sli-title { flex:1; font-size:0.85rem; color:#ddd; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .sli-del { background:none; border:none; color:#555; cursor:pointer; font-size:0.9rem; padding:0 2px; }
        .sli-del:hover { color:#e74c3c; }

        .btn-primary   { background:#00d4ff; color:#0d0d1a; padding:7px 14px; border:none; border-radius:6px; cursor:pointer; font-size:0.82rem; font-weight:700; }
        .btn-secondary { background:#0f3460; color:white;   padding:7px 14px; border:none; border-radius:6px; cursor:pointer; font-size:0.82rem; font-weight:600; }
        .btn-danger    { background:#e74c3c; color:white;   padding:7px 14px; border:none; border-radius:6px; cursor:pointer; font-size:0.82rem; font-weight:700; }

        /* Lista de presentaciones */
        .pres-list { display:flex; flex-direction:column; gap:5px; }
        .pres-list-item {
            display:flex; align-items:center; gap:8px; padding:8px 10px;
            background:#0d0d1a; border-radius:7px; border:1px solid #2a2a40; cursor:pointer;
        }
        .pres-list-item:hover { border-color:#555; }
        .pres-list-item.active { border-color:#00d4ff; background:#00d4ff0d; }
        .pli-name { flex:1; font-size:0.85rem; color:#ddd; }
        .pli-count { font-size:0.72rem; color:#666; }
        .pli-btn { background:none; border:none; color:#555; cursor:pointer; font-size:0.85rem; padding:0 2px; }
        .pli-btn:hover { color:#e74c3c; }

        /* Grabaciones guardadas */
        .rec-list { display:flex; flex-direction:column; gap:6px; }
        .rec-item { background:#0d0d1a; border-radius:7px; padding:9px; border:1px solid #2a2a40; }
        .rec-item-name { font-size:0.8rem; color:#ddd; margin-bottom:6px; }
        .rec-item-actions { display:flex; gap:5px; }
        .rec-item-actions button {
            padding:4px 10px; border:none; border-radius:4px; cursor:pointer;
            font-size:0.72rem; font-weight:600;
        }

        /* Layout cards */
        .layout-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }
        .layout-card {
            display:flex; flex-direction:column; align-items:center; gap:4px;
            padding:6px 4px; border-radius:7px; cursor:pointer;
            border:2px solid #2a2a40; background:#0d0d1a; transition:all 0.15s;
        }
        .layout-card:hover { border-color:#555; }
        .layout-card.active { border-color:#00d4ff; background:#00d4ff0d; }
        .layout-card span { font-size:0.62rem; color:#aaa; }
        .layout-card.active span { color:#00d4ff; }
        .layout-card svg { width:100%; height:auto; border-radius:3px; }

        /* Color swatches */
        .color-swatch {
            width:22px; height:22px; border-radius:5px; border:2px solid transparent;
            cursor:pointer; transition:border-color 0.12s; flex-shrink:0;
        }
        .color-swatch:hover { border-color:#888; }
        .color-swatch.active { border-color:#00d4ff; }

        /* Template cards */
        .template-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
        .template-card {
            padding:8px 6px; border-radius:7px; border:1px solid #2a2a40;
            background:#0d0d1a; cursor:pointer; text-align:center; transition:all 0.15s;
        }
        .template-card:hover { border-color:#00d4ff; background:#00d4ff0d; }
        .template-card .tc-icon { font-size:1.2rem; display:block; margin-bottom:4px; }
        .template-card .tc-name { font-size:0.72rem; color:#ddd; display:block; }
        .template-card .tc-desc { font-size:0.65rem; color:#666; display:block; margin-top:2px; }

        /* Live preview container */
        .ed-preview-wrap {
            width:100%; height:135px; border-radius:8px; border:1px solid #2a2a40;
            overflow:hidden; flex-shrink:0; position:relative; background:#0d0d1a;
        }
        .ed-preview-wrap iframe {
            width:1280px; height:720px; border:none;
            transform:scale(0.1875); transform-origin:top left;
            pointer-events:none;
        }

        /* Slide editor expandido */
        .slide-editor { display:flex; flex-direction:column; gap:8px; }

        .hidden { display:none !important; }
    </style>
</head>
<body>

<!-- ── TOP BAR ── -->
<div class="top-bar">
    <div class="top-bar-left">
        <span class="app-title">🎥 Presentador</span>
        <span id="recStatus" class="badge">Sin grabación</span>
        <span id="obsStatus" class="badge">OBS: —</span>
        <span id="pearStatus" class="badge">🍐 —</span>
    </div>
    <div class="top-bar-right">
        <button class="top-btn" style="background:#1a1a2e;color:#00d4ff;border:1px solid #00d4ff30;" onclick="openModal('modalPresentaciones')">📂 Presentaciones</button>
        <button class="top-btn" style="background:#1a1a2e;color:#ffd700;border:1px solid #ffd70030;" onclick="openModal('modalGrabaciones')">🎬 Grabaciones</button>
    </div>
</div>

<!-- ── MAIN LAYOUT ── -->
<div class="main">

    <!-- Panel izquierdo: miniaturas -->
    <div class="left-panel">
        <div class="pres-header">
            <div class="pres-name" id="presName">Sin presentación</div>
            <div class="pres-actions">
                <button style="background:#0f3460;color:white;" onclick="openModal('modalPresentaciones')">📂</button>
                <button style="background:#00d4ff20;color:#00d4ff;border:1px solid #00d4ff30;" onclick="openEditorNueva()">+ Nueva</button>
                <button style="background:#1a1a2e;color:#aaa;border:1px solid #333;" onclick="editarPresentacionActual()" title="Editar slides">✏️</button>
            </div>
        </div>
        <div class="thumb-strip" id="thumbStrip"></div>
    </div>

    <!-- Panel central: preview -->
    <div class="center-panel">
        <div class="slide-preview">
            <iframe id="slideFrame" src="viewer.html"></iframe>
        </div>
        <div class="slide-meta">
            <div class="slide-title" id="currentTitle">—</div>
            <div class="slide-counter">Slide <span id="currentNum">0</span> de <span id="totalNum">0</span></div>
        </div>
        <div class="nav-controls">
            <button class="btn-nav" onclick="prevSlide()">◀ Anterior</button>
            <button class="btn-nav" onclick="nextSlide()">Siguiente ▶</button>
            <button class="btn-projector" onclick="abrirProyector()">📺 Proyector</button>
        </div>
    </div>

    <!-- Panel derecho -->
    <div class="right-panel">

        <!-- Guión -->
        <div class="panel-section">
            <div class="section-title">Guión</div>
            <div class="notes-content" id="notesContent">—</div>
        </div>

        <!-- Grabación -->
        <div class="panel-section">
            <div class="section-title">Grabación</div>
            <div class="rec-mode-toggle">
                <button class="mode-btn active" id="modeBrowser" onclick="setRecMode('browser')">🌐 Navegador</button>
                <button class="mode-btn" id="modeOBS" onclick="setRecMode('obs')">🎥 OBS</button>
            </div>

            <!-- Modo Navegador -->
            <div id="recBrowserPanel">
                <div style="margin-bottom:6px;display:flex;gap:4px;">
                    <select id="micDeviceSelect"
                        style="flex:1;padding:4px 6px;background:#0d0d1a;border:1px solid #2a2a40;border-radius:5px;color:#aaa;font-size:0.72rem;cursor:pointer;"
                        onchange="onMicDeviceChange()">
                        <option value="">🎙 Predeterminado</option>
                    </select>
                    <button onclick="populateMicDevices()" title="Refrescar dispositivos"
                        style="padding:4px 7px;border:1px solid #2a2a40;border-radius:5px;background:#0d0d1a;color:#aaa;font-size:0.75rem;cursor:pointer;">🔄</button>
                </div>
                <div class="mic-row">
                    <div class="mic-dot" id="micDot"></div>
                    <span id="micLabel" style="flex:1;">Micrófono no activo</span>
                    <button class="mic-toggle" id="micToggle" onclick="toggleMic()">Activar</button>
                </div>
                <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
                    <label style="font-size:0.78rem;color:#aaa;">Calidad:</label>
                    <select id="recQuality" style="font-size:0.78rem;padding:2px 4px;background:#2a2a3a;color:#fff;border:1px solid #444;border-radius:4px;">
                        <option value="1080">1080p — Alta (más RAM)</option>
                        <option value="720" selected>720p — Media (recomendada)</option>
                        <option value="480">480p — Baja (menos RAM)</option>
                    </select>
                </div>
                <div class="rec-btn-row">
                    <button class="rec-btn btn-start" id="browserRecBtn" onclick="browserToggleRec()">⏺ Grabar</button>
                    <button class="rec-btn btn-stop" id="browserStopBtn" onclick="browserStopRec()" disabled>⏹ Detener</button>
                </div>
            </div>

            <!-- Modo OBS -->
            <div id="recOBSPanel" class="hidden">
                <div class="obs-fields">
                    <label>Puerto</label>
                    <input type="text" id="obsPort" value="4455" style="width:55px;flex:none;">
                    <label>Pass</label>
                    <input type="password" id="obsPass" placeholder="vacía si no">
                </div>
                <div class="obs-btn-row" style="margin-bottom:6px;">
                    <button class="obs-btn obs-connect" onclick="obsConnect()">🔗 Conectar</button>
                </div>
                <div class="obs-btn-row" id="obsRecControls" style="display:none">
                    <button class="obs-btn obs-record" id="obsRecBtn" onclick="obsToggleRec()">⏺ Iniciar</button>
                    <button class="obs-btn obs-stop" id="obsStopBtn" onclick="obsStopRec()" disabled>⏹ Detener</button>
                </div>
            </div>
        </div>

        <!-- Cámara -->
        <div class="panel-section">
            <div class="section-title">📷 Cámara <span style="color:#555;font-size:0.7rem;font-weight:400;">(opcional)</span></div>

            <div class="mic-row" style="margin-bottom:6px;">
                <div class="mic-dot" id="camDot"></div>
                <span id="camLabel" style="flex:1;font-size:0.75rem;">No activa</span>
                <button class="mic-toggle" id="camToggle" onclick="toggleCamera()">Activar</button>
            </div>

            <div id="camPreview" style="display:none;margin-bottom:7px;">
                <video id="camVideo" autoplay muted playsinline></video>
            </div>

            <!-- Posición: grid 3x2 -->
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;margin-bottom:5px;">
                <button class="cam-pos-btn" data-pos="tl"     onclick="setCamPos('tl')">↖</button>
                <button class="cam-pos-btn" data-pos="center" onclick="setCamPos('center')">⊙ Centro</button>
                <button class="cam-pos-btn" data-pos="tr"     onclick="setCamPos('tr')">↗</button>
                <button class="cam-pos-btn" data-pos="bl"     onclick="setCamPos('bl')">↙</button>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════
// IndexedDB
// ═══════════════════════════════════════════════════════════════════
let _db = null;
function openDB() {
    if (_db) return Promise.resolve(_db);
    return new Promise((res, rej) => {
        const req = indexedDB.open('PresentacionesDB', 1);
        req.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('presentations'))
                db.createObjectStore('presentations', { keyPath:'id' });
            if (!db.objectStoreNames.contains('recordings'))
                db.createObjectStore('recordings', { keyPath:'id' });
        };
        req.onsuccess = e => { _db = e.target.result; res(_db); };
        req.onerror   = e => rej(e.target.error);
    });
}
async function dbGetAll(store) {
    const db = await openDB();
    return new Promise((res, rej) => {
        const tx  = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).getAll();
        req.onsuccess = e => res(e.target.result);
        req.onerror   = e => rej(e.target.error);
    });
}
async function dbGet(store, id) {
    const db = await openDB();
    return new Promise((res, rej) => {
        const tx  = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).get(id);
        req.onsuccess = e => res(e.target.result);
        req.onerror   = e => rej(e.target.error);
    });
}
async function dbPut(store, obj) {
    const db = await openDB();
    return new Promise((res, rej) => {
        const tx  = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).put(obj);
        req.onsuccess = e => res(e.target.result);
        req.onerror   = e => rej(e.target.error);
    });
}
async function dbDelete(store, id) {
    const db = await openDB();
    return new Promise((res, rej) => {
        const tx  = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).delete(id);
        req.onsuccess = e => res(e.target.result);
        req.onerror   = e => rej(e.target.error);
    });
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// ═══════════════════════════════════════════════════════════════════
// Estado global
// ═══════════════════════════════════════════════════════════════════
let currentPres    = null;   // presentación activa { id, name, slides }
let currentIndex   = 0;
let projectorWin   = null;

// ═══════════════════════════════════════════════════════════════════
// Carga y render de presentación
// ═══════════════════════════════════════════════════════════════════
function loadPresentacion(pres) {
    currentPres  = pres;
    currentIndex = 0;
    document.getElementById('presName').textContent = pres.name;
    // Si la presentación tiene viewer personalizado, cargarlo en el iframe
    const viewerSrc = pres.viewer || 'viewer.html';
    const slideFrame = document.getElementById('slideFrame');
    if (slideFrame.src !== viewerSrc && !slideFrame.src.endsWith(viewerSrc)) {
        slideFrame.src = viewerSrc;
        slideFrame.onload = () => sendToViewers({ action:'load', slides:pres.slides, index:0 });
    } else {
        sendToViewers({ action:'load', slides:pres.slides, index:0 });
    }
    renderThumbs();
    updateUI();
    closeModal('modalPresentaciones');
}

function sendToViewers(msg) {
    try { document.getElementById('slideFrame').contentWindow.postMessage(msg, '*'); } catch(e){}
    if (projectorWin && !projectorWin.closed) projectorWin.postMessage(msg, '*');
}

function updateUI() {
    if (!currentPres) return;
    const s = currentPres.slides[currentIndex];
    document.getElementById('currentTitle').textContent = s?.title || '—';
    document.getElementById('currentNum').textContent   = currentIndex + 1;
    document.getElementById('totalNum').textContent     = currentPres.slides.length;
    document.getElementById('notesContent').textContent = s?.notes || '—';

    document.querySelectorAll('.thumb-item').forEach((el, i) => {
        el.classList.toggle('active', i === currentIndex);
        if (i === currentIndex) el.scrollIntoView({ block:'nearest' });
    });

    applyCamFromSlide(currentIndex);
}

// Iconos para cada tipo de layout
const layoutIcons = {
    '': '☰',
    'cover': '◉',
    'highlight': '★',
    'image': '▣'
};

function renderThumbs() {
    const strip = document.getElementById('thumbStrip');
    strip.innerHTML = '';
    if (!currentPres) return;
    currentPres.slides.forEach((s, i) => {
        const item = document.createElement('div');
        item.className = 'thumb-item' + (i === currentIndex ? ' active' : '');
        item.onclick = () => { currentIndex = i; sendToViewers({ action:'goto', index:i }); updateUI(); };

        const ifrm = document.createElement('iframe');
        ifrm.src = 'viewer.html';
        ifrm.onload = () => {
            try { ifrm.contentWindow.postMessage({ action:'load', slides:currentPres.slides, index:i }, '*'); } catch(e){}
        };

        const num = document.createElement('div');
        num.className = 'thumb-num';
        num.textContent = i + 1;

        // Icono del layout
        const layoutEl = document.createElement('div');
        layoutEl.className = 'thumb-layout';
        layoutEl.innerHTML = `<span class="thumb-layout-icon">${layoutIcons[s.layout || ''] || '☰'}</span>${s.layout || 'bullets'}`;
        layoutEl.title = 'Layout: ' + (s.layout || 'bullets');

        item.appendChild(ifrm);
        item.appendChild(layoutEl);
        item.appendChild(num);
        strip.appendChild(item);
    });
}

function nextSlide() {
    if (!currentPres || currentIndex >= currentPres.slides.length - 1) return;
    currentIndex++;
    sendToViewers({ action:'goto', index:currentIndex });
    updateUI();
}
function prevSlide() {
    if (!currentPres || currentIndex <= 0) return;
    currentIndex--;
    sendToViewers({ action:'goto', index:currentIndex });
    updateUI();
}

document.addEventListener('keydown', e => {
    // Ctrl+Z / Ctrl+Y dentro del editor
    if (!document.getElementById('modalEditor')?.classList.contains('hidden')) {
        if (e.ctrlKey && e.key === 'z') { e.preventDefault(); edUndo(); return; }
        if (e.ctrlKey && (e.key === 'y' || (e.shiftKey && e.key === 'z'))) { e.preventDefault(); edRedo(); return; }
    }
    if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextSlide();
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prevSlide();
});

function abrirProyector() {
    if (!currentPres) { alert('Carga una presentación primero.'); return; }
    const viewerSrc = currentPres.viewer || 'viewer.html';
    projectorWin = window.open(viewerSrc, 'proyector', 'width=1280,height=720');

    const sendAll = () => {
        projectorWin.postMessage({ action:'load', slides:currentPres.slides, index:currentIndex }, '*');
        if (cameraEnabled && cameraStream) {
            projectorWin.postMessage({ action:'camera', enabled:true, pos:camPos, shape:camShape, size:camSize, mirror:camMirror }, '*');
        }
    };

    projectorWin.addEventListener('load', sendAll);
    // fallback — el evento load a veces no dispara en ventanas cross-origin
    setTimeout(sendAll, 1200);
}

async function renderPresList() {

// ═══════════════════════════════════════════════════════════════════
// Editor de presentación
// ═══════════════════════════════════════════════════════════════════
let edSlides = [];
let edSelectedIdx = -1;
let edEditingId   = null;

// ── Historial de cambios (hasta 20 pasos) ────────────────────────────────────
const ED_MAX_HISTORY = 20;
let edHistory    = [];
let edHistoryIdx = -1;
let edSnapshotTimer = null;

function edSnapshot() {
    // Captura el estado actual del formulario antes de guardar
    edSaveCurrentForm();
    const raw = JSON.stringify({ s: edSlides, i: edSelectedIdx });
    // No duplicar si el estado no cambió
    if (edHistoryIdx >= 0 && edHistory[edHistoryIdx] === raw) return;
    // Eliminar redo history al hacer un cambio nuevo
    edHistory = edHistory.slice(0, edHistoryIdx + 1);
    edHistory.push(raw);
    if (edHistory.length > ED_MAX_HISTORY) edHistory.shift();
    edHistoryIdx = edHistory.length - 1;
    _edUpdateHistoryUI();
}

function edSnapshotDebounced() {
    clearTimeout(edSnapshotTimer);
    edSnapshotTimer = setTimeout(edSnapshot, 700);
}

function edUndo() {
    if (edHistoryIdx <= 0) return;
    edHistoryIdx--;
    _edApplySnapshot();
}

function edRedo() {
    if (edHistoryIdx >= edHistory.length - 1) return;
    edHistoryIdx++;
    _edApplySnapshot();
}

function _edApplySnapshot() {
    const state   = JSON.parse(edHistory[edHistoryIdx]);
    edSlides      = state.s;
    edSelectedIdx = state.i;
    renderEdSlideList();
    edShowSlideForm(edSelectedIdx);
    _edUpdateHistoryUI();
}

function _edUpdateHistoryUI() {
    const u = document.getElementById('edUndoBtn');
    const r = document.getElementById('edRedoBtn');
    const l = document.getElementById('edHistoryLabel');
    if (u) u.disabled = edHistoryIdx <= 0;
    if (r) r.disabled = edHistoryIdx >= edHistory.length - 1;
    if (l) l.textContent = edHistory.length > 1
        ? `${edHistoryIdx + 1}/${edHistory.length}`
        : '';
}

function _edResetHistory() {
    edHistory    = [];
    edHistoryIdx = -1;
    _edUpdateHistoryUI();
}

function openEditorNueva() {
    edEditingId   = null;
    edSlides      = [];
    edSelectedIdx = -1;
    _edResetHistory();
    document.getElementById('editorTitle').textContent = 'Nueva presentación';
    document.getElementById('edPresName').value = '';
    renderEdSlideList();
    edShowSlideForm(-1);
    openModal('modalEditor');
}

async function openEditorExistente(id, startIndex) {
    const p = await dbGet('presentations', id);
    if (!p) return;
    edEditingId   = p.id;
    edSlides      = JSON.parse(JSON.stringify(p.slides || []));
    edSelectedIdx = (startIndex != null && startIndex >= 0 && startIndex < edSlides.length)
        ? startIndex
        : (edSlides.length ? 0 : -1);
    _edResetHistory();
    document.getElementById('editorTitle').textContent = 'Editar: ' + p.name;
    document.getElementById('edPresName').value = p.name;
    renderEdSlideList();
    edShowSlideForm(edSelectedIdx);
    closeModal('modalPresentaciones');
    openModal('modalEditor');
}

function editarPresentacionActual() {
    if (!currentPres) return openEditorNueva();
    openEditorExistente(currentPres.id, currentIndex);
}

function renderEdSlideList() {
    const el = document.getElementById('edSlideList');
    el.innerHTML = '';
    edSlides.forEach((s, i) => {
        const item = document.createElement('div');
        item.className = 'slide-list-item' + (i === edSelectedIdx ? ' active' : '');
        item.innerHTML = `<span class="sli-num">${i+1}</span><span class="sli-title">${s.title || 'Sin título'}</span><button class="sli-del" onclick="event.stopPropagation();edDelSlide(${i})">✕</button>`;
        item.onclick = () => { edSaveCurrentForm(); edSelectedIdx = i; renderEdSlideList(); edShowSlideForm(i); };
        el.appendChild(item);
    });
}

// ── Editor de slide ──────────────────────────────────────────────────────────

function edShowSlideForm(idx) {
    const form = document.getElementById('edSlideForm');
    if (idx < 0 || !edSlides[idx]) {
        form.innerHTML = `
            <p style="color:#888;font-size:0.82rem;margin-bottom:10px;">Elige una plantilla para el nuevo slide:</p>
            <div class="template-grid">
                ${SLIDE_TEMPLATES.map((t,i) => `
                    <div class="template-card" onclick="edApplyTemplate(${i})">
                        <span class="tc-icon">${t.icon}</span>
                        <span class="tc-name">${t.name}</span>
                        <span class="tc-desc">${t.desc}</span>
                    </div>`).join('')}
            </div>`;
        return;
    }
    const s     = edSlides[idx];
    const curBg = s.bg || '#0d0d1a';
    const pickerVal = /^#[0-9a-fA-F]{3,6}$/.test(curBg) ? curBg : '#0d0d1a';

    form.innerHTML = `
        <div style="display:flex;gap:10px;align-items:flex-start;">

            <!-- Columna izquierda: campos -->
            <div style="flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;">

                <!-- Layout selector visual -->
                <div>
                    <div style="font-size:0.72rem;color:#aaa;margin-bottom:5px;">Layout</div>
                    <div class="layout-grid">
                        ${Object.entries(LAYOUT_DEFS).map(([key, def]) => `
                            <div class="layout-card${(s.layout||'')=== key?' active':''}"
                                 data-layout="${key}" onclick="edSetLayout('${key}')">
                                ${def.svg}
                                <span>${def.name}</span>
                            </div>`).join('')}
                    </div>
                    <input type="hidden" id="efLayout" value="${escHtml(s.layout||'')}">
                </div>

                <!-- Título + Tag -->
                <div style="display:flex;gap:7px;">
                    <div class="field-group" style="flex:2;">
                        <label>Título</label>
                        <input id="efTitle" value="${escHtml(s.title||'')}" oninput="updateEdPreview()" onchange="edSnapshotDebounced()">
                    </div>
                    <div class="field-group" style="flex:1;">
                        <label>Tag</label>
                        <input id="efTag" value="${escHtml(s.tag||'')}" oninput="updateEdPreview()" onchange="edSnapshotDebounced()">
                    </div>
                </div>

                <!-- Contenido -->
                <div class="field-group">
                    <label>Contenido <span style="color:#555;font-size:0.68rem;">(cada línea = un punto)</span></label>
                    <textarea id="efContent" rows="4" oninput="updateEdPreview()" onchange="edSnapshotDebounced()">${escHtml(s.content||'')}</textarea>
                </div>

                <!-- Guión -->
                <div class="field-group">
                    <label>Guión <span style="color:#555;font-size:0.68rem;">(solo para el presentador)</span></label>
                    <textarea id="efNotes" rows="3" onchange="edSnapshotDebounced()">${escHtml(s.notes||'')}</textarea>
                </div>

                <!-- Elementos adicionales -->
                <div>
                    <div id="edElementsSection">${edElementsHTML(idx)}</div>
                </div>
            </div>

            <!-- Columna derecha: preview + color -->
            <div style="width:240px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;position:sticky;top:0;align-self:flex-start;">

                <!-- Live preview -->
                <div>
                    <div style="font-size:0.72rem;color:#aaa;margin-bottom:5px;">Vista previa</div>
                    <div class="ed-preview-wrap">
                        <iframe id="edPreviewFrame" src="viewer.html"></iframe>
                    </div>
                </div>

                <!-- Color de fondo -->
                <div>
                    <div style="font-size:0.72rem;color:#aaa;margin-bottom:5px;">Fondo</div>
                    <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;" id="colorSwatches">
                        ${COLOR_PRESETS.map(c => {
                            const isActive = curBg === c.value;
                            return `<button class="color-swatch${isActive?' active':''}"
                                style="background:${c.value}"
                                title="${c.name}"
                                data-bg="${c.value.replace(/"/g,'&quot;')}"
                                onclick="edSetBg(this.dataset.bg)"></button>`;
                        }).join('')}
                    </div>
                    <div style="display:flex;gap:6px;align-items:center;">
                        <input type="color" id="efBgPicker" value="${pickerVal}"
                            style="width:36px;height:30px;padding:2px;cursor:pointer;border-radius:5px;border:1px solid #333;background:#0d0d1a;"
                            oninput="document.getElementById('efBg').value=this.value;updateEdPreview();syncSwatches()">
                        <input id="efBg" value="${escHtml(curBg)}"
                            placeholder="#hex o gradient"
                            style="flex:1;font-size:0.75rem;"
                            oninput="syncColorPicker();updateEdPreview();syncSwatches()">
                    </div>
                </div>

                <!-- Cámara por slide -->
                <div id="edCamSection">${edCamSectionHTML(idx)}</div>

            </div>
        </div>
    `;

    // Cargar preview tras render del iframe
    setTimeout(updateEdPreview, 250);
}

function edSetLayout(layout) {
    document.querySelectorAll('.layout-card').forEach(c =>
        c.classList.toggle('active', c.dataset.layout === layout));
    edSnapshot();
    const inp = document.getElementById('efLayout');
    if (inp) inp.value = layout;
    updateEdPreview();
}

function edSetBg(value) {
    edSnapshot();
    const inp = document.getElementById('efBg');
    if (inp) inp.value = value;
    const picker = document.getElementById('efBgPicker');
    if (picker && /^#[0-9a-fA-F]{3,6}$/.test(value)) picker.value = value;
    syncSwatches();
    updateEdPreview();
}

function syncColorPicker() {
    const val = document.getElementById('efBg')?.value || '';
    if (/^#[0-9a-fA-F]{6}$/.test(val)) {
        const p = document.getElementById('efBgPicker');
        if (p) p.value = val;
    }
}

function syncSwatches() {
    const val = document.getElementById('efBg')?.value || '';
    document.querySelectorAll('.color-swatch').forEach(btn => {
        const match = COLOR_PRESETS.find(c => c.value === val);
        btn.classList.toggle('active', match ? match.value === btn.title.replace(/.*title="([^"]+)".*/, '$1') : false);
    });
    // Simplificado: comparar por onclick value
    document.querySelectorAll('#colorSwatches .color-swatch').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.bg === val);
    });
}

function updateEdPreview() {
    const iframe = document.getElementById('edPreviewFrame');
    if (!iframe?.contentWindow) return;
    const slide = {
        title:        document.getElementById('efTitle')?.value   || '',
        content:      document.getElementById('efContent')?.value || '',
        notes:        document.getElementById('efNotes')?.value   || '',
        layout:       document.getElementById('efLayout')?.value  || '',
        tag:          document.getElementById('efTag')?.value     || '',
        bg:           document.getElementById('efBg')?.value      || '#0d0d1a',
        elements:     edSlides[edSelectedIdx]?.elements     || [],
        layoutHidden: edSlides[edSelectedIdx]?.layoutHidden || false
    };
    try {
        iframe.contentWindow.postMessage({ action:'load', slides:[slide], index:0 }, '*');
    } catch(e) {}
}

// ── Elementos por slide ──────────────────────────────────────────────────────

function edElementsHTML(idx) {
    const s   = edSlides[idx];
    const els = s?.elements || [];

    const elCards = els.map((el, i) => {
        const isText = el.type === 'text';
        const activeStyle = (active) =>
            active ? 'border:1px solid #00d4ff;background:#00d4ff15;color:#00d4ff;'
                   : 'border:1px solid #2a2a40;background:#0d0d1a;color:#666;';

        const styleRow = isText ? `
            <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:2px;">
                <input type="color" value="${el.color||'#ffffff'}"
                    style="width:24px;height:22px;padding:1px;cursor:pointer;border-radius:3px;border:1px solid #333;background:#0d0d1a;flex-shrink:0;"
                    oninput="edUpdateEl(${idx},${i},'color',this.value)">
                <button onclick="edUpdateEl(${idx},${i},'bold',!edSlides[${idx}].elements[${i}].bold)"
                    style="padding:2px 7px;border-radius:4px;font-weight:700;font-size:0.75rem;cursor:pointer;${activeStyle(el.bold)}">B</button>
                <button onclick="edUpdateEl(${idx},${i},'italic',!edSlides[${idx}].elements[${i}].italic)"
                    style="padding:2px 7px;border-radius:4px;font-style:italic;font-size:0.75rem;cursor:pointer;${activeStyle(el.italic)}">I</button>
                <select onchange="edUpdateEl(${idx},${i},'align',this.value)"
                    style="padding:2px 4px;font-size:0.7rem;background:#0d0d1a;border:1px solid #2a2a40;border-radius:4px;color:#ccc;">
                    <option value="left"${(el.align||'left')==='left'?' selected':''}>← Izq</option>
                    <option value="center"${el.align==='center'?' selected':''}>↔ Centro</option>
                    <option value="right"${el.align==='right'?' selected':''}>→ Der</option>
                </select>
            </div>` : `
            <div style="display:flex;gap:4px;align-items:center;margin-top:2px;">
                <span class="el-lbl">Ajuste:</span>
                <button onclick="edUpdateEl(${idx},${i},'fit','contain')"
                    style="padding:2px 8px;border-radius:4px;font-size:0.7rem;cursor:pointer;${activeStyle((el.fit||'contain')==='contain')}">Contener</button>
                <button onclick="edUpdateEl(${idx},${i},'fit','cover')"
                    style="padding:2px 8px;border-radius:4px;font-size:0.7rem;cursor:pointer;${activeStyle(el.fit==='cover')}">Rellenar</button>
            </div>`;

        const rng = (key, val, min, max, color, unit) =>
            `<input type="range" min="${min}" max="${max}" step="${unit==='vw'?0.25:1}" value="${val}"
                style="flex:1;accent-color:${color};cursor:pointer;height:4px;"
                onpointerdown="edSnapshot()"
                oninput="edUpdateEl(${idx},${i},'${key}',+this.value);this.nextElementSibling.textContent=this.value+'${unit||'%'}'">
            <span style="font-size:0.68rem;color:#aaa;min-width:36px;text-align:right;">${val}${unit||'%'}</span>`;

        const sizeRange = isText
            ? rng('size', el.fontSize??2.5, 0.5, 15, '#7b2ff7', 'vw')
            : rng('size', el.w??30, 5, 100, '#7b2ff7');

        const total = els.length;
        return `<div class="el-card">
            <div style="display:flex;align-items:center;gap:4px;">
                <button class="el-type-btn${isText?' active':''}" onclick="edChangeElType(${idx},${i},'text')">T Texto</button>
                <button class="el-type-btn${!isText?' active':''}" onclick="edChangeElType(${idx},${i},'image')">🖼 Imagen</button>
                <span style="margin-left:auto;display:flex;gap:2px;align-items:center;">
                    <button onclick="edMoveEl(${idx},${i},-1)" ${i===0?'disabled':''} title="Subir (menor z-index)"
                        style="padding:2px 6px;border:1px solid #2a2a40;border-radius:4px;background:#0d0d1a;color:${i===0?'#333':'#aaa'};font-size:0.7rem;cursor:${i===0?'default':'pointer'};">▲</button>
                    <span style="font-size:0.65rem;color:#444;min-width:14px;text-align:center;">${i+1}</span>
                    <button onclick="edMoveEl(${idx},${i},1)" ${i===total-1?'disabled':''} title="Bajar (mayor z-index)"
                        style="padding:2px 6px;border:1px solid #2a2a40;border-radius:4px;background:#0d0d1a;color:${i===total-1?'#333':'#aaa'};font-size:0.7rem;cursor:${i===total-1?'default':'pointer'};">▼</button>
                    <button onclick="edDelElement(${idx},${i})"
                        style="padding:2px 8px;border:1px solid #3a1a1a;border-radius:4px;background:#1a0a0a;color:#e74c3c;font-size:0.72rem;cursor:pointer;margin-left:2px;">✕</button>
                </span>
            </div>
            <input value="${escHtml(el.content||'')}" placeholder="${isText?'Texto del elemento…':'URL de imagen…'}"
                style="width:100%;padding:4px 7px;font-size:0.75rem;background:#0d0d1a;border:1px solid #2a2a40;border-radius:4px;color:#ccc;"
                oninput="edUpdateEl(${idx},${i},'content',this.value)">
            <div style="display:flex;align-items:center;gap:6px;">
                <span class="el-lbl" style="width:10px;">X</span>
                ${rng('x', el.x??10, 0, 95, '#00d4ff')}
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
                <span class="el-lbl" style="width:10px;">Y</span>
                ${rng('y', el.y??10, 0, 95, '#00d4ff')}
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
                <span class="el-lbl" style="width:10px;">${isText?'T':'⊡'}</span>
                ${sizeRange}
            </div>
            ${styleRow}
        </div>`;
    }).join('');

    const layoutHidden = !!s?.layoutHidden;
    return `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:4px;">
            <span style="font-size:0.72rem;color:#aaa;">Elementos (${els.length})${layoutHidden?' · <span style="color:#00d4ff;">layout libre</span>':''}</span>
            <div style="display:flex;gap:4px;flex-wrap:wrap;">
                ${layoutHidden
                    ? `<button onclick="edRestoreLayout(${idx})"
                        style="padding:3px 9px;border:1px solid #2a4a2a;border-radius:4px;background:#0a1a0a;color:#2ecc71;font-size:0.7rem;cursor:pointer;">↩ Restaurar layout</button>`
                    : `<button onclick="edConvertLayoutToElements(${idx})"
                        style="padding:3px 9px;border:1px solid #3a2a50;border-radius:4px;background:#1a0a2e;color:#a78bfa;font-size:0.7rem;cursor:pointer;">📐 Ajustar layout</button>`
                }
                <button onclick="edAddElement(${idx},'text')"
                    style="padding:3px 9px;border:1px solid #2a2a40;border-radius:4px;background:#0d0d1a;color:#aaa;font-size:0.7rem;cursor:pointer;">+ Texto</button>
                <button onclick="edAddElement(${idx},'image')"
                    style="padding:3px 9px;border:1px solid #2a2a40;border-radius:4px;background:#0d0d1a;color:#aaa;font-size:0.7rem;cursor:pointer;">+ Imagen</button>
            </div>
        </div>
        <div id="edElList">
            ${elCards || '<div style="color:#444;font-size:0.72rem;padding:2px 0;">Sin elementos adicionales</div>'}
        </div>`;
}

function edConvertLayoutToElements(idx) {
    const s = edSlides[idx];
    if (!s) return;
    edSnapshot();
    if (!s.elements) s.elements = [];
    const layout  = s.layout || '';
    const lines   = (s.content || '').split('\n').map(l => l.trim()).filter(Boolean);
    const isCover = layout === 'cover';
    const newEls  = [];

    // Tag
    if (s.tag) newEls.push({
        type:'text', content:s.tag,
        x:10, y:4, w:50, h:6,
        fontSize:0.9, color:'rgba(0,212,255,0.7)', bold:true, italic:false, align:'left'
    });

    // Título
    if (s.title) newEls.push({
        type:'text', content:s.title,
        x: isCover ? 5  : 10,
        y: isCover ? 28 : 12,
        w: isCover ? 90 : 80,
        h: isCover ? 22 : 18,
        fontSize: isCover ? 5 : 3.5,
        color:'#ffffff', bold:true, italic:false,
        align: isCover ? 'center' : 'left'
    });

    // Contenido / subtítulo / highlight / imagen
    if (layout === 'highlight' && lines.length) {
        newEls.push({
            type:'text', content:lines.join('\n'),
            x:5, y:42, w:90, h:22,
            fontSize:2.5, color:'#00d4ff', bold:true, italic:false, align:'center'
        });
    } else if (layout === 'image' && lines[0]) {
        newEls.push({
            type:'image', content:lines[0],
            x:15, y:36, w:70, h:55, fit:'contain'
        });
    } else if (lines.length) {
        newEls.push({
            type:'text', content:lines.join('\n'),
            x:10,
            y: isCover ? 54 : 35,
            w:80,
            h: isCover ? 14 : 58,
            fontSize: isCover ? 1.8 : 1.8,
            color:'rgba(255,255,255,0.85)', bold:false, italic:false,
            align: isCover ? 'center' : 'left'
        });
    }

    s.elements = [...newEls, ...s.elements];
    s.layoutHidden = true;
    document.getElementById('edElementsSection').innerHTML = edElementsHTML(idx);
    updateEdPreview();
}

function edRestoreLayout(idx) {
    const s = edSlides[idx];
    if (!s) return;
    edSnapshot();
    delete s.layoutHidden;
    document.getElementById('edElementsSection').innerHTML = edElementsHTML(idx);
    updateEdPreview();
}

function edAddElement(idx, type) {
    if (!edSlides[idx]) return;
    edSnapshot();
    if (!edSlides[idx].elements) edSlides[idx].elements = [];
    edSlides[idx].elements.push(type === 'text'
        ? { type:'text',  content:'', x:10, y:10, w:40, h:15, fontSize:2.5, color:'#ffffff', bold:false, italic:false, align:'left' }
        : { type:'image', content:'', x:20, y:20, w:60, h:60, fit:'contain' });
    document.getElementById('edElementsSection').innerHTML = edElementsHTML(idx);
    updateEdPreview();
}

function edDelElement(idx, i) {
    edSnapshot();
    edSlides[idx]?.elements?.splice(i, 1);
    document.getElementById('edElementsSection').innerHTML = edElementsHTML(idx);
    updateEdPreview();
}

function edMoveEl(idx, i, dir) {
    const els = edSlides[idx]?.elements;
    if (!els) return;
    edSnapshot();
    const j = i + dir;
    if (j < 0 || j >= els.length) return;
    [els[i], els[j]] = [els[j], els[i]];
    document.getElementById('edElementsSection').innerHTML = edElementsHTML(idx);
    updateEdPreview();
}

function edChangeElType(idx, i, type) {
    const el = edSlides[idx]?.elements?.[i];
    if (!el || el.type === type) return;
    edSnapshot();
    edSlides[idx].elements[i] = type === 'text'
        ? { type:'text',  content:el.content||'', x:el.x, y:el.y, w:el.w, h:el.h, fontSize:2.5, color:'#ffffff', bold:false, italic:false, align:'left' }
        : { type:'image', content:el.content||'', x:el.x, y:el.y, w:el.w, h:el.h, fit:'contain' };
    document.getElementById('edElementsSection').innerHTML = edElementsHTML(idx);
    updateEdPreview();
}

function edUpdateEl(idx, i, key, value) {
    const el = edSlides[idx]?.elements?.[i];
    if (!el) return;
    if (key === 'size') {
        if (el.type === 'text') {
            el.fontSize = value;
        } else {
            const ratio = (el.w && el.h) ? el.h / el.w : 1;
            el.w = value;
            el.h = Math.max(1, Math.round(value * ratio));
        }
    } else {
        el[key] = value;
    }
    updateEdPreview();
    // Re-render solo controles de toggle/select
    if (['bold','italic','fit','align'].includes(key)) {
        document.getElementById('edElementsSection').innerHTML = edElementsHTML(idx);
    }
}

function edCamSectionHTML(idx) {
    const s   = edSlides[idx];
    const cfg = s?.camConfig;
    if (!cfg) {
        return `<div style="color:#666;font-size:0.75rem;padding:6px 0;">📷 Sin config de cámara guardada
            <button onclick="edSetCamSlide(${idx},'init',true)"
                style="margin-left:8px;padding:3px 8px;border:1px solid #2a2a40;border-radius:4px;
                    background:#0d0d1a;color:#aaa;font-size:0.72rem;cursor:pointer;">
                + Agregar config
            </button>
        </div>`;
    }
    const p = cfg.pos   || 'br';
    const sh= cfg.shape || 'rect';
    const sz= cfg.size  ?? 22;
    const mi= cfg.mirror ?? true;

    const posBtn = (pos, label) =>
        `<button onclick="edSetCamSlide(${idx},'pos','${pos}')"
            style="flex:1;padding:5px 3px;border:1px solid ${p===pos?'#00d4ff':'#2a2a40'};border-radius:5px;
                background:${p===pos?'#00d4ff15':'#0d0d1a'};color:${p===pos?'#00d4ff':'#666'};
                font-size:0.7rem;cursor:pointer;">${label}</button>`;

    const shBtn = (shape, label) =>
        `<button onclick="edSetCamSlide(${idx},'shape','${shape}')"
            style="flex:1;padding:5px 3px;border:1px solid ${sh===shape?'#00d4ff':'#2a2a40'};border-radius:5px;
                background:${sh===shape?'#00d4ff15':'#0d0d1a'};color:${sh===shape?'#00d4ff':'#666'};
                font-size:0.7rem;cursor:pointer;">${label}</button>`;

    return `
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;margin-bottom:5px;">
            ${posBtn('tl','↖')}${posBtn('center','⊙ Centro')}${posBtn('tr','↗')}
            ${posBtn('bl','↙')}${posBtn('full','⛶ Pantalla')}${posBtn('br','↘')}
        </div>
        <div style="display:flex;gap:4px;margin-bottom:5px;">
            ${shBtn('rect','▭ Rect')}${shBtn('circle','◉ Círculo')}
            <button onclick="edSetCamSlide(${idx},'mirror',${!mi})"
                style="flex:1;padding:5px 3px;border:1px solid ${mi?'#00d4ff':'#2a2a40'};border-radius:5px;
                    background:${mi?'#00d4ff15':'#0d0d1a'};color:${mi?'#00d4ff':'#666'};
                    font-size:0.7rem;cursor:pointer;">⇔ Espejo</button>
        </div>
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:6px;">
            <input type="range" min="10" max="60" value="${sz}"
                style="flex:1;accent-color:#00d4ff;cursor:pointer;"
                oninput="edSetCamSlide(${idx},'size',+this.value)">
            <span id="edCamSizeLabel${idx}" style="font-size:0.75rem;color:#aaa;min-width:32px;">${sz}%</span>
        </div>
        <button onclick="edClearCamSlide(${idx})"

                background:#1a0a0a;color:#e74c3c;font-size:0.72rem;cursor:pointer;">

}

function edSetCamSlide(idx, key, value) {

        edSlides[idx].camConfig = { pos: camPos, shape: camShape, size: camSize, mirror: camMirror };
    } else {
        if (!edSlides[idx].camConfig) edSlides[idx].camConfig = { pos:'br', shape:'rect', size:22, mirror:true };
        edSlides[idx].camConfig[key] = value;
    }
    const sec = document.getElementById('edCamSection');
    if (sec) sec.innerHTML = edCamSectionHTML(idx);

function edClearCamSlide(idx) {
    edSnapshot();
    if (edSlides[idx]) delete edSlides[idx].camConfig;

    if (sec) sec.innerHTML = edCamSectionHTML(idx);
}

function edApplyTemplate(idx) {
    const tpl = SLIDE_TEMPLATES[idx];
    if (!tpl) return;
    edSnapshot();
    // Si no hay slide seleccionado, crear uno nuevo
    if (edSelectedIdx < 0) {
        edSlides.push({ ...tpl.data });
        edSelectedIdx = edSlides.length - 1;
    } else {
        Object.assign(edSlides[edSelectedIdx], tpl.data);
    }
    renderEdSlideList();
    edShowSlideForm(edSelectedIdx);
}

function edSaveCurrentForm() {
    if (edSelectedIdx < 0 || !edSlides[edSelectedIdx]) return;
    const s = edSlides[edSelectedIdx];
    s.title   = document.getElementById('efTitle')?.value   ?? s.title;
    s.content = document.getElementById('efContent')?.value ?? s.content;
    s.notes   = document.getElementById('efNotes')?.value   ?? s.notes;
    s.layout  = document.getElementById('efLayout')?.value  ?? s.layout;
    s.tag     = document.getElementById('efTag')?.value     ?? s.tag;
    s.bg      = document.getElementById('efBg')?.value      || s.bg || '#0d0d1a';
}

function edAddSlide() {
    edSnapshot();
    edSaveCurrentForm();
    // Mostrar selector de plantillas (sin crear slide todavía)
    edSelectedIdx = -1;
    renderEdSlideList();
    edShowSlideForm(-1);
}

function edDelSlide(i) {
    edSnapshot();
    edSlides.splice(i, 1);
    edSelectedIdx = Math.min(edSelectedIdx, edSlides.length - 1);
    renderEdSlideList();
    edShowSlideForm(edSelectedIdx);
}

let cameraStream  = null;
let cameraEnabled = false;
let camPos        = 'br';
let camShape      = 'rect';
let camSize       = 22;   // porcentaje del ancho
let camMirror     = true;

async function toggleCamera() {
    if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream  = null;
        cameraEnabled = false;
        document.getElementById('camDot').classList.remove('active');
        document.getElementById('camLabel').textContent  = 'No activa';
        document.getElementById('camToggle').textContent = 'Activar';
        document.getElementById('camPreview').style.display = 'none';
        document.getElementById('camVideo').srcObject = null;
        sendToViewers({ action:'camera', enabled:false });
    } else {
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:false });
            const camTrack = cameraStream.getVideoTracks()[0];
            const camCaps  = camTrack.getCapabilities?.() || {};
            if (camCaps.focusMode?.includes('manual'))
                await camTrack.applyConstraints({ advanced: [{ focusMode: 'manual' }] });
            cameraEnabled = true;
            document.getElementById('camDot').classList.add('active');
            document.getElementById('camLabel').textContent  = 'Cámara activa ✓';
            document.getElementById('camToggle').textContent = 'Desactivar';
            const vid = document.getElementById('camVideo');
            vid.srcObject = cameraStream;
            document.getElementById('camPreview').style.display = 'block';
            sendCamConfig();
        } catch(err) {
            alert('No se pudo acceder a la cámara: ' + err.message);
        }
    }
}

function sendCamConfig() {
    const msg = { action:'camera', enabled:cameraEnabled, pos:camPos, shape:camShape, size:camSize, mirror:camMirror };
    try { document.getElementById('slideFrame').contentWindow.postMessage(msg, '*'); } catch(e){}
    if (projectorWin && !projectorWin.closed) projectorWin.postMessage(msg, '*');
}

function setCamPos(pos) {

}
function setCamShape(shape) {

    document.querySelectorAll('[data-shape]').forEach(b => b.classList.toggle('active', b.dataset.shape === shape));
    sendCamConfig();

}
function setCamSize(val) {
    camSize = parseInt(val);
    document.getElementById('camSizeLabel').textContent = camSize + '%';
    sendCamConfig();

}
function toggleCamMirror() {

// ── Config de cámara por slide ────────────────────────────────────────────────
function saveCamToSlide() {
    if (!currentPres || !cameraEnabled) return;
    const slide = currentPres.slides[currentIndex];
    if (!slide) return;
    slide.camConfig = { pos:camPos, shape:camShape, size:camSize, mirror:camMirror };

function applyCamFromSlide(idx) {
    const slide = currentPres?.slides[idx];
    const cfg   = slide?.camConfig;

    camSize   = cfg.size   ?? camSize;
    camMirror = cfg.mirror ?? camMirror;

    // Sincronizar controles UI
    document.querySelectorAll('.cam-pos-btn').forEach(b => b.classList.toggle('active', b.dataset.pos === camPos));
    document.querySelectorAll('[data-shape]').forEach(b => b.classList.toggle('active', b.dataset.shape === camShape));

function clearCamFromSlide() {

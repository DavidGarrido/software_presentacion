<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editor de Presentaciones</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-main: #1a1a2e;
            --bg-panel: #16213e;
            --bg-card: #0f3460;
            --accent: #e94560;
            --text: #eaeaea;
            --text-dim: #a0a0a0;
            --border: #2a2a4a;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Panel izquierdo - Editor */
        .editor-panel {
            width: 400px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .editor-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
        }

        .editor-header h1 {
            font-size: 1.4rem;
            color: var(--accent);
        }

        .editor-header .subtitle {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .editor-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .color-picker-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .color-picker-group input[type="color"] {
            width: 50px;
            height: 40px;
            padding: 2px;
            cursor: pointer;
            border-radius: 6px;
        }

        .color-picker-group input[type="text"] {
            flex: 1;
            font-family: monospace;
        }

        /* Layout selector */
        .layout-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .layout-option {
            padding: 10px 8px;
            background: var(--bg-main);
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .layout-option:hover {
            border-color: var(--accent);
        }

        .layout-option.selected {
            border-color: var(--accent);
            background: rgba(233, 69, 96, 0.15);
        }

        .layout-option .icon {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 4px;
        }

        /* Botones de acción */
        .editor-actions {
            padding: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: #d13a54;
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: #1a4a7a;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        /* Panel central - Vista previa */
        .preview-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0a0a14;
        }

        .preview-header {
            padding: 15px 25px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-panel);
        }

        .preview-header h2 {
            font-size: 1.1rem;
        }

        .preview-actions {
            display: flex;
            gap: 10px;
        }

        .preview-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            overflow: hidden;
        }

        .slide-preview {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16/9;
            background: var(--bg-main);
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        .slide-preview .preview-header-content {
            padding: 30px 40px 10px;
            text-align: center;
        }

        .slide-preview .preview-title {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .slide-preview .preview-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-top: 8px;
            background: rgba(255,255,255,0.15);
        }

        .slide-preview .preview-body {
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-preview .preview-content-text {
            font-size: 1.4rem;
            text-align: center;
            line-height: 1.6;
            max-width: 800px;
        }

        .slide-preview .preview-footer {
            padding: 10px 40px 30px;
            text-align: center;
        }

        /* Layouts */
        .slide-preview.layout-destacado .preview-body {
            justify-content: center;
        }

        .slide-preview.layout-destacado .preview-content-text {
            font-size: 1.8rem;
            font-weight: 600;
            background: rgba(255,255,255,0.1);
            padding: 30px 40px;
            border-radius: 16px;
        }

        .slide-preview.layout-minimalista .preview-header-content {
            padding-top: 60px;
        }

        .slide-preview.layout-minimalista .preview-title {
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .slide-preview.layout-minimalista .preview-body {
            padding-top: 40px;
        }

        .slide-preview.layout-minimalista .preview-content-text {
            font-weight: 300;
            font-size: 1.6rem;
        }

        .slide-preview.layout-titulo .preview-header-content {
            padding-top: 80px;
        }

        .slide-preview.layout-titulo .preview-title {
            font-size: 3.5rem;
        }

        .slide-preview.layout-titulo .preview-body {
            display: none;
        }

        .slide-preview.layout-tarjetas .preview-body {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 20px 40px;
        }

        .slide-preview.layout-tarjetas .preview-content-text {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 12px;
            font-size: 1rem;
            text-align: left;
        }

        /* Panel derecho - Miniaturas */
        .thumbnails-panel {
            width: 280px;
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .thumbnails-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .thumbnails-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .thumbnail {
            background: var(--bg-main);
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            overflow: hidden;
            position: relative;
        }

        .thumbnail:hover {
            border-color: var(--text-dim);
        }

        .thumbnail.selected {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.3);
        }

        .thumbnail-preview {
            aspect-ratio: 16/9;
            position: relative;
            display: grid;
            grid-template-rows: auto 1fr auto;
            padding: 10px;
        }

        .thumbnail-title {
            font-size: 0.65rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .thumbnail-content {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.5rem;
            color: var(--text-dim);
            text-align: center;
            overflow: hidden;
        }

        .thumbnail-footer {
            font-size: 0.5rem;
            color: var(--text-dim);
        }

        .thumbnail-number {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 20px;
            height: 20px;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 600;
        }

        .thumbnail-delete {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 20px;
            height: 20px;
            background: rgba(220, 53, 69, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .thumbnail:hover .thumbnail-delete {
            opacity: 1;
        }

        /* Slide vacío */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-dim);
            text-align: center;
            padding: 40px;
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-main);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* JSON modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: var(--bg-panel);
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow: hidden;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            color: var(--accent);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            max-height: 60vh;
        }

        .modal-body textarea {
            width: 100%;
            height: 300px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: monospace;
            padding: 15px;
            resize: none;
        }

        /* Modal IA */
        .btn-ia {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
        }
        .btn-ia:hover {
            background: linear-gradient(135deg, #5a0db8, #1a65e8);
        }
        .btn-ia:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .ia-form-group {
            margin-bottom: 16px;
        }
        .ia-form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .ia-form-group input,
        .ia-form-group select,
        .ia-form-group textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.95rem;
        }
        .ia-form-group input:focus,
        .ia-form-group select,
        .ia-form-group textarea:focus {
            outline: none;
            border-color: #6a11cb;
        }
        .ia-form-group textarea {
            resize: vertical;
            min-height: 90px;
        }
        .ia-status {
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-top: 12px;
            display: none;
        }
        .ia-status.loading {
            display: block;
            background: rgba(106,17,203,0.15);
            color: #a78bfa;
            text-align: center;
        }
        .ia-status.error {
            display: block;
            background: rgba(220,53,69,0.15);
            color: #f87171;
        }
        .ia-status.success {
            display: block;
            background: rgba(34,197,94,0.15);
            color: #4ade80;
        }
        .ia-modal-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(167,139,250,0.3);
            border-top-color: #a78bfa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- Panel Editor -->
<div class="editor-panel">
    <div class="editor-header">
        <h1>Editor de Slides</h1>
        <div class="subtitle">Crea y-edita tus presentaciones</div>
    </div>

    <div class="editor-content">
        <div class="form-group">
            <label>Título</label>
            <input type="text" id="slideTitle" placeholder="Mi Testimonio">
        </div>

        <div class="form-group">
            <label>Contenido (cada línea = un punto)</label>
            <textarea id="slideContent" placeholder="Este es mi testimonio&#10;y lo quiero compartir con la iglesia"></textarea>
        </div>

        <div class="form-group">
            <label>Layout</label>
            <div class="layout-options">
                <div class="layout-option selected" data-layout="destacado">
                    <span class="icon">★</span>
                    Destacado
                </div>
                <div class="layout-option" data-layout="minimalista">
                    <span class="icon">○</span>
                    Minimalista
                </div>
                <div class="layout-option" data-layout="titulo">
                    <span class="icon">T</span>
                    Solo Título
                </div>
                <div class="layout-option" data-layout="tarjetas">
                    <span class="icon">▦</span>
                    Tarjetas
                </div>
                <div class="layout-option" data-layout="centrado">
                    <span class="icon">●</span>
                    Centrado
                </div>
                <div class="layout-option" data-layout="izquierda">
                    <span class="icon">◧</span>
                    Izquierda
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Tag / Etiqueta</label>
            <input type="text" id="slideTag" placeholder="OPCIONAL">
        </div>

        <div class="form-group">
            <label>Fondo (color o gradiente CSS)</label>
            <div class="color-picker-group">
                <input type="color" id="slideColorPicker" value="#0d0d1a">
                <input type="text" id="slideColor" value="#0d0d1a" placeholder="#0d0d1a o linear-gradient(...)">
            </div>
        </div>

        <div class="form-group">
            <label>Guión / Notas (solo para el presentador)</label>
            <textarea id="slideNotes" placeholder="Esto es lo que voy a decir..."></textarea>
        </div>
    </div>

    <div class="editor-actions">
        <button class="btn btn-secondary" id="newSlideBtn">+ Nuevo Slide</button>
        <button class="btn btn-primary" id="saveSlideBtn">Guardar Slide</button>
    </div>
</div>

<!-- Panel Vista Previa -->
<div class="preview-panel">
    <div class="preview-header">
        <h2>Vista Previa</h2>
        <div class="preview-actions">
            <button class="btn btn-secondary" id="exportJsonBtn">Exportar JSON</button>
            <button class="btn btn-secondary" id="importJsonBtn">Importar JSON</button>
            <button class="btn btn-ia" id="iaBtn">&#x2728; Generar con IA</button>
            <button class="btn btn-primary" id="generateHtmlBtn">Generar HTML</button>
        </div>
    </div>

    <div class="preview-content" id="previewContent">
        <div class="empty-state" id="emptyState">
            <div class="icon">📊</div>
            <p>No hay slides todavía.<br>Agrega tu primer slide!</p>
        </div>

        <div class="slide-preview" id="slidePreview" style="display: none;">
            <div class="preview-header-content">
                <div class="preview-title" id="previewTitle">Título</div>
                <span class="preview-tag" id="previewTag" style="display: none;">TAG</span>
            </div>
            <div class="preview-body">
                <div class="preview-content-text" id="previewContentText">
                    Contenido
                </div>
            </div>
            <div class="preview-footer" id="previewFooter">
                <!-- Footer vacío -->
            </div>
        </div>
    </div>
</div>

<!-- Panel Miniaturas -->
<div class="thumbnails-panel">
    <div class="thumbnails-header">
        <span id="slideCount">0</span> slides
    </div>
    <div class="thumbnails-list" id="thumbnailsList">
        <!-- Miniaturas se generan aquí -->
    </div>
</div>

<!-- Modal IA -->
<div class="modal-overlay" id="iaModal">
    <div class="modal" style="max-width:540px;">
        <div class="modal-header">
            <h3>&#x2728; Generar presentaci&#xf3;n con IA</h3>
            <button class="modal-close" id="iaModalClose">&#xd7;</button>
        </div>
        <div class="modal-body" style="max-height:70vh;">
            <div class="ia-form-group">
                <label>Tema / descripci&#xf3;n de la presentaci&#xf3;n</label>
                <textarea id="iaTema" placeholder="Ej: Presentación sobre inteligencia artificial y su impacto en la educación. Estilo profesional, 8 slides."></textarea>
            </div>
            <div class="ia-form-group">
                <label>Nombre de la presentaci&#xf3;n</label>
                <input type="text" id="iaNombre" placeholder="Mi Presentaci&#xf3;n">
            </div>
            <div id="iaStatus" class="ia-status"></div>
        </div>
        <div class="ia-modal-footer">
            <button class="btn btn-secondary" id="iaModalCancel">Cancelar</button>
            <button class="btn btn-ia" id="iaGenerarBtn">&#x2728; Generar slides</button>
        </div>
    </div>
</div>

<!-- Modal JSON -->
<div class="modal-overlay" id="jsonModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="jsonModalTitle">Exportar JSON</h3>
            <button class="modal-close" id="jsonModalClose">×</button>
        </div>
        <div class="modal-body">
            <textarea id="jsonTextarea" placeholder="JSON aquí..."></textarea>
        </div>
    </div>
</div>

<script>
    // Estado
    let slides = [];
    let currentSlideIndex = -1;

    // Elementos del DOM
    const slideTitle = document.getElementById('slideTitle');
    const slideContent = document.getElementById('slideContent');
    const slideTag = document.getElementById('slideTag');
    const slideColor = document.getElementById('slideColor');
    const slideColorPicker = document.getElementById('slideColorPicker');
    const slideNotes = document.getElementById('slideNotes');
    const layoutOptions = document.querySelectorAll('.layout-option');

    const previewTitle = document.getElementById('previewTitle');
    const previewTag = document.getElementById('previewTag');
    const previewContentText = document.getElementById('previewContentText');
    const slidePreview = document.getElementById('slidePreview');
    const emptyState = document.getElementById('emptyState');

    const thumbnailsList = document.getElementById('thumbnailsList');
    const slideCount = document.getElementById('slideCount');

    const jsonModal = document.getElementById('jsonModal');
    const jsonTextarea = document.getElementById('jsonTextarea');
    const jsonModalTitle = document.getElementById('jsonModalTitle');

    // Sincronizar color picker con texto
    slideColorPicker.addEventListener('input', (e) => {
        slideColor.value = e.target.value;
        updatePreview();
    });

    slideColor.addEventListener('input', (e) => {
        slideColorPicker.value = e.target.value;
        updatePreview();
    });

    // Layouts
    layoutOptions.forEach(option => {
        option.addEventListener('click', () => {
            layoutOptions.forEach(o => o.classList.remove('selected'));
            option.classList.add('selected');
            updatePreview();
        });
    });

    // Obtener layout seleccionado
    function getSelectedLayout() {
        const selected = document.querySelector('.layout-option.selected');
        return selected ? selected.dataset.layout : 'destacado';
    }

    // Actualizar vista previa
    function updatePreview() {
        const title = slideTitle.value || 'Título';
        const content = slideContent.value || 'Contenido';
        const tag = slideTag.value;
        const color = slideColor.value || '#0d0d1a';
        const layout = getSelectedLayout();

        // Actualizar preview
        slidePreview.style.display = 'flex';
        emptyState.style.display = 'none';

        slidePreview.style.background = color;
        previewTitle.textContent = title;
        previewContentText.innerHTML = content.split('\n').map(line => `<p>${line}</p>`).join('');

        if (tag) {
            previewTag.textContent = tag;
            previewTag.style.display = 'inline-block';
        } else {
            previewTag.style.display = 'none';
        }

        // Aplicar layout
        slidePreview.className = 'slide-preview layout-' + layout;

        // Ajustes específicos por layout
        if (layout === 'tarjetas') {
            previewContentText.innerHTML = content.split('\n').map(line => `<div>${line}</div>`).join('');
        }
    }

    // Cargar slide en editor
    function loadSlideToEditor(index) {
        currentSlideIndex = index;
        const slide = slides[index];

        slideTitle.value = slide.title || '';
        slideContent.value = slide.content || '';
        slideTag.value = slide.tag || '';
        slideColor.value = slide.background || '#0d0d1a';
        slideColorPicker.value = slide.background || '#0d0d1a';
        slideNotes.value = slide.notes || '';

        // Seleccionar layout
        layoutOptions.forEach(o => {
            o.classList.toggle('selected', o.dataset.layout === (slide.layout || 'destacado'));
        });

        updatePreview();
        updateThumbnails();
    }

    // Guardar slide
    function saveSlide() {
        const newSlide = {
            title: slideTitle.value,
            content: slideContent.value,
            tag: slideTag.value,
            background: slideColor.value,
            notes: slideNotes.value,
            layout: getSelectedLayout()
        };

        if (currentSlideIndex >= 0) {
            slides[currentSlideIndex] = newSlide;
        } else {
            slides.push(newSlide);
            currentSlideIndex = slides.length - 1;
        }

        updateThumbnails();
        loadSlideToEditor(currentSlideIndex);
    }

    // Nuevo slide
    function newSlide() {
        currentSlideIndex = -1;
        slideTitle.value = '';
        slideContent.value = '';
        slideTag.value = '';
        slideColor.value = '#0d0d1a';
        slideColorPicker.value = '#0d0d1a';
        slideNotes.value = '';

        layoutOptions.forEach(o => {
            o.classList.toggle('selected', o.dataset.layout === 'destacado');
        });

        slidePreview.style.display = 'none';
        emptyState.style.display = 'flex';
    }

    // Actualizar miniaturas
    function updateThumbnails() {
        slideCount.textContent = slides.length;
        thumbnailsList.innerHTML = '';

        slides.forEach((slide, index) => {
            const thumb = document.createElement('div');
            thumb.className = 'thumbnail' + (index === currentSlideIndex ? ' selected' : '');
            thumb.innerHTML = `
                <div class="thumbnail-number">${index + 1}</div>
                <div class="thumbnail-delete" data-index="${index}">✕</div>
                <div class="thumbnail-preview" style="background: ${slide.background || '#0d0d1a'}">
                    <div class="thumbnail-title">${slide.title || 'Sin título'}</div>
                    <div class="thumbnail-content">${(slide.content || '').substring(0, 50)}</div>
                    <div class="thumbnail-footer">${slide.layout || 'destacado'}</div>
                </div>
            `;

            thumb.addEventListener('click', (e) => {
                if (!e.target.classList.contains('thumbnail-delete')) {
                    loadSlideToEditor(index);
                }
            });

            thumbnailsList.appendChild(thumb);
        });

        // Manejar删除
        document.querySelectorAll('.thumbnail-delete').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(btn.dataset.index);
                slides.splice(idx, 1);
                if (currentSlideIndex >= slides.length) {
                    currentSlideIndex = slides.length - 1;
                }
                if (slides.length === 0) {
                    newSlide();
                } else {
                    loadSlideToEditor(Math.max(0, currentSlideIndex));
                }
            });
        });
    }

    // Exportar JSON
    function exportJson() {
        jsonModalTitle.textContent = 'Exportar JSON';
        jsonTextarea.value = JSON.stringify(slides, null, 2);
        jsonModal.classList.add('open');
    }

    // Importar JSON
    function importJson() {
        jsonModalTitle.textContent = 'Importar JSON';
        jsonTextarea.value = '';
        jsonModal.classList.add('open');

        // Guardar al cerrar
        jsonTextarea.dataset.mode = 'import';
    }

    // Generar HTML
    function generateHtml() {
        if (slides.length === 0) {
            alert('No hay slides para generar');
            return;
        }

        let slidesJson = JSON.stringify(slides, null, 2);

        const html = `<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Presentación</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; height: 100vh; }
        .slide { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr auto; align-items: center; justify-items: center; padding: 30px 60px; opacity: 0; visibility: hidden; transition: opacity 0.6s; }
        .slide.active { opacity: 1; visibility: visible; }
        .slide-header { text-align: center; z-index: 5; }
        .slide-title { font-size: 3rem; font-weight: 700; }
        .slide-tag { display: inline-block; padding: 4px 16px; border-radius: 20px; font-size: 0.85rem; margin-top: 12px; background: rgba(255,255,255,0.15); }
        .slide-body { text-align: center; max-width: 900px; z-index: 5; }
        .slide-content { font-size: 1.8rem; line-height: 1.6; }
        .slide-content p { margin: 12px 0; }
        .slide-footer { text-align: center; padding-bottom: 20px; z-index: 5; }
        .slide-counter { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 100; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.3); cursor: pointer; transition: all 0.3s; }
        .dot.active { background: white; transform: scale(1.3); }

        /* Layouts */
        .layout-destacado .slide-content { background: rgba(255,255,255,0.1); padding: 30px 40px; border-radius: 16px; }
        .layout-minimalista .slide-title { font-weight: 300; letter-spacing: 3px; text-transform: uppercase; }
        .layout-titulo .slide-body { display: none; }
        .layout-titulo .slide-title { font-size: 4rem; }
        .layout-tarjetas .slide-body { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: 1000px; }
        .layout-tarjetas .slide-content > div { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; }
    </style>
</head>
<body>
<script>
    const slides = ${slidesJson};
    let current = 0;

    document.body.innerHTML = '<div class="slides"></div><div class="slide-counter"></div>';

    slides.forEach((s, i) => {
        const el = document.createElement('div');
        el.className = 'slide layout-' + (s.layout || 'destacado') + (i === 0 ? ' active' : '');
        el.style.background = s.background || '#0d0d1a';
        el.innerHTML = \`
            <div class="slide-header">
                <div class="slide-title">\${s.title || ''}</div>
                \${s.tag ? '<span class="slide-tag">' + s.tag + '</span>' : ''}
            </div>
            <div class="slide-body">
                <div class="slide-content">\${(s.content || '').split('\\n').map(l => '<p>' + l + '</p>').join('')}</div>
            </div>
            <div class="slide-footer"></div>
        \`;
        document.querySelector('.slides').appendChild(el);

        const dot = document.createElement('div');
        dot.className = 'dot' + (i === 0 ? ' active' : '');
        dot.onclick = () => show(i);
        document.querySelector('.slide-counter').appendChild(dot);
    });

    function show(n) {
        document.querySelectorAll('.slide').forEach((s, i) => {
            s.classList.toggle('active', i === n);
        });
        document.querySelectorAll('.dot').forEach((d, i) => {
            d.classList.toggle('active', i === n);
        });
        current = n;
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === ' ') show((current + 1) % slides.length);
        if (e.key === 'ArrowLeft') show((current - 1 + slides.length) % slides.length);
    });

    document.addEventListener('click', e => {
        if (e.clientX > window.innerWidth / 2) show((current + 1) % slides.length);
        else show((current - 1 + slides.length) % slides.length);
    });
<\/script>
</body>
</html>`;

        // Descargar
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'presentacion.html';
        a.click();
        URL.revokeObjectURL(url);
    }

    // Event listeners
    document.getElementById('newSlideBtn').addEventListener('click', newSlide);
    document.getElementById('saveSlideBtn').addEventListener('click', saveSlide);
    document.getElementById('exportJsonBtn').addEventListener('click', exportJson);
    document.getElementById('importJsonBtn').addEventListener('click', importJson);
    document.getElementById('generateHtmlBtn').addEventListener('click', generateHtml);

    document.getElementById('jsonModalClose').addEventListener('click', () => {
        if (jsonTextarea.dataset.mode === 'import') {
            try {
                slides = JSON.parse(jsonTextarea.value);
                currentSlideIndex = slides.length > 0 ? 0 : -1;
                if (slides.length > 0) loadSlideToEditor(0);
                else newSlide();
            } catch (e) {
                alert('JSON inválido');
            }
            delete jsonTextarea.dataset.mode;
        }
        jsonModal.classList.remove('open');
    });

    // Preview en tiempo real
    [slideTitle, slideContent, slideTag].forEach(el => {
        el.addEventListener('input', updatePreview);
    });

    // Inicializar
    newSlide();

    // Cargar datos de ejemplo si existen en localStorage
    const saved = localStorage.getItem('slides_editor');
    if (saved) {
        try {
            slides = JSON.parse(saved);
            if (slides.length > 0) loadSlideToEditor(0);
        } catch (e) {}
    }

    // Auto-guardar
    setInterval(() => {
        localStorage.setItem('slides_editor', JSON.stringify(slides));
    }, 2000);

    // ── IA: Generar presentación ──────────────────────────────

    const iaModal       = document.getElementById('iaModal');
    const iaStatus      = document.getElementById('iaStatus');
    const iaGenerarBtn  = document.getElementById('iaGenerarBtn');

    document.getElementById('iaBtn').addEventListener('click', () => {
        iaStatus.className = 'ia-status';
        iaStatus.textContent = '';
        iaModal.classList.add('open');
    });
    document.getElementById('iaModalClose').addEventListener('click',  () => iaModal.classList.remove('open'));
    document.getElementById('iaModalCancel').addEventListener('click', () => iaModal.classList.remove('open'));

    iaGenerarBtn.addEventListener('click', async () => {
        const tema     = document.getElementById('iaTema').value.trim();
        const nombre   = document.getElementById('iaNombre').value.trim() || 'Mi Presentación';

        if (!tema)   { mostrarEstadoIA('error', 'Describe el tema de la presentación.'); return; }

        iaGenerarBtn.disabled = true;
        mostrarEstadoIA('loading', '<span class="spinner"></span>Generando slides con IA…');

        try {
            const texto = await llamarIA(tema);
            const json  = extraerJSON(texto);

            if (!json || !Array.isArray(json.slides)) {
                mostrarEstadoIA('error', 'La IA no devolvió un formato válido. Intenta de nuevo.');
                return;
            }

            // Descargar el JSON en formato Belén
            const presentacion = {
                name: nombre,
                viewer: 'viewer.html',
                slides: json.slides,
                id: Math.random().toString(36).slice(2) + Date.now().toString(36)
            };
            descargarJSON(presentacion, nombre.replace(/\s+/g, '_') + '.json');

            // Importar slides al editor (mapeando bg → background)
            slides = json.slides.map(s => ({
                title:      s.title      || '',
                content:    s.content    || '',
                tag:        s.tag        || '',
                background: s.bg         || '#0d0d1a',
                notes:      s.notes      || '',
                layout:     mapLayout(s.layout)
            }));
            currentSlideIndex = 0;
            loadSlideToEditor(0);

            mostrarEstadoIA('success', '¡Listo! Se descargó el JSON y se importaron ' + slides.length + ' slides al editor.');
        } catch (e) {
            mostrarEstadoIA('error', 'Error: ' + e.message);
        } finally {
            iaGenerarBtn.disabled = false;
        }
    });

    function mostrarEstadoIA(tipo, html) {
        iaStatus.className = 'ia-status ' + tipo;
        iaStatus.innerHTML = html;
    }

    function mapLayout(l) {
        const map = { cover: 'titulo', highlight: 'destacado', tarjetas: 'tarjetas',
                      minimalista: 'minimalista', centrado: 'centrado', izquierda: 'izquierda' };
        return map[l] || 'destacado';
    }

    function extraerJSON(texto) {
        console.log('Raw AI Response length:', texto.length);
        let raw = texto;

        // 1. Quitar bloque markdown (con o sin cierre)
        raw = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```\s*$/i, '');

        // 2. Buscar desde el primer '{' hasta el último '}'
        const firstBrace = raw.indexOf('{');
        const lastBrace = raw.lastIndexOf('}');
        if (firstBrace !== -1 && lastBrace !== -1) {
            raw = raw.substring(firstBrace, lastBrace + 1);
        }

        // 3. Sanitizar: escapar saltos de línea literales dentro de strings
        raw = raw.replace(/(["'])(?:(?=(\\?))\2.)*?\1/g, function(m) {
            return m.replace(/\n/g, '\\n').replace(/\r/g, '\\r').replace(/\t/g, '\\t');
        });

        // 4. Compactar: unir líneas rotas, limpiar comas en objetos/arrays
        raw = raw
            .replace(/\n\s+/g, ' ')
            .replace(/,\s*}/g, '}')
            .replace(/,\s*]/g, ']');

        // 5. Auto-cerrar llaves y corchetes faltantes (respuesta truncada)
        const opens = (raw.match(/\{/g) || []).length;
        const closes = (raw.match(/\}/g) || []).length;
        const arrOpens = (raw.match(/\[/g) || []).length;
        const arrCloses = (raw.match(/\]/g) || []).length;
        raw += ']'.repeat(Math.max(0, arrOpens - arrCloses));
        raw += '}'.repeat(Math.max(0, opens - closes));

        // 6. Intentar parsear
        try {
            return JSON.parse(raw);
        } catch (e) {
            console.warn('JSON parse failed:', e.message);
            return null;
        }
    }

    function descargarJSON(obj, nombre) {
        const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url; a.download = nombre; a.click();
        URL.revokeObjectURL(url);
    }

    const SYSTEM_PROMPT = `Eres un diseñador didáctico experto en crear presentaciones educativas. Responde ÚNICAMENTE con un objeto JSON válido.

Estructura EXACTA:
{
  "slides": [{
    "layout": "",
    "bg": "linear-gradient(135deg, #1a1a2e, #16213e)",
    "tag": "CATEGORÍA",
    "title": "Título",
    "content": "Línea 1\\nLínea 2\\nLínea 3",
    "notes": "Guión en primera persona."
  }]
}

LAYOUTS PERMITIDOS (usa exactamente estos nombres):
- "cover"     → portada/cierre
- ""          → bullets/diagramas (3 líneas, usa emojis como viñetas)
- "highlight" → frase o dato impactante
- "image"     → URL real de Unsplash

REGLAS DE PRESENTACIÓN VISUAL PROFESIONAL:

1. ESTRUCTURA (10-12 slides):
   Cover → Gancho/pregunta → Concepto → Imagen conceptual → Ejemplo concreto → Dato clave (highlight) → Aplicación 1 (bullets con emojis) → Aplicación 2 → Reflexión → Cierre

2. IMÁGENES: AL MENOS 2 slides con layout "image". Usa URLs reales de Unsplash: https://images.unsplash.com/photo-XXXXXXXXX?w=1920

3. DIAGRAMAS (layout ""): cada línea = [EMOJI] + concepto. Ej: "🚀 Gases expanden → despegue"

4. HIGHLIGHT: una frase poderosa. Usa ||marcadores||.

5. CADA SLIDE DEBE TENER "title" (nunca vacío).

6. GUIÓN: explica para estudiante. Preguntas retóricas. Mínimo 4 oraciones.

7. Alterna layouts. NO repetir mismo layout más de 2 veces seguidas.`;

    const AI_WORKER_URL = 'https://procliup-quoter.www-davidalexander.workers.dev/bible';

    async function llamarIA(tema) {
        const res = await fetch(AI_WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                messages: [
                    { role: 'system', content: SYSTEM_PROMPT },
                    { role: 'user',   content: tema }
                ]
            })
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'Error del servidor IA');
        return data.reply;
    }
</script>

</body>

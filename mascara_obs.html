<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Máscara OBS</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',Arial,sans-serif; background:#1a1a2e; color:white; display:flex; height:100vh; overflow:hidden; }

        /* ── Modo preview: solo canvas a pantalla completa ── */
        body.preview { background:black; }
        body.preview .panel { display:none; }
        body.preview .canvas-area { padding:0; background:black; }
        body.preview canvas { width:100vw !important; height:100vh !important; max-width:none; max-height:none; border:none; border-radius:0; }

        .panel { width:320px; flex-shrink:0; background:#111; padding:16px; display:flex; flex-direction:column; gap:12px; overflow-y:auto; border-right:1px solid #222; }
        .canvas-area { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; gap:12px; background:#0d0d1a; }

        h2 { color:#00d4ff; font-size:1rem; }
        h3 { color:#ffd700; font-size:0.85rem; margin-bottom:4px; }

        .group { background:#1a1a2e; border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:8px; }
        label { font-size:0.8rem; color:#aaa; }
        input[type=range] { width:100%; accent-color:#00d4ff; }
        input[type=number] { width:100%; padding:5px 8px; background:#222; border:1px solid #444; border-radius:4px; color:white; font-size:0.85rem; }
        select { width:100%; padding:6px 8px; background:#222; border:1px solid #444; border-radius:4px; color:white; font-size:0.85rem; }
        .row { display:flex; gap:8px; align-items:center; }
        .row label { white-space:nowrap; min-width:60px; }
        .val { color:#00d4ff; font-size:0.8rem; min-width:36px; text-align:right; }

        .btn { padding:10px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; font-size:0.9rem; width:100%; }
        .btn-primary { background:#00d4ff; color:#1a1a2e; }
        .btn-primary:hover { background:#00b8d9; }
        .btn-success { background:#2ecc71; color:#1a1a2e; }
        .btn-success:hover { background:#27ae60; }
        .btn-preview { background:#9b59b6; color:white; }
        .btn-preview:hover { background:#8e44ad; }

        /* Botones de relación de aspecto */
        .ratio-btns { display:flex; gap:6px; }
        .ratio-btn { flex:1; padding:7px; border:2px solid #333; border-radius:6px; background:transparent; color:#aaa; cursor:pointer; font-size:0.8rem; font-weight:bold; transition:all 0.15s; }
        .ratio-btn.active { border-color:#00d4ff; color:#00d4ff; background:rgba(0,212,255,0.1); }

        canvas { border:2px solid #333; border-radius:4px; max-width:100%; max-height:65vh; object-fit:contain; }
        .canvas-info { color:#555; font-size:0.75rem; }

        .preview-url { background:#1a1a2e; border-radius:6px; padding:8px 10px; font-size:0.75rem; color:#00d4ff; word-break:break-all; border:1px solid #333; cursor:pointer; }
        .preview-url:hover { border-color:#00d4ff; }
    </style>
</head>
<body>

<div class="panel">
    <h2>🎭 Generador de Máscara OBS</h2>
    <p style="color:#666;font-size:0.75rem;">Blanco = visible · Negro = oculto</p>

    <!-- Resolución -->
    <div class="group">
        <h3>Resolución</h3>
        <div class="ratio-btns">
            <button class="ratio-btn" id="ratioFree" onclick="setRatio('free')">Libre</button>
            <button class="ratio-btn active" id="ratio169" onclick="setRatio('16:9')">16:9</button>
            <button class="ratio-btn" id="ratio11" onclick="setRatio('1:1')">1:1</button>
        </div>
        <div class="row">
            <label>Ancho</label>
            <input type="number" id="canvW" value="1920" min="1" max="7680" oninput="onResChange('w')">
        </div>
        <div class="row">
            <label>Alto</label>
            <input type="number" id="canvH" value="1080" min="1" max="4320" oninput="onResChange('h')">
        </div>
        <select id="presetRes" onchange="aplicarPreset()">
            <option value="">— Preset —</option>
            <option value="1920,1080">1920×1080 · 16:9</option>
            <option value="1280,720">1280×720 · 16:9</option>
            <option value="1080,1080">1080×1080 · 1:1</option>
            <option value="720,720">720×720 · 1:1</option>
            <option value="3840,2160">3840×2160 · 4K</option>
        </select>
    </div>

    <!-- Forma -->
    <div class="group">
        <h3>Forma</h3>
        <select id="forma" onchange="dibujar()">
            <option value="rectangulo">Rectángulo</option>
            <option value="elipse">Elipse / Círculo</option>
            <option value="rectangulo_redondeado">Rectángulo redondeado</option>
        </select>
    </div>

    <!-- Posición y tamaño -->
    <div class="group">
        <h3>Posición y tamaño</h3>
        <div class="row"><label>X</label>
            <input type="range" id="px" min="0" max="100" value="50" oninput="dibujar()">
            <span class="val" id="pxv">50%</span>
        </div>
        <div class="row"><label>Y</label>
            <input type="range" id="py" min="0" max="100" value="50" oninput="dibujar()">
            <span class="val" id="pyv">50%</span>
        </div>
        <div class="row"><label>Ancho</label>
            <input type="range" id="pw" min="1" max="100" value="80" oninput="dibujar()">
            <span class="val" id="pwv">80%</span>
        </div>
        <div class="row"><label>Alto</label>
            <input type="range" id="ph" min="1" max="100" value="80" oninput="dibujar()">
            <span class="val" id="phv">80%</span>
        </div>
        <div class="row" id="radioRow"><label>Radio</label>
            <input type="range" id="radio" min="0" max="50" value="10" oninput="dibujar()">
            <span class="val" id="radiov">10%</span>
        </div>
    </div>

    <!-- Borde difuminado -->
    <div class="group">
        <h3>Borde difuminado (feather)</h3>
        <div class="row"><label>Blur</label>
            <input type="range" id="blur" min="0" max="100" value="0" oninput="dibujar()">
            <span class="val" id="blurv">0px</span>
        </div>
    </div>

    <!-- Borde -->
    <div class="group">
        <h3>Borde</h3>
        <div class="row"><label>Grosor</label>
            <input type="range" id="borderW" min="0" max="200" value="0" oninput="dibujar()">
            <span class="val" id="borderWv">0px</span>
        </div>
        <div class="row"><label>Color</label>
            <select id="borderColor" onchange="dibujar()" style="flex:1;">
                <option value="white">Blanco</option>
                <option value="black">Negro</option>
                <option value="#808080">Gris 50%</option>
                <option value="#404040">Gris oscuro</option>
                <option value="#c0c0c0">Gris claro</option>
            </select>
        </div>
        <div class="row"><label>Blur borde</label>
            <input type="range" id="borderBlur" min="0" max="80" value="0" oninput="dibujar()">
            <span class="val" id="borderBlurv">0px</span>
        </div>
        <div class="row" style="gap:10px;">
            <input type="checkbox" id="borderOnly" onchange="dibujar()" style="width:16px;height:16px;accent-color:#00d4ff;">
            <label for="borderOnly" style="color:#ddd;">Solo borde (sin relleno)</label>
        </div>
    </div>

    <!-- Invertir -->
    <div class="group" style="flex-direction:row;align-items:center;gap:10px;">
        <input type="checkbox" id="invertir" onchange="dibujar()" style="width:18px;height:18px;accent-color:#00d4ff;">
        <label for="invertir" style="color:#ddd;font-size:0.9rem;">Invertir máscara</label>
    </div>

    <!-- URL de preview para OBS -->
    <div class="group">
        <h3>URL para OBS (Fuente de Navegador)</h3>
        <div class="preview-url" id="previewUrl" onclick="copiarUrl()" title="Clic para copiar"></div>
        <p style="color:#555;font-size:0.7rem;">Usa esta URL en OBS → Fuente de Navegador</p>
    </div>

    <button class="btn btn-preview" onclick="abrirPreview()">🖥 Abrir preview</button>
    <button class="btn btn-primary" onclick="dibujar()">↻ Actualizar</button>
    <button class="btn btn-success" onclick="descargar()">⬇ Descargar PNG</button>
</div>

<div class="canvas-area">
    <canvas id="canvas"></canvas>
    <p class="canvas-info" id="canvasInfo">1920 × 1080</p>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');
    let currentRatio = '16:9';

    // ── Modo preview (sin panel) ─────────────────────────────────────────────
    const isPreview = new URLSearchParams(location.search).has('preview');
    if (isPreview) {
        document.body.classList.add('preview');
        // Leer params de la URL y aplicar
        const p = new URLSearchParams(location.search);
        ['canvW','canvH','px','py','pw','ph','radio','blur','forma','invertir','borderW','borderColor','borderBlur','borderOnly'].forEach(k => {
            const el = document.getElementById(k);
            if (!el || !p.has(k)) return;
            if (el.type === 'checkbox') el.checked = p.get(k) === '1';
            else el.value = p.get(k);
        });
    }

    function v(id) { return document.getElementById(id); }

    function pct(id) {
        const val = parseFloat(v(id).value);
        if (!isPreview) v(id + 'v').textContent = id === 'blur' ? val + 'px' : val + '%';
        return val / 100;
    }

    function setRatio(r) {
        currentRatio = r;
        ['ratioFree','ratio169','ratio11'].forEach(id => v(id).classList.remove('active'));
        const map = { 'free':'ratioFree', '16:9':'ratio169', '1:1':'ratio11' };
        v(map[r]).classList.add('active');
        onResChange('w');
    }

    function onResChange(changed) {
        const W = parseInt(v('canvW').value) || 1920;
        const H = parseInt(v('canvH').value) || 1080;
        if (currentRatio === '16:9') {
            if (changed === 'w') v('canvH').value = Math.round(W * 9/16);
            else                 v('canvW').value = Math.round(H * 16/9);
        } else if (currentRatio === '1:1') {
            if (changed === 'w') v('canvH').value = W;
            else                 v('canvW').value = H;
        }
        dibujar();
    }

    function aplicarPreset() {
        const sel = v('presetRes').value;
        if (!sel) return;
        const [w, h] = sel.split(',');
        v('canvW').value = w;
        v('canvH').value = h;
        // Detectar ratio del preset
        if (w === h) setRatio('1:1');
        else if (Math.abs(parseInt(w)/parseInt(h) - 16/9) < 0.01) setRatio('16:9');
        else setRatio('free');
        dibujar();
    }

    function buildParams() {
        return new URLSearchParams({
            preview: '',
            canvW:   v('canvW').value,
            canvH:   v('canvH').value,
            px:      v('px').value,
            py:      v('py').value,
            pw:      v('pw').value,
            ph:      v('ph').value,
            radio:   v('radio').value,
            blur:    v('blur').value,
            forma:   v('forma').value,
            invertir:    v('invertir').checked    ? '1' : '0',
            borderW:     v('borderW').value,
            borderColor: v('borderColor').value,
            borderBlur:  v('borderBlur').value,
            borderOnly:  v('borderOnly').checked  ? '1' : '0',
        }).toString();
    }

    function actualizarUrl() {
        const url = `${location.origin}/mascara_obs.html?${buildParams()}`;
        const el = v('previewUrl');
        if (el) { el.textContent = url; el.dataset.url = url; }
    }

    function copiarUrl() {
        const url = v('previewUrl').dataset.url;
        if (url) navigator.clipboard.writeText(url).then(() => {
            v('previewUrl').textContent = '✅ ¡Copiado!';
            setTimeout(actualizarUrl, 1500);
        });
    }

    function abrirPreview() {
        window.open(`mascara_obs.html?${buildParams()}`, '_blank');
    }

    function dibujar() {
        const W = parseInt(v('canvW').value) || 1920;
        const H = parseInt(v('canvH').value) || 1080;
        canvas.width  = W;
        canvas.height = H;
        if (!isPreview) {
            v('canvasInfo').textContent = W + ' × ' + H;
            actualizarUrl();
        }

        const forma       = v('forma').value;
        const invertir    = v('invertir').checked;
        const blurPx      = parseFloat(v('blur').value);
        const borderW     = parseFloat(v('borderW').value);
        const borderColor = v('borderColor').value;
        const borderBlur  = parseFloat(v('borderBlur').value);
        const borderOnly  = v('borderOnly').checked;

        if (!isPreview) {
            v('borderWv').textContent    = borderW + 'px';
            v('borderBlurv').textContent = borderBlur + 'px';
        }

        const cx    = pct('px') * W;
        const cy    = pct('py') * H;
        const rw    = pct('pw') * W / 2;
        const rh    = pct('ph') * H / 2;
        const radio = pct('radio') * Math.min(rw, rh);

        if (!isPreview) v('radioRow').style.display = forma === 'rectangulo_redondeado' ? 'flex' : 'none';

        function trazarForma() {
            ctx.beginPath();
            if (forma === 'elipse') {
                ctx.ellipse(cx, cy, rw, rh, 0, 0, Math.PI * 2);
            } else if (forma === 'rectangulo_redondeado') {
                ctx.roundRect(cx - rw, cy - rh, rw * 2, rh * 2, radio);
            } else {
                ctx.rect(cx - rw, cy - rh, rw * 2, rh * 2);
            }
        }

        ctx.clearRect(0, 0, W, H);

        // Fondo
        ctx.fillStyle = invertir ? 'white' : 'black';
        ctx.fillRect(0, 0, W, H);

        // Relleno de la forma
        if (!borderOnly) {
            ctx.filter = blurPx > 0 ? `blur(${blurPx}px)` : 'none';
            ctx.fillStyle = invertir ? 'black' : 'white';
            trazarForma();
            ctx.fill();
            ctx.filter = 'none';
        }

        // Borde
        if (borderW > 0) {
            ctx.filter = borderBlur > 0 ? `blur(${borderBlur}px)` : 'none';
            ctx.strokeStyle = borderColor;
            ctx.lineWidth   = borderW;
            trazarForma();
            ctx.stroke();
            ctx.filter = 'none';
        }
    }

    function descargar() {
        const a = document.createElement('a');
        a.download = 'mascara_obs.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
    }

    dibujar();
</script>
</body>
</html>

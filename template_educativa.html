<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Template Educativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; font-family:'Nunito','Segoe UI',sans-serif; }
:root { --c1:#ff6b6b; --c2:#ffd93d; --c3:#6bcb77; --c4:#4d96ff; --c5:#c77dff; --dark:#1e1e2e; }

/* Fondo pizarra suave */
body { background:#2d3561; }

/* Patrón de fondo */
#bg {
    position:fixed; inset:0; z-index:0;
    background:#1e1e2e;
    background-image:
        radial-gradient(circle at 20% 20%, rgba(77,150,255,.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(107,203,119,.06) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(199,125,255,.05) 0%, transparent 60%);
}

/* Burbujas decorativas de fondo */
#bubbles { position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
.bubble {
    position:absolute; border-radius:50%; opacity:.04;
    animation:bobble ease-in-out infinite;
}
@keyframes bobble {
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-20px) scale(1.05);}
}

#stage { position:fixed; inset:0; z-index:2; }

.slide {
    position:absolute; inset:0; padding:5% 7%;
    display:flex; flex-direction:column; justify-content:center;
    opacity:0; transform:scale(.97);
    transition:opacity .45s ease, transform .45s ease;
    pointer-events:none;
}
.slide.active { opacity:1; transform:scale(1); pointer-events:auto; }
.slide.exit   { opacity:0; transform:scale(1.02); }

/* Tarjeta principal */
.card {
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:24px;
    padding:clamp(1.5rem,4vw,3rem) clamp(2rem,5vw,4rem);
    display:flex; flex-direction:column; gap:1em;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
    position:relative; overflow:hidden;
}
.card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:4px;
    background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5));
}

/* Cover: fondo de color + tarjeta centrada */
.cover-wrap {
    display:flex; align-items:center; justify-content:center;
    height:100%;
}
.cover-wrap .card { max-width:800px; width:100%; text-align:center; align-items:center; }

.tag {
    display:inline-flex; align-items:center; gap:6px;
    font-size:clamp(.5rem,.85vw,.68rem); font-weight:800;
    letter-spacing:.14em; text-transform:uppercase;
    color:#fff; background:rgba(255,255,255,.12);
    border-radius:999px; padding:.3em 1em;
    align-self:flex-start;
}
.cover-wrap .tag { align-self:center; }

h1 {
    font-size:clamp(1.7rem,4.8vw,3.6rem);
    font-weight:900; color:#fff; line-height:1.1;
}
.acc { color:var(--c2); }

.subtitle {
    font-size:clamp(.85rem,1.7vw,1.2rem);
    color:rgba(255,255,255,.6); font-weight:400; line-height:1.6;
}

/* Bullets tipo tarjeta */
.bullets { list-style:none; display:flex; flex-direction:column; gap:.55em; }
.bullets li {
    display:flex; align-items:center; gap:.9em;
    font-size:clamp(.8rem,1.6vw,1.08rem); font-weight:600;
    color:rgba(255,255,255,.9); line-height:1.5;
    padding:.65em 1em;
    background:rgba(255,255,255,.07);
    border-radius:12px;
    border:1px solid rgba(255,255,255,.08);
}
.bullet-icon {
    width:28px; height:28px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:.9rem; flex-shrink:0; font-weight:900;
}

/* Highlight */
.hl-box {
    background:rgba(255,255,255,.1);
    border-radius:16px; border:2px solid rgba(255,255,255,.15);
    padding:1.2em 1.8em; text-align:center;
    font-size:clamp(1rem,2.8vw,2rem); font-weight:800; color:#fff; line-height:1.3;
}

/* Image */
.img-wrap { width:100%; max-height:52vh; border-radius:14px; overflow:hidden; border:2px solid rgba(255,255,255,.1); box-shadow:0 10px 40px rgba(0,0,0,.3); }
.img-wrap img { width:100%; height:100%; object-fit:cover; display:block; }

/* Cover emoji decorativo */
.cover-emoji { font-size:clamp(2.5rem,6vw,5rem); margin-bottom:.2em; animation:bounce .8s ease-in-out infinite alternate; }
@keyframes bounce { from{transform:translateY(0);} to{transform:translateY(-8px);} }

/* Dots nav */
.dots { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:100; display:flex; gap:7px; align-items:center; }
.dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.25); cursor:pointer; transition:all .3s; border:none; outline:none; }
.dot.active { background:#fff; transform:scale(1.4); }

/* Colores por índice para bullet icons */
.bi0{background:rgba(255,107,107,.25);color:var(--c1);}
.bi1{background:rgba(255,217,61,.25);color:var(--c2);}
.bi2{background:rgba(107,203,119,.25);color:var(--c3);}
.bi3{background:rgba(77,150,255,.25);color:var(--c4);}
.bi4{background:rgba(199,125,255,.25);color:var(--c5);}
</style>
</head>
<body>
<div id="bg"></div>
<div id="bubbles"></div>
<div id="stage"></div>
<div class="dots" id="dots"></div>
<div id="camWrap" style="display:none;position:fixed;z-index:50;cursor:move;user-select:none;overflow:hidden;">
    <video id="camFeed" autoplay muted playsinline style="display:block;width:100%;height:100%;object-fit:cover;"></video>
</div>
<script>
let slides=[], cur=0, busy=false;
const COLORS=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
const ICONS=['●','◆','▲','★','✦'];
let decorEmojis=['📚','✏️','🎓','💡','🌟'];

function setAccent(c){ if(!c)return; document.documentElement.style.setProperty('--c4',c); }
function mark(t){ return(t||'').replace(/\|\|(.+?)\|\|/g,'<span class="acc">$1</span>'); }

function spawnBubbles(){
    const cont=document.getElementById('bubbles');
    const colors=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff'];
    for(let i=0;i<8;i++){
        const b=document.createElement('div');
        b.className='bubble';
        const size=80+Math.random()*200;
        b.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:${colors[i%colors.length]};animation-duration:${4+Math.random()*4}s;animation-delay:${Math.random()*4}s;`;
        cont.appendChild(b);
    }
}
spawnBubbles();

function buildSlide(s,idx){
    const lines=(s.content||'').split('\n').map(l=>l.trim()).filter(Boolean);
    const isFirst=idx===0,isLast=idx===slides.length-1;
    const isCover=s.layout==='cover'||(isFirst&&!s.layout)||(isLast&&!s.layout);
    const d=document.createElement('div');
    d.className='slide'; d.dataset.index=idx;
    const emoji=decorEmojis[idx%decorEmojis.length]||'📚';

    if(isCover){
        d.innerHTML=`<div class="cover-wrap"><div class="card">
            <div class="cover-emoji">${emoji}</div>
            <div class="tag">${s.tag||'Presentación'}</div>
            <h1>${mark(s.title||'')}</h1>
            ${lines[0]?`<p class="subtitle">${mark(lines.join(' · '))}</p>`:''}
        </div></div>`;
    } else if(s.layout==='highlight'){
        d.innerHTML=`<div class="card">
            <div class="tag">${s.tag||''}</div>
            <h1>${mark(s.title||'')}</h1>
            <div class="hl-box">${emoji} ${mark(lines.join('<br>'))}</div>
        </div>`;
    } else if(s.layout==='image'){
        d.innerHTML=`<div class="card">
            <div class="tag">${s.tag||''}</div>
            <h1>${mark(s.title||'')}</h1>
            <div class="img-wrap"><img src="${lines[0]||''}" alt="${s.title||''}"></div>
        </div>`;
    } else {
        const buls=lines.map((l,i)=>`<li><span class="bullet-icon bi${i%5}">${ICONS[i%5]}</span>${mark(l)}</li>`).join('');
        d.innerHTML=`<div class="card">
            <div class="tag">${s.tag||''}</div>
            <h1>${mark(s.title||'')}</h1>
            <ul class="bullets">${buls}</ul>
        </div>`;
    }
    return d;
}

function buildDots(){
    const cont=document.getElementById('dots');
    cont.innerHTML='';
    slides.forEach((_,i)=>{
        const d=document.createElement('button');
        d.className='dot'+(i===0?' active':'');
        d.onclick=()=>show(i);
        cont.appendChild(d);
    });
}

function load(data,startIdx=0){
    slides=data.slides||[];
    decorEmojis=data.decorEmojis||['📚','✏️','🎓','💡','🌟'];
    if(data.accentColor)setAccent(data.accentColor);
    const stage=document.getElementById('stage');
    stage.innerHTML='';
    slides.forEach((s,i)=>stage.appendChild(buildSlide(s,i)));
    buildDots();
    show(startIdx,false);
}

function show(idx,animate=true){
    if(!slides.length||busy)return;
    idx=Math.max(0,Math.min(idx,slides.length-1));
    const prev=document.querySelector('.slide.active');
    const next=document.querySelectorAll('.slide')[idx];
    if(!next||prev===next)return;
    if(animate&&prev){busy=true;prev.classList.add('exit');setTimeout(()=>{prev.classList.remove('active','exit');busy=false;},450);}
    else if(prev){prev.classList.remove('active','exit');}
    next.classList.add('active');
    cur=idx;
    document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
    try{window.parent.postMessage({action:'slideChanged',index:idx},'*');}catch(e){}
}

let camStream=null,camDrag=false,ox=0,oy=0;
const camWrap=document.getElementById('camWrap'),camFeed=document.getElementById('camFeed');
function camSz(size,shape){const w=Math.round(window.innerWidth*(parseInt(size)/100));return{w,h:shape==='circle'?w:Math.round(w*9/16)};}
function camPos(pos,w,h){const pad=Math.round(window.innerWidth*.018),vw=window.innerWidth,vh=window.innerHeight;if(pos==='tl')return{x:pad,y:pad};if(pos==='tr')return{x:vw-w-pad,y:pad};if(pos==='bl')return{x:pad,y:vh-h-pad};if(pos==='center')return{x:(vw-w)/2,y:(vh-h)/2};if(pos==='full')return{x:0,y:0};return{x:vw-w-pad,y:vh-h-pad};}
function applyCam(cfg){const isFull=cfg.pos==='full';const{w,h}=isFull?{w:window.innerWidth,h:window.innerHeight}:camSz(cfg.size,cfg.shape);const{x,y}=camPos(cfg.pos,w,h);const r=isFull?'0':cfg.shape==='circle'?'50%':Math.round(w*.06)+'px';camWrap.style.cssText=`position:fixed;z-index:50;cursor:move;user-select:none;width:${w}px;height:${h}px;left:${x}px;top:${y}px;border-radius:${r};overflow:hidden;border:${isFull?'none':'2px solid rgba(255,255,255,.4)'};box-shadow:${isFull?'none':'0 4px 24px rgba(0,0,0,.4)'};`;camFeed.style.cssText=`width:${w}px;height:${h}px;object-fit:cover;display:block;transform:scaleX(${cfg.mirror?-1:1});`;}
async function startCam(cfg){if(!camStream){try{camStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});camFeed.srcObject=camStream;}catch(e){return;}}applyCam(cfg);camWrap.style.display='block';if(window.parent!==window.top)camWrap.style.display='none';}
function stopCam(){camWrap.style.display='none';if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}camFeed.srcObject=null;}
camWrap.addEventListener('pointerdown',e=>{camDrag=true;ox=e.clientX-camWrap.offsetLeft;oy=e.clientY-camWrap.offsetTop;camWrap.setPointerCapture(e.pointerId);});
camWrap.addEventListener('pointermove',e=>{if(camDrag){camWrap.style.left=(e.clientX-ox)+'px';camWrap.style.top=(e.clientY-oy)+'px';}});
camWrap.addEventListener('pointerup',()=>camDrag=false);

window.addEventListener('message',e=>{
    const d=e.data;if(!d)return;
    if(d.action==='load'&&d.slides)load(d,d.index??0);
    if(d.action==='goto')show(d.index);
    if(d.action==='next')show(cur+1);
    if(d.action==='prev')show(cur-1);
    if(d.action==='camera'){if(d.enabled)startCam(d);else stopCam();}
});
document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ')show(cur+1);
    if(e.key==='ArrowLeft'||e.key==='ArrowUp')show(cur-1);
});
</script>
</body>
</html>

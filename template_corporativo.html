<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Template Corporativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#06060f; font-family:'Inter','Segoe UI',sans-serif; }

:root { --accent:#00d4ff; --accent20:rgba(0,212,255,0.2); --accent40:rgba(0,212,255,0.4); }

#stage { width:100%; height:100%; position:relative; overflow:hidden; }

/* ── Slides ── */
.slide {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    justify-content:center; align-items:flex-start;
    padding:7% 10%;
    opacity:0; transform:translateX(50px);
    transition:opacity .5s cubic-bezier(.4,0,.2,1), transform .5s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
}
.slide.active   { opacity:1; transform:translateX(0); pointer-events:auto; }
.slide.exit     { opacity:0; transform:translateX(-50px); }

/* ── Fondo ── */
.slide-bg { position:absolute; inset:0; z-index:0; }

/* ── Decoraciones geométricas ── */
.geo { position:absolute; pointer-events:none; z-index:1; }
.geo-corner-tl {
    top:0; left:0;
    width:clamp(80px,14vw,180px); height:clamp(80px,14vw,180px);
    border-left:2px solid var(--accent20);
    border-top:2px solid var(--accent20);
}
.geo-corner-br {
    bottom:0; right:0;
    width:clamp(80px,14vw,180px); height:clamp(80px,14vw,180px);
    border-right:2px solid var(--accent20);
    border-bottom:2px solid var(--accent20);
}
.geo-vline {
    top:10%; left:7%;
    width:2px; height:80%;
    background:linear-gradient(to bottom, transparent, var(--accent40), transparent);
}
.geo-dot {
    top:50%; left:7%;
    width:8px; height:8px;
    border-radius:50%;
    background:var(--accent);
    transform:translateY(-50%) translateX(-3px);
    box-shadow:0 0 12px var(--accent);
}

/* ── Contenido ── */
.content { position:relative; z-index:5; width:100%; max-width:880px; display:flex; flex-direction:column; gap:1.1em; }

.tag {
    font-size:clamp(.5rem,.85vw,.68rem);
    font-weight:600; letter-spacing:.25em; text-transform:uppercase;
    color:var(--accent);
    display:flex; align-items:center; gap:10px;
}
.tag::before { content:''; display:block; width:28px; height:2px; background:var(--accent); flex-shrink:0; }

h1 {
    font-size:clamp(1.8rem,5.5vw,4rem);
    font-weight:900; color:#fff;
    line-height:1.08; letter-spacing:-.03em;
}
.acc { color:var(--accent); }

.subtitle {
    font-size:clamp(.85rem,1.8vw,1.3rem);
    color:rgba(255,255,255,.5); font-weight:300; line-height:1.55;
}

/* Bullets */
.bullets { list-style:none; display:flex; flex-direction:column; gap:.6em; }
.bullets li {
    display:flex; align-items:center; gap:1em;
    font-size:clamp(.8rem,1.7vw,1.15rem); color:rgba(255,255,255,.88); line-height:1.5;
    padding:.7em 1.1em;
    background:rgba(255,255,255,.04);
    border-left:3px solid var(--accent40);
    border-radius:0 8px 8px 0;
    backdrop-filter:blur(4px);
    transition:background .2s;
}

/* Highlight */
.hl-box {
    background:rgba(255,255,255,.04);
    border:1px solid var(--accent40);
    border-radius:14px;
    padding:1.4em 2em;
    font-size:clamp(1.1rem,3vw,2.2rem);
    font-weight:700; color:#fff; line-height:1.3; text-align:center;
    backdrop-filter:blur(10px);
    align-self:stretch;
}

/* Imagen */
.img-wrap {
    width:100%; max-height:60vh;
    border-radius:10px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.65);
}
.img-wrap img { width:100%; height:100%; object-fit:cover; display:block; }

/* Cover */
.cover-line { width:70px; height:4px; background:var(--accent); border-radius:2px; }
.cover h1 { font-size:clamp(2.5rem,7.5vw,5.5rem); }

/* Número */
.num {
    position:fixed; bottom:22px; right:30px; z-index:100;
    font-size:.68rem; font-weight:600; letter-spacing:.12em;
    color:rgba(255,255,255,.22);
}
.num em { color:rgba(255,255,255,.5); font-style:normal; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="num"><em id="cNum">1</em> / <span id="cTotal">1</span></div>
<div id="camWrap" style="display:none;position:fixed;z-index:50;cursor:move;user-select:none;overflow:hidden;">
    <video id="camFeed" autoplay muted playsinline style="display:block;width:100%;height:100%;object-fit:cover;"></video>
</div>
<script>
let slides=[], cur=0, busy=false;

function rgb(hex){
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return {r,g,b};
}
function setAccent(c){
    c=c||'#00d4ff';
    const {r,g,b}=rgb(c);
    const el=document.documentElement.style;
    el.setProperty('--accent',c);
    el.setProperty('--accent20',`rgba(${r},${g},${b},.2)`);
    el.setProperty('--accent40',`rgba(${r},${g},${b},.4)`);
}

function mark(t){ return (t||'').replace(/\|\|(.+?)\|\|/g,'<span class="acc">$1</span>'); }

function buildSlide(s,idx){
    const lines=(s.content||'').split('\n').map(l=>l.trim()).filter(Boolean);
    const bg=s.bg||'linear-gradient(145deg,#06060f,#0a0a2e)';
    const isFirst=idx===0, isLast=idx===slides.length-1;
    const isCover=s.layout==='cover'||(isFirst&&!s.layout)||(isLast&&!s.layout);
    let inner='';

    if(isCover){
        inner=`<div class="content cover">
            <div class="tag">${s.tag||''}</div>
            <div class="cover-line"></div>
            <h1>${mark(s.title||'')}</h1>
            ${lines[0]?`<p class="subtitle">${mark(lines.join(' · '))}</p>`:''}
        </div>`;
    } else if(s.layout==='highlight'){
        inner=`<div class="content" style="align-items:center;text-align:center;">
            <div class="tag" style="align-self:center;">${s.tag||''}</div>
            <h1>${mark(s.title||'')}</h1>
            <div class="hl-box">${mark(lines.join('<br>'))}</div>
        </div>`;
    } else if(s.layout==='image'){
        inner=`<div class="content">
            <div class="tag">${s.tag||''}</div>
            <h1>${mark(s.title||'')}</h1>
            <div class="img-wrap"><img src="${lines[0]||''}" alt="${s.title||''}"></div>
        </div>`;
    } else {
        inner=`<div class="content">
            <div class="tag">${s.tag||''}</div>
            <h1>${mark(s.title||'')}</h1>
            <ul class="bullets">${lines.map(l=>`<li>${mark(l)}</li>`).join('')}</ul>
        </div>`;
    }

    const d=document.createElement('div');
    d.className='slide'; d.dataset.index=idx;
    d.innerHTML=`
        <div class="slide-bg" style="background:${bg};"></div>
        <div class="geo geo-corner-tl"></div>
        <div class="geo geo-corner-br"></div>
        <div class="geo geo-vline"></div>
        <div class="geo geo-dot"></div>
        ${inner}
    `;

    // Elementos posicionados
    if(s.elements&&s.elements.length){
        const ov=document.createElement('div');
        ov.style.cssText='position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6;';
        s.elements.forEach((el,ei)=>{
            const dv=document.createElement('div');
            dv.style.cssText=`position:absolute;left:${el.x??0}%;top:${el.y??0}%;width:${el.w??20}%;height:${el.h??10}%;overflow:hidden;z-index:${ei+1};`;
            if(el.type==='text'){
                Object.assign(dv.style,{fontFamily:"'Inter',sans-serif",color:el.color||'#fff',fontSize:(el.fontSize||2.5)+'vw',fontWeight:el.bold?'700':'400',fontStyle:el.italic?'italic':'normal',textAlign:el.align||'left',lineHeight:'1.3',whiteSpace:'pre-wrap',display:'flex',alignItems:'flex-start',padding:'.3%'});
                dv.textContent=el.content||'';
            } else if(el.type==='image'){
                const img=document.createElement('img');
                img.src=el.content||''; img.style.cssText=`width:100%;height:100%;object-fit:${el.fit||'contain'};border-radius:4px;`;
                dv.appendChild(img);
            }
            ov.appendChild(dv);
        });
        d.appendChild(ov);
    }
    return d;
}

function load(data, startIdx=0){
    slides=data.slides||[];
    if(data.accentColor) setAccent(data.accentColor);
    const stage=document.getElementById('stage');
    stage.innerHTML='';
    slides.forEach((s,i)=>stage.appendChild(buildSlide(s,i)));
    document.getElementById('cTotal').textContent=slides.length;
    show(startIdx,false);
}

function show(idx, animate=true){
    if(!slides.length||busy) return;
    idx=Math.max(0,Math.min(idx,slides.length-1));
    const prev=document.querySelector('.slide.active');
    const next=document.querySelectorAll('.slide')[idx];
    if(!next||prev===next) return;
    if(animate&&prev){
        busy=true;
        prev.classList.add('exit');
        setTimeout(()=>{ prev.classList.remove('active','exit'); busy=false; },500);
    } else if(prev){ prev.classList.remove('active','exit'); }
    next.classList.add('active');
    cur=idx;
    document.getElementById('cNum').textContent=idx+1;
    try{ window.parent.postMessage({action:'slideChanged',index:idx},'*'); }catch(e){}
}

// Cámara
let camStream=null, camDrag=false, ox=0, oy=0;
const camWrap=document.getElementById('camWrap'), camFeed=document.getElementById('camFeed');
function camSz(size,shape){ const w=Math.round(window.innerWidth*(parseInt(size)/100)); return{w,h:shape==='circle'?w:Math.round(w*9/16)}; }
function camPos(pos,w,h){ const pad=Math.round(window.innerWidth*.018),vw=window.innerWidth,vh=window.innerHeight;
    if(pos==='tl')return{x:pad,y:pad}; if(pos==='tr')return{x:vw-w-pad,y:pad};
    if(pos==='bl')return{x:pad,y:vh-h-pad}; if(pos==='center')return{x:(vw-w)/2,y:(vh-h)/2};
    if(pos==='full')return{x:0,y:0}; return{x:vw-w-pad,y:vh-h-pad}; }
function applyCam(cfg){
    const isFull=cfg.pos==='full';
    const{w,h}=isFull?{w:window.innerWidth,h:window.innerHeight}:camSz(cfg.size,cfg.shape);
    const{x,y}=camPos(cfg.pos,w,h);
    const r=isFull?'0':cfg.shape==='circle'?'50%':Math.round(w*.06)+'px';
    camWrap.style.cssText=`position:fixed;z-index:50;cursor:move;user-select:none;width:${w}px;height:${h}px;left:${x}px;top:${y}px;border-radius:${r};overflow:hidden;border:${isFull?'none':'2px solid rgba(255,255,255,.55)'};box-shadow:${isFull?'none':'0 4px 24px rgba(0,0,0,.55)'};`;
    camFeed.style.cssText=`width:${w}px;height:${h}px;object-fit:cover;display:block;transform:scaleX(${cfg.mirror?-1:1});`;
}
async function startCam(cfg){
    if(!camStream){ try{ camStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); camFeed.srcObject=camStream; }catch(e){return;} }
    applyCam(cfg); camWrap.style.display='block';
    if(window.parent!==window.top) camWrap.style.display='none';
}
function stopCam(){ camWrap.style.display='none'; if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;} camFeed.srcObject=null; }
camWrap.addEventListener('pointerdown',e=>{camDrag=true;ox=e.clientX-camWrap.offsetLeft;oy=e.clientY-camWrap.offsetTop;camWrap.setPointerCapture(e.pointerId);});
camWrap.addEventListener('pointermove',e=>{if(camDrag){camWrap.style.left=(e.clientX-ox)+'px';camWrap.style.top=(e.clientY-oy)+'px';}});
camWrap.addEventListener('pointerup',()=>camDrag=false);

window.addEventListener('message',e=>{
    const d=e.data; if(!d)return;
    if(d.action==='load'&&d.slides) load(d,d.index??0);
    if(d.action==='goto') show(d.index);
    if(d.action==='next') show(cur+1);
    if(d.action==='prev') show(cur-1);
    if(d.action==='camera'){if(d.enabled)startCam(d);else stopCam();}
});
document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') show(cur+1);
    if(e.key==='ArrowLeft'||e.key==='ArrowUp') show(cur-1);
});
</script>
</body>
</html>
